name: Mobile CI

on:
  push:
    branches: [main, feature/mobile-app, feature/manusai-mobile]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Node tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync native web assets
        run: npm run sync

      - name: Run tests
        run: node --test

  android:
    name: Android debug APK
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install the project's Android SDK level
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm ci

      - name: Build and sync the Android web assets
        run: npm run sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cci-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator app (unsigned)
    needs: tests
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build and sync the iOS web assets
        run: npm run sync:ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS Simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/cci-ios-derived"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package iOS Simulator app
        run: |
          app_path="$(find "$RUNNER_TEMP/cci-ios-derived" "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Debug-iphonesimulator/App.app' -print -quit 2>/dev/null)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$RUNNER_TEMP/CCI-DiscipleshipStudy-iOS-Simulator.zip"

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cci-ios-simulator-app
          path: ${{ runner.temp }}/CCI-DiscipleshipStudy-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
