for relatives demonstrates that the believer has misunderstood the doctrine of grace.\nANSWER: C\nEXPLANATION: The lesson treats the absence of practical care in this example as inconsistent with a profession of Christian faith.\nREF: HAVING A BIBLICAL WORLDVIEW II – Celebration Church International - LMS.mp4 — [14:41]–[15:58] (approximate range)\n\nQ16. What is the strongest indication that biblical interpretation is being done correctly?\nA. The believer becomes more confident when defending doctrine\nB. The believer develops greater knowledge of historical and theological details\nC. The believer becomes increasingly skilled at identifying erroneous interpretations\nD. The knowledge drives the believer toward worship and greater response to God\nANSWER: D\nEXPLANATION: The lesson says correctly interpreted knowledge should lead to worship and a greater response to God.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION III – Celebration Church International - LMS.mp4 — [16:44]–[20:09] (approximate range)\n\nQ17. What does \"where the Spirit of the Lord is, there is liberty\" mean in its immediate interpretive context?\nA. Freedom to express oneself physically during church services\nB. Freedom from the veil so that believers can behold the glory and intent of God's writings\nC. Freedom from the need to interpret Scripture according to its original context\nD. Freedom from the authority of the Old Testament because the Spirit has replaced Scripture\nANSWER: B\nEXPLANATION: In context, liberty means the veil is removed so the writings’ meaning and God’s glory can be seen.\nREF: HERMENEUTICS (PART 2) I – Celebration Church International - LMS.mp4 — [17:45]–[18:32] (approximate range)\n\nQ18. The lesson on hermeneutics uses the description of Christ as \"the express image of his person\" to emphasize that:\nA. Christ's teachings are more practical than those of the prophets\nB. Christ represents the cultural fulfillment of Old Testament prophecy\nC. Christ is the final prophet through whom the Old Testament can be interpreted\nD. In Christ, we understand exactly who God is\nANSWER: D\nEXPLANATION: The lesson says Christ reveals exactly who God is.\nREF: HERMENEUTICS (PART 1) II – Celebration Church International - LMS.mp4 — [01:13]–[02:57] (approximate range)\n\nQ19. Which pair correctly matches the biblical statement with the figure of speech identified in the hermeneutics lesson?\nA. \"I am the door\" - simile\nB. \"Behold, I send you forth as sheep\" - metaphor\nC. \"I am the vine\" - hyperbole\nD. \"I send you forth as sheep in the midst of wolves\" - simile\nANSWER: D\nEXPLANATION: The lesson identifies the comparison using “as” as a simile.\nREF: HERMENEUTICS (PART 1) I – Celebration Church International - LMS.mp4 — [09:27]–[10:36] (approximate range)\n\nQ20. Which combination accurately reflects the languages identified in the lesson?\nA. Old Testament - Hebrew and Aramaic; New Testament - Koine Greek\nB. Old Testament - Hebrew and Greek; New Testament - Aramaic and Greek\nC. Old Testament - Hebrew only; New Testament - Koine Greek and Latin\nD. Old Testament - Aramaic and Latin; New Testament - Hebrew and Koine Greek\nANSWER: A\nEXPLANATION: The lesson identifies Hebrew and Aramaic for the Old Testament and Koine Greek for the New Testament.\nREF: HERMENEUTICS (PART 1) I – Celebration Church International - LMS.mp4 — [05:26]–[06:27] (approximate range)\n\nQ21. Stephen's description of his Jewish audience as \"uncircumcised in the heart\" is used in the lesson on hermeneutics to establish what distinction?\nA. Physical circumcision could exist without the spiritual reality it was intended to signify\nB. Physical circumcision was never actually commanded by God\nC. The Jews had abandoned the practice of circumcision before Stephen addressed them\nD. Circumcision of the heart was exclusively a New Testament doctrine with no Old Testament precedent\nANSWER: A\nEXPLANATION: The lesson distinguishes physical circumcision from the spiritual reality of circumcision of the heart.\nREF: HERMENEUTICS (PART 2) II – Celebration Church International - LMS.mp4 — [14:44]–[16:44] (approximate range)\n\nQ22. Which interpretation does the lesson on Hermeneutics explicitly reject concerning the statement \"the letter kills\"?\nA. That \"the letter\" specifically refers to the law written on stones\nB. That the statement refers to the law in contrast with the ministry of the Spirit\nC. That \"the letter\" means the entire Bible is incapable of giving life without a personal rhema\nD. That Paul was contrasting the ministry associated with the law with the ministry of the New Testament\nANSWER: C\nEXPLANATION: The lesson rejects applying “the letter kills” to the entire Bible or claiming Scripture needs a personal rhema to give life.\nREF: HERMENEUTICS (PART 2) I – Celebration Church International - LMS.mp4 — [06:32]–[07:19] (approximate range)\n\nQ23. Which statement most accurately distinguishes \"sundry times\" from \"diverse manners\" according to the lesson?\nA. Sundry times concerns different prophets, while diverse manners concerns different generations\nB. Sundry times concerns prophecy, while diverse manners concerns Scripture\nC. Sundry times refers to communication in many different parts, while diverse manners refers to different modes of communication\nD. Sundry times refers to Old Testament communication, while diverse manners refers exclusively to New Testament communication\nANSWER: C\nEXPLANATION: The lesson distinguishes communication given in many parts from communication delivered through different modes.\nREF: HERMENEUTICS (PART 1) II – Celebration Church International - LMS.mp4 — [02:57]–[03:55]; HERMENEUTICS (PART 2) I – Celebration Church International - LMS.mp4 — [01:46]–[02:44] (approximate ranges)\n\nQ24. The instruction to read \"per book, per chapter\" is specifically intended to prevent the interpreter from:\nA. Relying on individual verses instead of the full counsel of Scripture\nB. Removing a text from its context and assigning meaning based on the words alone\nC. Reading Scripture according to personal experiences and previously held convictions\nD. Reading Scripture according to personal experiences and previously held convictions\nANSWER: B\nEXPLANATION: Reading by book and chapter helps prevent taking a text out of its context.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION II – Celebration Church International - LMS.mp4 — [03:33]–[04:26] (approximate range)\n\nQ25. Romans 16:16 is primarily an example of which interpretation barrier according to the lesson on Biblical Interpretation?\nA. Translation\nB. Language\nC. Culture\nD. Doctrine\nANSWER: C\nEXPLANATION: The lesson uses Romans 16:16 to show how culture affects interpretation of a biblical instruction.\nREF: HERMENEUTICS (PART 1) I – Celebration Church International - LMS.mp4 — [12:45]–[15:57] (approximate range)\n\nQ26. According to the hermeneutics lesson, why can an honest and careful translation still make Bible interpretation difficult?\nA. Translators inevitably change the doctrines of the original writers\nB. Biblical languages cannot adequately express spiritual realities in English\nC. English translations necessarily remove figures of speech from the text\nD. Some meaning and nuance can become less immediately clear through translation\nANSWER: D\nEXPLANATION: A faithful translation can still make the intended meaning difficult to understand, so interpretation may be needed.\nREF: HERMENEUTICS (PART 1) I – Celebration Church International - LMS.mp4 — [05:26]–[06:27]; INTRODUCTION TO BIBLICAL INTERPRETATION II – Celebration Church International - LMS.mp4 — [05:56]–[08:17] (approximate ranges)\n\nQ27. Which text does the lesson on Bible Interpretation identify as having had an exceptionally significant impact on world history?\nA. John 3:16\nB. John 1:1\nC. 2 Corinthians 2:11\nD. Galatians 3:11\nANSWER: D\nEXPLANATION: The lesson identifies Galatians 3:11 as having had exceptional historical impact.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION I – Celebration Church International - LMS.mp4 — [07:05]–[09:26] (approximate range)\n\nQ28. In Having a Biblical Worldview, \"Your word is a lamp unto my feet and a light unto my path\" was used to mean:\nA. Scripture gives believers insight into God's specific plan for their future.\nB. Scripture orders the believer's steps and determines how they navigate life.\nC. Scripture provides principles by which believers can evaluate their circumstances.\nD. Scripture gives believers sufficient wisdom to make decisions without external counsel.\nANSWER: B\nEXPLANATION: The lesson uses the verse to describe Scripture as a guide for navigating life and ordering one’s steps.\nREF: HAVING A BIBLICAL WORLDVIEW I – Celebration Church International - LMS.mp4 — [06:51]–[07:50] (approximate range)\n\nQ29. Which combination best reflects the progression identified in Isaiah 53 within the lesson on hermeneutics?\nA. Christ's incarnation -> earthly ministry -> ascension -> enthronement\nB. Christ's rejection and suffering -> bearing of sin -> death -> resurrection implied\nC. Israel's rejection -> restoration -> establishment of the church -> final judgment\nD. The law -> the prophets -> the gospel -> justification by works\nANSWER: B\nEXPLANATION: The lesson traces Christ’s rejection and suffering, sin-bearing, death, and implied resurrection through Isaiah 53.\nREF: HERMENEUTICS (PART 2) II – Celebration Church International - LMS.mp4 — [03:05]–[07:13] (approximate range)\n\nQ30. The biblical worldview becomes evident when the Word of God becomes the believer's:\nA. Standard for evaluating spiritual experiences\nB. Foundation for establishing doctrinal convictions\nC. Guide for making decisions concerning Christian practice\nD. Lens through which they see the world\nANSWER: D\nEXPLANATION: The lesson describes a biblical worldview as seeing the world through the lens of God’s Word.\nREF: HAVING A BIBLICAL WORLDVIEW I – Celebration Church International - LMS.mp4 — [06:51]–[07:50] (approximate range)\n\nDECK: Discipleship Experience (Section 8) Bible Experience II\n\nQ1. What is Matthew primarily demonstrating through his repeated references to Old Testament prophecy?\nA. That Jesus' ministry followed the traditions of Israel\nB. That Jesus is the Messiah the Old Testament had prophesied about\nC. That Jesus was a teacher who restored Old Testament practices\nD. That the events of Jesus' life resembled those of earlier prophets\nANSWER: B\nEXPLANATION: Matthew repeatedly presents Jesus as the Messiah prophesied in the Old Testament.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 00:15–01:17\n\nQ2. How does the lesson reconcile God's sovereignty with human free will?\nA. Human freedom exists only when God is not involved\nB. God can accomplish His purposes without overriding human choices\nC. Human choices ultimately determine whether God's plans succeed\nD. God's sovereignty means human choices have no real significance\nANSWER: B\nEXPLANATION: God can fulfill his purposes while human choices remain consequential and are not overridden.\nREF: THE INSPIRATION OF SCRIPTURES — 08:49–09:44\n\nQ3. What is the danger of reading Scripture without a Christ-centered lens?\nA. We can miss how different parts of Scripture point to Christ\nB. We may focus too much on the historical setting of the Bible\nC. We may give Old Testament passages more authority than New Testament passages\nD. We may interpret every passage literally instead of symbolically\nANSWER: A\nEXPLANATION: A Christ-centered lens helps readers see how different parts of Scripture point to Christ.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 05:29–10:48\n\nQ4. Which resource is particularly useful when the difficulty lies in the meaning or usage of biblical words?\nA. A devotional book\nB. A biography of a biblical character\nC. A lexicon or Bible dictionary\nD. A collection of modern Christian testimonies\nANSWER: C\nEXPLANATION: A lexicon or Bible dictionary can help clarify biblical word meanings and changes in usage.\nREF: CAN I UNDERSTAND THE BIBLE ON MY OWN. — 03:56–04:56\n\nQ5. Why does the lesson describe the Bible as a \"library\"?\nA. It contains books written for different audiences only\nB. It is composed of multiple books rather than being a single literary work\nC. It was originally stored in a library\nD. Its books were compiled by one group of editors\nANSWER: B\nEXPLANATION: The Bible is described as a library because it consists of multiple books.\nREF: THE INSPIRATION OF SCRIPTURES — 09:44–10:47\n\nQ6. What does the repetition of sacrifices communicate?\nA. That the sacrifices had to be performed correctly each time\nB. That Israel had not yet fully understood the purpose of the law\nC. That the sacrifices themselves were not the ultimate and complete sacrifice\nD. That forgiveness depended on continual participation in the sacrificial system\nANSWER: C\nEXPLANATION: The repeated sacrifices pointed to Christ as the ultimate sacrifice rather than being complete in themselves.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 09:03–09:59\n\nQ7. What assumption about divine guidance does the lesson challenge?\nA. That God can use circumstances to lead people\nB. That God's guidance must always come through recognizable means.\nC. That Scripture is important for understanding God's will\nD. That God can work through human decisions\nANSWER: B\nEXPLANATION: The lesson challenges limiting divine guidance to audible or otherwise immediately recognizable means and highlights providence.\nREF: THE INSPIRATION OF SCRIPTURES — 01:48–04:59\n\nQ8. What does biblical inerrancy mean within the lesson's framework?\nA. Every biblical statement must satisfy modern scientific expectations\nB. Scripture contains no errors of truth in what it teaches\nC. Every biblical description must use technically precise modern language\nD. Every passage must be interpreted literally\nANSWER: B\nEXPLANATION: Inerrancy means Scripture has no errors of truth in what it teaches.\nREF: THE INSPIRATION OF SCRIPTURES — 17:23–18:37\n\nQ9. What connection does the lesson make between Joshua and Jesus?\nA. Both were prophets who performed similar miracles\nB. Joshua was presented as the first human king pointing toward Jesus\nC. Their names are essentially the same, providing a picture pointing toward Jesus\nD. Jesus repeated Joshua's military victories in His earthly ministry\nANSWER: C\nEXPLANATION: The lesson connects Joshua and Jesus through their names and presents Joshua as a type pointing to Christ.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 10:48–11:51\n\nQ10. Why can the Old Testament tell Christ's story without mentioning His name throughout?\nA. Because the Old Testament was written mainly as historical literature\nB. Because Christ is revealed through different events and prophecies that come together\nC. Because the identity of the Messiah was intentionally hidden until the New Testament\nD. Because the Old Testament focuses more on Israel than on individual people\nANSWER: B\nEXPLANATION: The lesson says Christ’s story appears in different parts of the Old Testament and becomes clearer when those pieces are brought together.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 04:35–06:10\n\nQ11. What is the key distinction in the statement that God did not make Pharaoh wicked?\nA. God can use the consequences of human wickedness without being its author\nB. God cannot influence events involving wicked people\nC. Pharaoh's wickedness was necessary for God's plan\nD. Human wickedness is outside God's sovereignty\nANSWER: A\nEXPLANATION: God can work through Pharaoh’s wicked actions without being the one who made him wicked.\nREF: THE INSPIRATION OF SCRIPTURES — 08:49–09:44\n\nQ12. What does it mean to say that the Bible is \"written for you, but not written to you\"?\nA. Its teachings are relevant only to its original audience\nB. Modern Christians should avoid applying historical passages\nC. Its message reaches us, while its original context belongs to another audience\nD. Every passage requires a completely different interpretation today\nANSWER: C\nEXPLANATION: The Bible can speak to modern readers while retaining its original audience and context.\nREF: CAN I UNDERSTAND THE BIBLE ON MY OWN. — 03:02–03:56\n\nQ13. What meaning of gune is highlighted in the lesson?\nA. It refers exclusively to an unmarried woman\nB. It can refer either to a wife or to a woman generally\nC. It refers exclusively to a female church leader\nD. It always refers to women collectively rather than individually\nANSWER: B\nEXPLANATION: The lesson says the Greek term can mean a married wife or women generally, depending on context.\nREF: JESUS AND WOMEN — 24:20–25:16\n\nQ14. What distinguishes mature appreciation of God from a merely pragmatic relationship with Him?\nA. Wanting God's blessings while remaining committed to doctrine\nB. Seeking God's guidance before making decisions\nC. Appreciating who God is, not merely what He can provide\nD. Studying Scripture primarily to solve personal problems\nANSWER: C\nEXPLANATION: The lesson distinguishes appreciating God for who He is from focusing only on what He can do or give.\nREF: THE INSPIRATION OF SCRIPTURES — 01:05–01:48\n\nQ15. When a biblical practice does not translate directly into a modern culture, what should the believer first seek?\nA. The principle the practice was communicating\nB. A modern equivalent with exactly the same form\nC. A reason to remove the passage from application\nD. The interpretation most accepted within the believer's culture\nANSWER: A\nEXPLANATION: When a specific practice is cultural, the lesson says to identify the principle it communicates.\nREF: CAN I UNDERSTAND THE BIBLE ON MY OWN. — 08:34–09:06\n\nQ16. Why does the lesson reject the argument that an apparent scientific inconsistency automatically disproves Scripture?\nA. Scientific knowledge is never reliable\nB. Biblical writers were scientifically trained\nC. Scripture should not be judged as though its purpose were to function as a science textbook\nD. Scientific questions cannot be discussed from Scripture\nANSWER: C\nEXPLANATION: The lesson says Scripture should not be judged by standards outside its purpose, such as functioning as a science book.\nREF: THE INSPIRATION OF SCRIPTURES — 17:23–18:37\n\nQ17. What is the main interpretive danger of treating every biblical statement literally?\nA. It can cause figures of speech to be mistaken for factual descriptions\nB. It can make historical passages appear less important\nC. It can cause readers to reject difficult doctrines\nD. It can prevent readers from studying original languages\nANSWER: A\nEXPLANATION: Treating figurative language literally can obscure the meaning the speaker intended.\nREF: CAN I UNDERSTAND THE BIBLE ON MY OWN. — 05:54–07:52\n\nQ18. Who first encountered the risen Jesus?\nA. Peter and John\nB. The male disciples\nC. The women\nD. The religious leaders\nANSWER: C\nEXPLANATION: The lesson identifies women as the first witnesses to the risen Jesus.\nREF: JESUS AND WOMEN — 08:36–09:38\n\nQ19. What two aspects of Christ's work are emphasized in the lesson?\nA. His teaching ministry and His miracles\nB. His earthly ministry and His resurrection appearances\nC. His public sacrifice and His heavenly intercession\nD. His birth and His ascension\nANSWER: D\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 08:03–09:03\n\nQ20. How does the lesson describe the Old Testament's presentation of Christ?\nA. Christ is revealed gradually, in pieces and through different parts of Scripture\nB. Christ is revealed almost entirely through direct Messianic statements\nC. Christ is revealed mainly through the writings of the prophets\nD. Christ is revealed only through the sacrificial system\nANSWER: A\nEXPLANATION: The lesson describes Christ as revealed through pieces of the Old Testament that come together into a fuller picture.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 04:35–06:10\n\nQ21. How does Romans 16 describe Phoebe?\nA. As a prophet and teacher\nB. As a servant/deacon\nC. As an apostle and elder\nD. As a missionary who planted churches\nANSWER: B\nEXPLANATION: The lesson says Romans 16 describes Phoebe as a servant, using the same word translated “deacon.”\nREF: JESUS AND WOMEN — 12:21–13:20\n\nQ22. When a biblical passage is difficult, what should guide its interpretation?\nA. Clearer and better-established biblical evidence\nB. The interpretation most commonly accepted by Christians\nC. The meaning that appears most literal at first reading\nD. The cultural assumptions of the modern reader\nANSWER: A\nEXPLANATION: The lesson recommends using what is known and established to help interpret difficult passages.\nREF: JESUS AND WOMEN — 10:38–11:25\n\nQ23. The \"jigsaw puzzle\" picture of Scripture mainly emphasizes what?\nA. Every biblical passage can be understood independently\nB. The Bible contains unrelated pieces that require different methods of interpretation\nC. Individual pieces of revelation come together to give a fuller picture of Christ\nD. Difficult passages should be ignored until all other passages have been understood\nANSWER: C\nEXPLANATION: The lesson uses the jigsaw image for bringing separate scriptural pieces together to reveal Christ.\nREF: DID OLD TESTAMENT AUTHORS KNOW JESUS — 05:29–06:10\n\nQ24. What concept does the lesson identify as a primary way God can direct events?\nA. Divine providence\nB. Human intuition\nC. Audible instruction\nD. Spiritual symbolism\nANSWER: A\nEXPLANATION: The lesson directly identifies divine providence as a primary way God leads.\nREF: THE INSPIRATION OF SCRIPTURES — 04:59–05:45\n\nQ25. According to the lesson, what resource cannot simply be replaced by independent study tools?\nA. A newer Bible translation\nB. A Bible teacher\nC. A Bible dictionary\nD. A commentary\nANSWER: B\nEXPLANATION: The lesson presents a Bible teacher as important beyond independent study tools such as lexicons and commentaries.\nREF: CAN I UNDERSTAND THE BIBLE ON MY OWN. — 09:53–10:48\n\nQ26. Joseph's brothers unintentionally contributed to the very outcome they were trying to prevent. What does this illustrate?\nA. Human opposition can unknowingly become part of providential fulfillment\nB. God removes human responsibility when He has a plan\nC. Joseph's brothers were unknowingly righteous\nD. Divine plans require people to understand them beforehand\nANSWER: A\nEXPLANATION: The lesson uses Joseph’s brothers to show that opposition can unintentionally further the outcome God intends.\nREF: THE INSPIRATION OF SCRIPTURES — 06:24–07:06\n\nQ27. According to the lesson, Galatians 3:28 primarily reinforces what?\nA. Men and women should have identical responsibilities in every setting\nB. There is no distinction between men and women in their standing in Christ\nC. Women were given authority over men within the church\nD. Cultural distinctions between men and women no longer existed\nANSWER: B\nEXPLANATION: The lesson presents Galatians 3:28 as affirming that men and women are one in Christ.\nREF: JESUS AND WOMEN — 01:01–01:52\n\nQ28. How does the lesson approach 1 Corinthians 14:34, where women are told to keep silent?\nA. It interprets the instruction within the chapter's context of spiritual gifts, prophecy, order, and confusion\nB. It treats the instruction as a universal command against women speaking in church\nC. It concludes that Paul changed his position on women between 1 Corinthians and Romans\nD. It interprets \"silence\" as a command for women to avoid all forms of public ministry\nANSWER: A\nEXPLANATION: The lesson interprets the instruction in the chapter’s context of spiritual gifts, prophecy, and maintaining order.\nREF: JESUS AND WOMEN — 16:18–18:14\n\nQ29. What does the lesson's example of Cornelius and Peter primarily emphasize?\nA. God can use people as instruments in communicating foundational truth\nB. Spiritual experiences are unnecessary for understanding Scripture\nC. Every believer must receive revelation directly from God\nD. Lens through which they see the world\nANSWER: A\nEXPLANATION: The lesson uses Cornelius and Peter to emphasize God’s use of people to teach foundational truths.\nREF: CAN I UNDERSTAND THE BIBLE ON MY OWN. — 10:48–11:46\n\nDECK: Discipleship Experience (Section 9) Evangelism\n\nQ1. What is the problem the lesson raises when pantheism says that everything is divine?\nA. It means that people can no longer distinguish between actions that are socially acceptable and those that are not.\nB. It makes it difficult to explain why people disagree about what is good and evil.\nC. It means that good and evil become dependent on individual opinions rather than being understood through spiritual truth.\nD. If everything is divine and inherently good, it becomes difficult to account for real evil and suffering that is objectively wrong.\nANSWER: D\nEXPLANATION: Pantheism’s claim that all is divine and good conflicts with the reality of genuinely wrong evil and suffering.\nREF: NEW AGE SPIRITUALITY II — 08:19–11:14\n\nQ2. According to the Mormon doctrine described in the lesson, how is God the Father understood?\nA. As a glorified physical being who passed through a mortal experience before attaining His present exalted state.\nB. As an eternal, non-created God who has always existed as God.\nC. As an exalted human who became God only after creating the physical universe.\nD. As the first spirit being created by Jesus before the creation of humanity.\nANSWER: A\nEXPLANATION: The lesson describes the Mormon doctrine of the Father as a glorified physical being who experienced mortality before exaltation.\nREF: MORMONS II — 00:17–01:14\n\nQ3. Which of these is the most important reason we should share the gospel?\nA. Christians have been given the responsibility of convincing people that Christianity is true.\nB. People are more likely to believe when Christians consistently speak about their faith.\nC. There is death and life, and life is found in Christ and Christ alone.\nD. People need to hear Christian beliefs before they can make informed decisions about faith.\nANSWER: C\nEXPLANATION: The lesson gives the contrast between death and life, and identifies Christ as the source of eternal life, as the reason to share the gospel.\nREF: HOW TO EVANGELIZE — 01:38–02:31\n\nQ4. Why does the lesson use John 1:1-3 and Colossians 1:16-17 in challenging the Mormon understanding of Jesus?\nA. They show that Jesus became equal with God after He completed His earthly ministry.\nB. They show that Jesus was the first spirit being created by God.\nC. They show that Jesus became God's Son when He was born as a human being.\nD. They show that Jesus was with God in the beginning, is God, and that all things were created through Him.\nANSWER: D\nEXPLANATION: The lesson uses these passages to present Jesus as divine, present with God from the beginning, and involved in creation.\nREF: MORMONS II — 03:08–05:07\n\nQ5. According to the lesson, which activity is specifically evangelism?\nA. Sharing about your faith and telling someone about Jesus.\nB. Serving people with the resources and opportunities God has given you.\nC. Learning Christian doctrine so you can respond when someone challenges your faith.\nD. Using your conduct to demonstrate what it looks like to live as a Christian.\nANSWER: A\nEXPLANATION: The lesson defines evangelism as sharing one’s faith and telling someone about Jesus.\nREF: HOW TO EVANGELIZE — 02:31\n\nQ6. What does the lesson identify as a major issue with the Seventh-day Adventist understanding of atonement?\nA. They believe the Old Testament sacrifices were sufficient.\nB. They believe the atonement is unfinished and that Jesus is presently making atonement.\nC. They believe Jesus did not die for sin.\nD. They believe sin has already completely ended.\nANSWER: B\nEXPLANATION: The lesson characterizes the Adventist position as an unfinished atonement with Jesus presently making atonement.\nREF: JEHOVA’S WITNESS IV — 08:51–12:19\n\nQ7. What does the lesson identify as a major difference between Christianity and Islam concerning humanity's relationship with God?\nA. Christians believe everyone is automatically a child of God, while Muslims believe only prophets are children of Allah.\nB. Christians believe God's children cannot sin, while Muslims believe they can.\nC. Christians believe God created humanity, while Muslims believe Allah created only Muslims.\nD. Christians can speak of being adopted into God's family and called children of God, while Islam does not present this same relationship.\nANSWER: D\nEXPLANATION: The lesson contrasts Christian adoption into God’s family with the relationship it describes in Islam.\nREF: MUSLIMS I — 10:28–11:07\n\nQ8. What does the lesson describe as the connection between the New Age promise of control and Genesis 3?\nA. Both present the possibility of becoming like God by gaining a higher form of knowledge.\nB. Both encourage people to seek knowledge so they can understand the difference between good and evil.\nC. Both present the idea of becoming like God and defining good and evil for yourself.\nD. Both teach that human beings can become wiser by discovering their own spiritual nature.\nANSWER: C\nEXPLANATION: The lesson links the New Age promise of control with Genesis 3’s offer of becoming like God and defining good and evil oneself.\nREF: NEW AGE SPIRITUALITY I — 14:06–14:52\n\nQ9. Why is Isaiah 44:24 important to the argument about Jesus as Creator?\nA. It teaches that Jehovah created the world through an angel.\nB. It says Jehovah created the heavens and earth \"by myself,\" making Jesus' role as Creator significant.\nC. It teaches that Jehovah created only the heavens.\nD. It teaches that Jesus created the world before His incarnation.\nANSWER: B\nEXPLANATION: The lesson contrasts Isaiah’s statement that Jehovah created alone with New Testament passages presenting Jesus as Creator.\nREF: JEHOVA’S WITNESS IV — 02:34–04:05\n\nQ10. A Muslim keeps asking a new question immediately after the Christian answers the previous one. Based on the lesson, what should the Christian do?\nA. Change the subject to another Islamic doctrine before answering.\nB. Answer every question immediately so the Muslim cannot change the subject.\nC. Stop the conversation because asking multiple questions means the Muslim is not interested.\nD. Take the steering of the conversation by identifying the actual stumbling block and asking whether resolving it removes that objection.\nANSWER: D\nEXPLANATION: The lesson advises identifying the actual objection and checking whether resolving it would remove the person’s stumbling block.\nREF: MUSLIMS III — 12:14–13:22\n\nQ11. Which sequence represents the Mormon teaching about humanity described in the lesson?\nA. Humans existed as premortal spirits, entered earthly life, and are expected to progress toward exaltation and become gods.\nB. Humans are created physically, die, become spirits, and may eventually become gods.\nC. Humans existed as angels, became physical beings, and return to angelic form after death.\nD. Humans were created in God's image, become spiritually separated from Him, and regain God's nature through good works.\nANSWER: A\nEXPLANATION: The lesson describes a premortal existence, earthly life, and progression toward becoming gods.\nREF: MORMONS II — 05:07–06:11\n\nQ12. How does the lesson use Colossians 2:16-17 and Acts 15 in his argument about the Sabbath?\nA. To show that the Jerusalem Council transferred the Sabbath requirement from Jewish Christians to Gentile Christians.\nB. To establish Sunday as the new Christian Sabbath.\nC. To argue that the Sabbath belonged to the shadows pointing toward Christ and that the Mosaic requirement was not imposed upon Gentile believers.\nD. To establish that the seventh-day Sabbath was never commanded by God.\nANSWER: C\nEXPLANATION: The lesson uses Colossians 2 and Acts 15 to argue that the Sabbath pointed to Christ and was not imposed as a Mosaic requirement on Gentile believers.\nREF: MORMONS III — 02:07–02:59\n\nQ13. What does the lesson say there is something in every person that causes them to look for God. What important distinction is made about this search?\nA. People can genuinely be yearning for the divine while still searching for God in a misguided form.\nB. People may search for God through different spiritual beliefs, but the search itself shows that they have recognized the truth about God.\nC. People have a natural desire for the divine, but that desire does not necessarily mean they have correctly understood who God is.\nD. People who are searching for God are already moving in the right direction, even when their understanding of God is incomplete.\nANSWER: C\nEXPLANATION: The lesson distinguishes the desire to seek God from correctly understanding who God is.\nREF: NEW AGE SPIRITUALITY I — 00:56–03:23\n\nQ14. What do Jehovah's Witnesses believe about death, according to the lesson?\nA. The spirit remains consciously alive after death.\nB. Everyone immediately appears before God after death.\nC. Death is the complete end of both body and soul until the resurrection.\nD. The soul immediately enters heaven or hell.\nANSWER: C\nEXPLANATION: The lesson says Jehovah’s Witnesses teach that death ends both body and soul until the resurrection.\nREF: JEHOVA’S WITNESS II — 09:03–10:02\n\nQ15. What is the lesson's central objection to the Adventist chronology of Christ's heavenly ministry?\nA. Hebrews teaches that Christ entered the heavenly sanctuary only after the investigative judgment had already been completed.\nB. Hebrews teaches that Christ entered the holy place once for all by His own blood, securing eternal redemption, rather than returning later to begin another atoning phase.\nC. Hebrews teaches that Christ's priesthood ended immediately after His resurrection.\nD. Hebrews teaches that Christ is not the High Priest in heaven.\nANSWER: B\nEXPLANATION: The lesson contrasts Christ’s once-for-all entrance and eternal redemption with the Adventist chronology of a later investigative judgment.\nREF: MORMONS II — 14:50–15:39\n\nQ16. Why does the lesson challenge the statement \"the real religion is love\"?\nA. Because saying that love is the real religion does not explain which religious practices are correct.\nB. Because asking what \"love\" means reveals that different religions can give very different definitions of what love is.\nC. Because love is only properly understood through Christianity.\nD. Because some religions place more emphasis on love than others.\nANSWER: B\nEXPLANATION: The lesson challenges the statement by noting that religions can define love differently.\nREF: NEW AGE SPIRITUALITY III — 02:32–03:31\n\nQ17. According to the lesson, what is presented as the central theme that holds every Muslim together?\nA. Allah is the creator and Muhammad is the greatest prophet.\nB. There is no god but Allah and Muhammad is the messenger of Allah.\nC. Allah is one and Muslims must follow the five major practices.\nD. Jesus is the Messiah and Muhammad is the final messenger.\nANSWER: B\nEXPLANATION: The lesson identifies this confession as Islam’s central theme and says it is called the shahada.\nREF: MUSLIMS I — 02:48–04:01\n\nQ18. The Lesson uses Jude 1:3 to establish that Christians are to \"contend for the faith that was first delivered unto the saints.\" What specific idea does he draw from this?\nA. Christianity is definite because anyone who sincerely identifies with Jesus is necessarily holding the same faith.\nB. Christianity has a recognizable pattern of belief that can be traced to what was originally delivered and believed.\nC. Christians must defend every practice that has been associated with Christianity throughout history.\nD. Christianity is authoritative because all Christians throughout history have belonged to the same denomination.\nANSWER: B\nEXPLANATION: The lesson draws from Jude 1:3 that the Christian faith has a definite, recognizable pattern traceable to what was originally believed.\nREF: MORMONS I — 00:00–01:54\n\nQ19. What is the purpose of meditation as described in the lesson?\nA. To focus deeply on God's Word until we become spiritually sensitive enough to receive what God wants to say.\nB. To meditate on Scripture until the truth of God's Word becomes a reality in our lives.\nC. To retain the consciousness of what God's Word says so that we may observe and do according to it.\nD. To repeatedly speak God's Word until it becomes deeply established in the mind.\nANSWER: C\nEXPLANATION: The lesson describes Christian meditation as retaining awareness of God’s Word in order to observe and do what it says.\nREF: NEW AGE SPIRITUALITY III — 08:20–09:35\n\nQ20. Which statement most accurately captures the definition of pantheism given in the lesson?\nA. Everything in creation contains something divine because the universe is an extension of God's presence.\nB. All reality is one divine substance of consciousness; God is not separate from creation, and everything created is divine.\nC. God exists throughout creation and can be experienced through everything that exists.\nD. God created the universe and remains present within it, making creation a reflection of God's divine nature.\nANSWER: B\nEXPLANATION: The lesson defines pantheism as one divine reality in which God is not separate from creation.\nREF: NEW AGE SPIRITUALITY II — 08:19–09:22\n\nQ21. What does the lesson identify as one of the beauties of Christianity when it comes to human pain?\nA. Christianity introduces us to a God who identifies with our pain and comforts us in our suffering.\nB. Christianity teaches that emotional pain is evidence that someone has sinned.\nC. Christianity gives people a way to avoid pain completely.\nD. Christianity teaches that people should understand the reason behind every painful experience.\nANSWER: A\nEXPLANATION: The lesson says Christianity presents a God who empathizes with human pain and comforts people in suffering.\nREF: NEW AGE SPIRITUALITY II — 02:51–05:00\n\nQ22. Why does the lesson reject the argument that \"God\" and \"Allah\" are simply different language terms for the same God?\nA. Because Allah is presented as a God of judgment while the biblical God is presented only as a God of love.\nB. Because Muslims and Christians use different names for Jesus.\nC. Because we can only know God by how God introduces himself.\nD. Because the names Abraham, Moses and David are also different in Islam.\nANSWER: C\nEXPLANATION: The lesson argues that the names alone do not establish that the two faiths refer to the same God; it compares their descriptions of God.\nREF: MUSLIMS I — 05:31–08:11\n\nQ23. What is the distinction the lesson makes between manifestation and faith?\nA. Manifestation seeks something through spiritual means, while faith seeks something through God's means.\nB. Manifestation looks to the universe for something to happen, while faith looks to God for something to happen.\nC. Manifestation is based on what a person wants to receive, while faith is based on what a person believes God can provide.\nD. Manifestation is about trying to conjure something into existence, while faith is a response and alignment to what God has already said.\nANSWER: D\nEXPLANATION: The lesson contrasts attempts to manifest or conjure outcomes with faith as alignment to what God has said.\nREF: NEW AGE SPIRITUALITY III — 09:56–11:09\n\nQ24. Which passages are used to connect \"the first and the last\" with both Jehovah and Jesus?\nA. Isaiah 9:6 and Matthew 3:3\nB. Hebrews 10:10-18 and Revelation 19:16\nC. Isaiah 44:6 and Revelation 1:17-18\nD. John 1:1 and Colossians 1:17\nANSWER: C\nEXPLANATION: The lesson pairs Isaiah’s description of Jehovah with Revelation’s description of Jesus as “the first and the last.”\nREF: JEHOVA’S WITNESS IV — 00:16–02:34\n\nQ25. A believer thinks, \"I don't want to share the gospel because I don't enjoy socially awkward conversations.\" What does the lesson say this believer needs to do?\nA. Ask the Holy Spirit to remove the possibility of an awkward conversation.\nB. Die to that preference because they have been crucified with Christ.\nC. Wait until they are comfortable enough to initiate spiritual conversations.\nD. Develop a less direct way of communicating the gospel.\nANSWER: B\nEXPLANATION: The lesson says believers should die to the preference to avoid awkwardness and share the gospel.\nREF: HOW TO EVANGELIZE — 02:31–03:24\n\nQ26. What question does the lesson raise when someone says, \"The universe is telling me something\"?\nA. Why would the universe want to communicate with human beings?\nB. If everything is one impersonal divine existence, who is speaking to whom?\nC. How can people know whether the universe is speaking in the correct language?\nD. How can the universe physically produce a voice?\nANSWER: B\nEXPLANATION: The lesson questions how communication is possible if the universe is an impersonal divine force.\nREF: NEW AGE SPIRITUALITY II — 11:48–13:13\n\nQ27. Which statement correctly combines the three Adventist doctrines and the biblical responses presented in the lesson?\nA. Ellen White's writings concern only the Sabbath; soul sleep teaches conscious existence after death; conditional immortality teaches that the wicked remain immortal forever.\nB. Ellen White's writings are treated as prophetic guidance; soul sleep teaches unconsciousness until resurrection; conditional immortality teaches that the wicked are ultimately destroyed and the lesson challenges these claims using Scripture.\nC. Ellen White's writings replace Scripture; soul sleep teaches that the dead immediately enter heaven; conditional immortality teaches eternal conscious punishment.\nD. Ellen White's writings are regarded only as historical commentary; soul sleep teaches temporary judgment after death; conditional immortality teaches that everyone eventually receives eternal life.\nANSWER: B\nEXPLANATION: The lesson describes these Adventist teachings and challenges them using biblical passages.\nREF: MORMONS III — 02:59–09:02\n\nQ28. Why does the lesson describe a \"God-sized hole that nothing else but God can fill\"?\nA. People are searching for meaning because they need to find the right combination of spiritual beliefs to fill what is missing.\nB. People continue searching because they have not yet found the right spiritual practice to satisfy their deepest desires.\nC. People can keep adding things to their lives in an attempt to satisfy a longing that ultimately can only be satisfied by God.\nD. People search for different spiritual experiences because God has created everyone with different ways of finding satisfaction.\nANSWER: C\nEXPLANATION: The lesson says people’s continued searching does not satisfy them; satisfaction is found in God.\nREF: NEW AGE SPIRITUALITY I — 07:05–07:38\n\nQ29. The Lesson on Mormons gives three biblical considerations for evaluating a prophetic claim. Which combination best represents the framework?\nA. Whether the prophet has a large following, whether his teachings are morally appealing, and whether his followers experience spiritual growth.\nB. Whether the prophet claims to have received revelation, whether his message is new, and whether his followers sincerely believe him.\nC. Whether the prophet performs miracles, whether people follow him, and whether he has a supernatural experience.\nD. Whether the prophet leads people to the true God, whether his fruit is consistent with the faith, and whether his message agrees with the gospel already given.\nANSWER: D\nEXPLANATION: The lesson evaluates prophetic claims by their direction, fruit, and agreement with the gospel already given.\nREF: MORMONS I — 09:29–11:04\n\nQ30. What question does the lesson use to develop its argument about Islam calling Jesus “the Word of Allah”?\nA. Whether Jesus knew the entire Quran.\nB. Whether Allah spoke the Word through Muhammad or Jesus.\nC. Whether Allah's Word is eternal or created.\nD. Whether the Word of Allah is written in Arabic.\nANSWER: C\nEXPLANATION: The lesson develops its argument by asking whether Allah’s Word is eternal or created.\nREF: MUSLIMS II — 04:09–05:20\n\nDECK: Discipleship Experience (Section 10) Apologetics\n\nQ1. Which pair of questions does the lesson associate with the biographical test?\nA. How many authors produced the document, and how many people witnessed the events described in it?\nB. How many manuscripts are available and whether their contents are the same or similar, and how long the interval is between the original and earliest available manuscript?\nC. Whether archaeology supports the document, and whether later communities accepted the document as authoritative?\nD. Whether the document contains prophecy, and whether the prophecy was fulfilled within the period it describes?\nANSWER: B\nEXPLANATION: The lesson assesses manuscript evidence by considering the number and similarity of manuscripts and the interval from the original to the earliest available copies.\nREF: IS THE BIBLE TRUE I — approx. 01:37–06:01\n\nQ2. What does the lesson mean by saying, \"A dead God cannot give eternal life\"?\nA. Eternal life depends on Jesus having conquered death rather than remaining under the power of death.\nB. Eternal life can only be received by those who physically witness Jesus' resurrection.\nC. Eternal life is possible only when believers are able to prove the resurrection through historical documents.\nD. Eternal life depends on believers becoming physically immortal before they can receive salvation.\nANSWER: A\nEXPLANATION: The lesson connects Jesus’ resurrection with believers’ redemption and future resurrection.\nREF: DID JESUS RISE FROM THE DEAD II — 04:03–05:02\n\nQ3. What does the internal evidence test examine?\nA. Whether archaeological discoveries confirm the locations and events described within the Bible.\nB. Whether writings outside the Bible confirm the people, places and events described within the Bible.\nC. Whether the information within the Bible is coherent and free from known contradictions.\nD. Whether the Bible contains more surviving manuscripts than other ancient documents from the same period.\nANSWER: C\nEXPLANATION: The lesson defines the internal evidence test as examining the Bible’s own testimony for coherence and known contradictions.\nREF: IS THE BIBLE TRUE I — 06:41–07:44\n\nQ4. Why does the lesson describe the resurrection as more than simply getting the facts of the past right?\nA. It establishes a guarantee concerning the future of those who believe in Jesus.\nB. It establishes that every historical detail concerning Jesus can now be independently verified.\nC. It establishes that believers will never experience suffering or death after becoming Christians.\nD. It establishes that every person who hears the gospel will automatically receive eternal life.\nANSWER: A\nEXPLANATION: The lesson presents Jesus’ resurrection as assurance that believers will rise as well.\nREF: DID JESUS RISE FROM THE DEAD II — 04:03–05:46\n\nQ5. Why does the lesson refer to Isaiah's writings about Jesus?\nA. Isaiah was written during Jesus' lifetime and records eyewitness testimony about His ministry.\nB. Isaiah was discovered as part of the earliest complete New Testament manuscript and confirms the Gospel accounts.\nC. Isaiah contains predictions about Jesus' life and death that were written over 700 years before Jesus was born and were later fulfilled.\nD. Isaiah proves that Matthew, Mark, Luke and John wrote their Gospel accounts together from the same source.\nANSWER: C\nEXPLANATION: The lesson cites Isaiah’s predictions about Jesus’ life and death as prophecies written centuries before his birth and later fulfilled.\nREF: IS THE BIBLE TRUE I — 10:31–11:39\n\nQ6. Why does the lesson regard the fact that women were the first witnesses of the empty tomb as significant evidence?\nA. Women were considered the most reliable legal witnesses in the first-century Jewish world.\nB. Women were treated as highly respected public authorities whose testimony was preferred over that of men.\nC. Women were treated as second-class citizens in that cultural context, making their inclusion as first witnesses an unlikely choice if the story were fabricated to be convincing.\nD. Women were the only people permitted to enter tombs and were automatically considered reliable witnesses.\nANSWER: C\nEXPLANATION: The lesson argues that reporting women as the first witnesses would have been an unlikely choice for a fabricated account.\nREF: DID JESUS RISE FROM THE DEAD IV — approx. 06:51–09:42\n\nQ7. Which statement best captures the idea that what appears evil or chaotic may not be ultimate?\nA. If an event eventually produces something good, the original event should no longer be regarded as evil.\nB. If God has a purpose, every event must have been directly caused by Him.\nC. A painful or chaotic reality can be genuinely difficult while still not representing the final outcome of God's purpose.\nD. Human beings should stop judging circumstances because only God can determine whether something is good.\nANSWER: C\nEXPLANATION: The lesson says present evil or chaos can be real without being the final outcome of God’s purpose.\nREF: THEODICY II — 08:26–09:12\n\nQ8. Why does the lesson consider Jesus' teaching about Himself from Scripture significant?\nA. Because Jesus' use of Scripture proves that every surviving biblical manuscript has been preserved perfectly.\nB. Because Jesus wrote the Old Testament Himself and could therefore explain every part of it from personal authorship.\nC. Because Jesus' teaching about Scripture means that external evidence is no longer necessary for examining the Bible.\nD. Because Jesus was the person prophesied about and could teach about Himself from the Scriptures that spoke about Him.\nANSWER: D\nEXPLANATION: The lesson says Jesus could teach about himself from the Scriptures that prophesied about him.\nREF: IS THE BIBLE TRUE I — 10:31–11:39\n\nQ9. What distinction does Hebrews 9 make between Christ's sacrifice and the sacrifices offered by the Old Testament high priest?\nA. Christ entered the Most Holy Place repeatedly with His own blood, while the Old Testament high priest entered once a year with animal blood.\nB. Christ entered the earthly sanctuary once with His own blood, while the Old Testament high priest entered the heavenly sanctuary repeatedly with animal blood.\nC. Christ entered heaven once and for all by His own blood, while the Old Testament high priest repeatedly entered the Most Holy Place with the blood of animals.\nD. Christ entered the Most Holy Place every year with His own blood, while the Old Testament high priest offered animal blood only once for Israel.\nANSWER: C\nEXPLANATION: The lesson contrasts the high priest’s repeated entry with animal blood and Christ’s once-for-all entry into heaven with his own blood.\nREF: DID JESUS RISE FROM THE DEAD II — 00:15–02:35\n\nQ10. A believer is suffering despite trusting God and wonders whether the suffering means Christ has failed to defeat evil. Which response best reflects the framework presented?\nA. The suffering proves that Christ's victory applies only after death and has no present relevance.\nB. The suffering shows that the believer has not yet exercised enough faith to appropriate Christ's victory.\nC. The suffering exists within the present reality of a fallen world, while Christ's victory guarantees that suffering and death will not have the final word.\nD. The suffering should be understood as God's direct method of teaching the believer whatever lesson they have not yet learned.\nANSWER: C\nEXPLANATION: The lesson connects present suffering with creation’s corruption and presents Christ’s victory as assurance that death and suffering will not have the final word.\nREF: THEODICY IV — approx. 00:49–02:59; 14:42–18:23\n\nQ11. What does the lesson mean when it says that the different parties in the Day of Atonement represented one person, Jesus?\nA. It means that the high priest, the goats and the other elements were separate sacrifices that were eventually replaced by Jesus.\nB. It means that the high priest and the goats were historical figures who physically became Jesus during His ministry.\nC. It means that the different elements of the ceremony served as a type and shadow of what Jesus Christ would come to accomplish.\nD. It means that Jesus performed the Day of Atonement ceremony in the same form before beginning His earthly ministry.\nANSWER: C\nEXPLANATION: The lesson presents the Day of Atonement’s elements as a type and shadow of what Jesus would accomplish.\nREF: DID JESUS RISE FROM THE DEAD I — 12:06–13:42\n\nQ12. What does the lesson mean when it describes money as a \"spiritual stethoscope\"?\nA. The amount of money a person has reveals the level of spiritual maturity that person has attained.\nB. The way a person responds to money and giving can reveal the condition of that person's heart.\nC. The level of financial success a person experiences reveals the strength of that person's relationship with God.\nD. The amount of money a person gives determines whether God accepts that person's faith and worship.\nANSWER: B\nREF: Not found in the provided sources — N/A\n\nQ13. Why has the problem addressed by theodicy continued to generate questions among Christians and non-Christians?\nA. Because Scripture gives no examples of people questioning God's justice\nB. Because the existence of evil creates questions about how God's goodness, power and justice relate to human experience\nC. Because Christians have historically disagreed about whether God possesses absolute sovereignty\nD. Because the Bible presents evil as a mystery that human beings are forbidden to investigate\nANSWER: B\nEXPLANATION: The lesson connects the problem of evil with questions about God’s goodness, knowledge, power, and justice.\nREF: THEODICY I — approx. 01:18–03:28\n\nQ14. Why does the lesson argue that the Islamic substitution theory conflicts with the earliest historical testimony about Jesus?\nA. Because the theory appeared several hundred years after the Christian accounts and conflicts with both Christian and non-Christian testimony concerning His crucifixion.\nB. Because the theory appeared before the Christian accounts and therefore contradicts the eyewitnesses who recorded Jesus' crucifixion.\nC. Because the theory was developed by Roman authorities who were attempting to explain why Jesus' disciples continued preaching after His death.\nD. Because the theory depends entirely on the Gospel accounts while rejecting the historical sources outside the Christian tradition.\nANSWER: A\nEXPLANATION: The lesson argues that the substitution theory came later and conflicts with earlier Christian and non-Christian testimony about Jesus’ crucifixion.\nREF: DID JESUS RISE FROM THE DEAD II — approx. 08:15–10:59\n\nQ15. Why does the lesson consider the question \"Is the Bible true?\" important to the Christian?\nA. Because the Bible contains more historical information than every other ancient document.\nB. Because the Bible is the oldest religious document available to Christians.\nC. Because the Bible is the standard for Christian belief, so questioning its origin and validity raises a question about the foundation of the faith.\nD. Because the Bible must be confirmed by archaeological discoveries before Christians can accept its teachings.\nANSWER: C\nEXPLANATION: The lesson says the Bible is the standard for belief, so questions about its origin and validity affect Christian faith.\nREF: IS THE BIBLE TRUE I — 00:29–01:14\n\nQ16. What confidence does the resurrection of Jesus give believers about their own future?\nA. It gives believers confidence that they will avoid physical death if they maintain their faith until the end.\nB. It gives believers confidence that they will rise again because Jesus Himself rose from the dead.\nC. It gives believers confidence that they will experience resurrection only if they have never struggled with doubt.\nD. It gives believers confidence that physical death has already ceased to exist for everyone who believes in Jesus.\nANSWER: B\nEXPLANATION: The lesson presents Jesus’ resurrection as assurance that believers will rise too.\nREF: DID JESUS RISE FROM THE DEAD II — 04:03–05:46\n\nQ17. What does the lesson highlight about the different backgrounds of the Bible's authors?\nA. Their different backgrounds show that the books developed from several unrelated salvation stories.\nB. Their different backgrounds suggest that the books were written independently without a common theological direction.\nC. Their different backgrounds mean that the books reflect different understandings of salvation that cannot be brought together.\nD. Their different backgrounds show that, despite their differences in countries, classes and professions, their writings form a unified salvation story.\nANSWER: D\nEXPLANATION: The lesson highlights that authors from varied backgrounds contributed to a unified salvation story.\nREF: IS THE BIBLE TRUE I — 01:14\n\nQ18. Why was the flood understood as an act of preservation as well as judgment?\nA. The corruption of humanity had become so extensive that intervention was necessary to preserve the human race\nB. Humanity had become incapable of receiving God's forgiveness and therefore needed to be completely destroyed\nC. God needed to demonstrate His authority before establishing His covenant with Noah\nD. The flood was primarily intended to punish those who had rejected Noah's preaching\nANSWER: A\nEXPLANATION: The lesson presents the flood as an intervention intended to preserve the human race amid extensive evil.\nREF: THEODICY III — approx. 01:49–04:16\n\nQ19. What did the scapegoat represent in the Day of Atonement picture presented in the lesson?\nA. It represented the animal whose blood was brought behind the veil to make atonement for the high priest.\nB. It represented the one upon whom the sins and rebellious acts of the Israelites were placed before being sent into the wilderness.\nC. It represented the high priest who entered the Most Holy Place and returned to announce that the sacrifice had been accepted.\nD. It represented the people of Israel who remained outside the tabernacle while the high priest offered sacrifices for their sins.\nANSWER: B\nEXPLANATION: The lesson says the scapegoat carried the Israelites’ sins away into the wilderness.\nREF: DID JESUS RISE FROM THE DEAD I — 11:18–12:55\n\nQ20. Why does the lesson consider the time interval between an original document and the earliest surviving manuscript?\nA. Because the age of the surviving manuscript determines whether its original author was inspired by God.\nB. Because a longer interval between manuscripts automatically makes the original document historically unreliable.\nC. Because the date of the surviving manuscript determines whether the document's message is doctrinally correct.\nD. Because the interval helps us consider how close the surviving evidence is to the period in which the original was written.\nANSWER: D\nEXPLANATION: The lesson uses the interval to assess how close surviving manuscripts are to the original documents.\nREF: IS THE BIBLE TRUE I — 01:37–02:26\n\nQ21. What pattern of divine intervention is identified throughout Scripture?\nA. God intervenes whenever His people experience suffering for an extended period\nB. God intervenes primarily in ways that advance His overarching will and purpose\nC. God intervenes only when human beings have exhausted their own ability to solve a problem\nD. God intervenes whenever evil becomes visible enough for humanity to recognize it\nANSWER: B\nEXPLANATION: The lesson describes God’s interventions as advancing his overarching will and purpose.\nREF: THEODICY III — approx. 00:16–01:49\n\nQ22. What were the differences found in the approximately 5% that did not match in the Isaiah comparison?\nA. They involved major changes to the story and theology presented throughout the book of Isaiah.\nB. They involved spelling differences, omitted letters and misspelled words that did not change the core meaning.\nC. They involved entire sections of Isaiah that had been removed from the later manuscript tradition.\nD. They involved different accounts of the life, ministry and death of Jesus within the book of Isaiah.\nANSWER: B\nEXPLANATION: The lesson characterizes the differences as spelling and copying errors that do not change the core meaning.\nREF: IS THE BIBLE TRUE I — 04:02–05:04\n\nQ23. What does Christ's resurrection change about the way death is understood?\nA. Death remains the final outcome of human existence but is no longer something Christians should fear\nB. Death is no longer the final word for those who belong to Christ because resurrection gives hope beyond physical death\nC. Death is removed from the experience of every believer who exercises sufficient faith\nD. Death becomes spiritually beneficial because every Christian is guaranteed immediate resurrection after physical death\nANSWER: B\nEXPLANATION: The lesson presents resurrection as hope that death is not the end for believers.\nREF: DID JESUS RISE FROM THE DEAD II — 04:03–05:46\n\nQ24. What does the lesson say Christianity would become without the resurrection?\nA. Christianity would become a less effective form of Christianity because its moral teachings would remain unchanged.\nB. Christianity would become a mere religion because the resurrection is what distinguishes the Christian faith from a system of moral teaching.\nC. Christianity would become a historical movement because the teachings of Jesus would still provide a complete path to eternal life.\nD. Christianity would become a different form of Judaism because the death of Jesus would still fulfil the purpose of the Christian faith.\nANSWER: B\nEXPLANATION: The lesson says the risen Savior, rather than moral teaching alone, distinguishes Christianity.\nREF: DID JESUS RISE FROM THE DEAD II — 06:27–07:18\n\nQ25. What is the main difference between internal and external evidence in the lesson?\nA. Internal evidence examines the Bible's own testimony, while external evidence looks to material outside the Bible to see whether it confirms or denies that testimony.\nB. Internal evidence examines the Old Testament, while external evidence examines the New Testament and the events surrounding its development.\nC. Internal evidence examines archaeological discoveries, while external evidence examines the prophecies contained within the biblical text.\nD. Internal evidence examines Christian belief, while external evidence examines whether non-Christians accept the Bible's historical claims.\nANSWER: A\nEXPLANATION: The lesson distinguishes evidence drawn from within the Bible from evidence outside it that may confirm or deny its testimony.\nREF: IS THE BIBLE TRUE I — 06:41; IS THE BIBLE TRUE II — 00:15–01:10\n\nQ26. What is the lesson's main historical objection to the Islamic substitution theory?\nA. The theory emerged several hundred years after Christianity and conflicts with earlier Christian and non-Christian testimony concerning Jesus' crucifixion.\nB. The theory emerged before the earliest Christian accounts and therefore represents a competing eyewitness tradition concerning Jesus' death.\nC. The theory was based primarily on Roman records that the Christian writers deliberately excluded from their accounts of Jesus.\nD. The theory agrees with the earliest historical testimony about Jesus but differs from later Christian interpretations of His death.\nANSWER: A\nEXPLANATION: The lesson argues that the substitution theory came later and conflicts with earlier testimony about Jesus’ crucifixion.\nREF: DID JESUS RISE FROM THE DEAD II — approx. 08:15–10:59\n\nQ27. What is the central purpose of the concept of theodicy as presented?\nA. To demonstrate that every form of suffering has an immediately identifiable purpose\nB. To defend the goodness and justice of God in response to objections arising from evil\nC. To establish that evil exists independently of God's sovereignty\nD. To explain why human beings are morally responsible for every form of suffering\nANSWER: B\nEXPLANATION: The lesson presents theodicy as addressing objections to God’s goodness and justice in light of evil.\nREF: THEODICY I — approx. 02:11–04:19\n\nQ28. What is the basic claim of the ontological argument as explained in the lesson?\nA. God is the greatest possible being, and such a being cannot exist only in the imagination but must exist in reality.\nB. God is the first cause of the universe, and therefore everything that exists must ultimately depend on Him.\nC. God is the intelligent designer of nature, and the complexity of creation demonstrates that He exists.\nD. God is the source of objective morality, and therefore universal moral values demonstrate His existence.\nANSWER: A\nEXPLANATION: The lesson presents the argument that the greatest possible being cannot exist only in the imagination and must exist in reality.\nREF: IS THERE A GOD III — approx. 06:00–09:51\n\nQ29. Why does Christ's incarnation matter to the question of suffering?\nA. God entered human experience and personally experienced hunger, temptation, rejection, suffering and death\nB. God entered human experience primarily to demonstrate that suffering is necessary for spiritual maturity\nC. God entered human experience so that He could understand human beings despite previously being separated from them\nD. God entered human experience to demonstrate that divine power could completely eliminate suffering during earthly life\nANSWER: A\nEXPLANATION: The lesson says Christ experienced human pain and temptation, so God is not portrayed as detached from human suffering.\nREF: THEODICY IV — approx. 11:12–12:28\n\nQ30. What is the broader purpose of studying apologetics according to the conclusion of the lesson?\nA. To equip Christians with enough intellectual arguments to win debates and demonstrate the superiority of Christianity over every opposing belief.\nB. To help Christians replace simple faith with intellectual certainty so that difficult questions about Christianity no longer need to be asked.\nC. To equip Christians to understand why they believe, engage their minds with their faith, defend it reasonably, and help others come to Christ.\nD. To prepare Christians to become academic scholars who can provide technical answers to every philosophical objection against Christianity.\nANSWER: C\nEXPLANATION: The lesson presents apologetics as preparing Christians to reason about and defend their faith and to help others come to Christ.\nREF: IS THERE A GOD III — approx. 10:36–15:41\n\nDECK: Discipleship Experience (Section 11) Believers' Authority/Charisma\n\nQ1. \"Not everything which is physical in its manifestation is physical in its source.\" What is the main point of this statement?\nA. Spiritual problems never show up physically\nB. Only physical problems are real\nC. Something can show up physically while its root cause is spiritual\nD. Physical problems should never be treated by doctors alone\nANSWER: C\nEXPLANATION: While a problem may have a physical manifestation, its underlying root cause can often be spiritual.\nREF: HOW TO CAST OUT DEMONS I – Celebration Church International - LMS.mp4 — [08:42], [14:27]\n\nQ2. In Mark 5, which two effects of the demon on the man are mentioned in the teaching?\nA. He lived in a graveyard and had supernatural strength\nB. He lived in a mountain and could not sleep\nC. He was bent over and had supernatural strength\nD. He could not speak and lived in a graveyard\nANSWER: A\nEXPLANATION: The man in Mark 5 lived in a graveyard and possessed supernatural strength capable of breaking chains.\nREF: HOW TO CAST OUT DEMONS I – Celebration Church International - LMS.mp4 — [15:37] - [16:38]\n\nQ3. Which account correctly reflects the sequence that led to Saul's tormented state?\nA. He grew envious of David, the Spirit of God left him, then he disobeyed and wanted to kill David\nB. An evil spirit entered him and this caused the Spirit of God to leave him\nC. He disobeyed, and an evil spirit entered him while the Spirit of God remained upon him\nD. He disobeyed, the Spirit of God left him, and an evil spirit then entered him\nANSWER: D\nEXPLANATION: Saul's disobedience caused the Spirit of God to leave him, allowing an evil spirit to enter.\nREF: HOW TO CAST OUT DEMONS II – Celebration Church International - LMS.mp4 — [00:16]\n\nQ4. A believer says, \"Anger is just anger, it is only human nature.\" Which response aligns with the teaching?\nA. Ordinary envy becomes demonic once it is acted upon publicly\nB. Demon spirits can only exploit envy in people who are not believers\nC. Envy is always demonic in origin\nD. Some anger is ordinary, but where an inroad exists, demon spirits can take advantage of it\nANSWER: D\nEXPLANATION: While natural anger exists, holding onto it creates an inroad that demon spirits can exploit.\nREF: HOW TO CAST OUT DEMONS I – Celebration Church International - LMS.mp4 — [05:22] - [06:35]\n\nQ5. Which statement about believers and demon spirits is true?\nA. Meeting a demon spirit is a sign that the Spirit of God has left the believer\nB. Believers can avoid demon spirits entirely if they understand the devil's tricks\nC. Believers only meet demon spirits after giving an inroad through sin or unforgiveness\nD. Believers will encounter demon spirits in this world whether they like it or not, so they must be ready to act\nANSWER: D\nEXPLANATION: Believers will inevitably encounter demon spirits in the world and must recognize their operations to act accordingly.\nREF: HOW TO CAST OUT DEMONS II – Celebration Church International - LMS.mp4 — [07:09] - [08:06]\n\nQ6. Which statement is consistent with what was taught about pride, humility and honour?\nA. Honour people in your own way, since the realm of the spirit ignores social context\nB. Stop honouring people, since the realm of the spirit differs from our culture\nC. Find a way to honour people in a way their social context perceives honour, while remembering the realm of the spirit differs from our culture\nD. Let our social ideas of humility decide how we speak about God's power in warfare\nANSWER: C\nEXPLANATION: We should honor people according to their social context, while keeping in mind that spiritual laws regarding pride and humility differ from cultural norms.\nREF: HOW TO CAST OUT DEMONS III – Celebration Church International - LMS.mp4 — [05:45] - [06:36], [09:57]\n\nQ7. Which best describes a believer's relationship with boasting?\nA. They may boast in Christ, but only in warfare\nB. They boast in Christ and not in their own efforts\nC. Boasting has no place in their life, since salvation is by grace alone\nD. They may boast in their own efforts, provided they give Christ credit afterwards\nANSWER: B\nEXPLANATION: Believers are called to boast, but their boasting should be centered in Christ Jesus rather than their own fleshly efforts.\nREF: HOW TO CAST OUT DEMONS III – Celebration Church International - LMS.mp4 — [03:49]\n\nQ8. A beginner has made bold declarations, stepped in and worshipped, yet the demons have not left. What's the next step to take?\nA. Keep repeating the declarations until the demons leave, since glory touch is for experienced ministers\nB. Go to glory touch privately, so the person is not embarrassed in front of others\nC. Go to glory touch with people around, because demons only leave when a group is present\nD. Go to glory touch with people around, because those being delivered can become violent\nANSWER: D\nEXPLANATION: If earlier steps fail, a beginner should proceed to the glory touch with others present, as the person being delivered may become physically violent.\nREF: HOW TO CAST OUT DEMONS IV – Celebration Church International - LMS.mp4 — [05:16]\n\nQ9. What point is made through Jesus feeling the touch of the woman with the issue of blood?\nA. Jesus released power only after deciding to, so glory is never transferred unknowingly\nB. The woman's faith, not the glory in Jesus, produced the transfer of power\nC. Jesus felt the touch, showing a believer can be conscious of the glory of God within them\nD. Christ entered the Most Holy Place every year with His own blood, while the Old Testament high priest offered animal blood only once for Israel.\nANSWER: C\nEXPLANATION: Jesus feeling the touch demonstrates that believers can be consciously aware of the glory of God flowing through them.\nREF: HOW TO CAST OUT DEMONS IV – Celebration Church International - LMS.mp4 — [07:36] - [08:29]\n\nQ10. A believer perceives a demon in a colleague who is awake and alert. Which approach is appropriate?\nA. Ask or offer to pray for them, without telling them directly or rudely that they have a demon\nB. Tell them plainly that they have a demon so they can consent to prayer\nC. Wait until they are asleep, then cast the demon out without ever telling them\nD. Say nothing and pray privately, since offering prayer risks offence\nANSWER: A\nEXPLANATION: Rather than bluntly telling someone they have a demon, which might cause offense, it is better to politely offer to pray for them.\nREF: HOW TO CAST OUT DEMONS IV – Celebration Church International - LMS.mp4 — [13:46] - [14:32]\n\nQ11. God moves in a person's life through two streams. Which pair names them?\nA. The word and the anointing\nB. Faith and glory\nC. Faith and the anointing\nD. Faith and worship\nANSWER: C\nEXPLANATION: God operates in a believer's life through the dual streams of faith and the anointing.\nREF: MANIFESTING THE PRESENCE OF GOD I – Celebration Church International - LMS.mp4 — [00:15] - [01:02]\n\nQ12. Which option best describes how the two streams relate?\nA. Symbiotic: each supports the other, and walking consistently in glory means learning how they work together\nB. Sequential: One opens the way, and the other takes over afterwards\nC. Competing: a believer should choose the stronger stream and stay in it\nD. Independent: one meets some needs and the other meets others\nANSWER: A\nEXPLANATION: Faith and the anointing have a symbiotic relationship; walking consistently in God's power requires understanding how to partner with both.\nREF: MANIFESTING THE PRESENCE OF GOD I – Celebration Church International - LMS.mp4 — [01:02] - [01:52]\n\nQ13. Which sequence describes what the stream of faith requires of a believer?\nA. Believe, know, practise\nB. Know, practise, believe\nC. Know, believe, teach\nD. Know, believe, practise\nANSWER: D\nEXPLANATION: The stream of faith requires a believer to first know the Word, then believe it, and finally practice it.\nREF: MANIFESTING THE PRESENCE OF GOD I – Celebration Church International - LMS.mp4 — [02:43]\n\nQ14. A believer handles scripture casually but expects it to transform their life. Which statement applies to them?\nA. The word transforms anyone who hears it, whatever their disposition\nB. The word has sacred impact on the lives of those who hold sacred reverence for it\nC. The word transforms those who know it thoroughly\nD. The word transforms only those who first receive the anointing\nANSWER: B\nEXPLANATION: The Word of God delivers its powerful impact to those who treat it with sacred reverence, rather than casual familiarity.\nREF: MANIFESTING THE PRESENCE OF GOD I – Celebration Church International - LMS.mp4 — [02:43] - [03:31]\n\nQ15. A believer declares in general terms that \"God's word works\" over a problem but sees no change. What is missing?\nA. Greater intensity in declaring the word, since volume releases faith\nB. Agreement with others, since faith can be released corporately\nC. Because the Bible is the standard for Christian belief, so questioning its origin and validity raises a question about the foundation of the faith.\nD. Because the Bible must be confirmed by archaeological discoveries before Christians can accept its teachings.\nANSWER: C\nEXPLANATION: The Bible sets the standard for everything believers hold to be true, meaning any question regarding its origin and validity directly questions the foundation of the Christian faith.\nREF: IS THE BIBLE TRUE. I – Celebration Church International - LMS_2.mp4 — [00:29] - [01:14]\n\nQ16. A believer says, \"I know the word and I believe it, so I have done everything faith requires.\" What is missing?\nA. Practising the word, since knowing and believing are only two of the three requirements\nB. Nothing, since knowing and believing are what faith requires\nC. Teaching the word to others, as faith is completed by teaching\nD. The anointing, since the stream of faith ends once the word is believed\nANSWER: A\nEXPLANATION: Knowing and believing are insufficient on their own; true faith also requires practicing (doing) the Word.\nREF: MANIFESTING THE PRESENCE OF GOD I – Celebration Church International - LMS.mp4 — [10:52]; MANIFESTING THE PRESENCE OF GOD II – Celebration Church International - LMS.mp4 — [01:18] - [01:49]\n\nQ17. A believer senses the anointing strongly in a meeting, yet the situation is not changing. Which response fits how the two streams work together?\nA. Wait quietly, since the anointing carries out everything by itself\nB. Drop faith, since the anointing has taken over\nC. Take a step of faith, since the two streams work together and sometimes faith must step forward\nD. Suspect the anointing is just goosebumps, since it should have settled the matter\nANSWER: C\nEXPLANATION: Faith and the anointing work symbiotically; when one stream seems insufficient alone, taking a bold step of faith can trigger the manifestation.\nREF: MANIFESTING THE PRESENCE OF GOD I – Celebration Church International - LMS.mp4 — [01:02] - [01:52]\n\nQ18. Becoming a doer of the word of God indicates which of the following?\nA. You have gained enough knowledge of the word of God to do it\nB. You have enough reverence for the word of God to do it\nC. You have spent enough time building confidence, now you are capable of doing it\nD. You have spent enough time watching your pastor do it, now you are confident enough to do it\nANSWER: B\nEXPLANATION: Acting on the Word of God is the ultimate proof that a believer holds sacred reverence for it.\nREF: MANIFESTING THE PRESENCE OF GOD II – Celebration Church International - LMS.mp4 — [01:53]\n\nQ19. You try to cast out a demon, but nothing dramatic happens, what should your conclusion be?\nA. Demons don't exist\nB. You need to brush up on your exorcism skills\nC. You don't have the requisite anointing for the task\nD. The Word, not the evidence, settles the act\nANSWER: D\nEXPLANATION: Faith dictates that the believer's confidence remains in the Word of God, regardless of immediate physical evidence or dramatic manifestations.\nREF: MANIFESTING THE PRESENCE OF GOD II – Celebration Church International - LMS.mp4 — [02:47] - [03:56]\n\nQ20. When casting out a demon, which of the following best indicates the effectiveness of the anointing?\nA. An energy level that zings like electricity at the tip of your fingers\nB. Violent shaking, jumping and shouting of the possessed\nC. Assurance of effectiveness comes by the Spirit\nD. The number of people praying at the same time\nANSWER: C\nEXPLANATION: While physical signs may occur, the primary and most reliable assurance that a demon has been expelled comes through spiritual discernment.\nREF: MANIFESTING THE PRESENCE OF GOD III – Celebration Church International - LMS.mp4 — [01:31] - [02:25]\n\nQ21. The symbiotic relationship between faith and the anointing is represented by which of the following?\nA. Multi
