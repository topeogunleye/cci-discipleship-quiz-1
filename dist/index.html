<title>CCI Discipleship Quiz — Study Decks</title>
<style>
/* ============================================================
   CCI Discipleship Quiz — Design System
   Premium editorial learning experience
   ============================================================ */

/* ---------- Design Tokens (Light) ---------- */
:root {
  /* Surfaces */
  --bg: #F6F3EE;
  --surface: #FFFDF9;
  --surface-raised: #FFFFFF;
  --surface-dim: #EDE9E1;

  /* Typography */
  --ink: #1B2A2F;
  --ink-secondary: #3D4F54;
  --muted: #5E6F74;
  --faint: #9BAAAE;

  /* Borders & Lines */
  --line: #DDD7CC;
  --line-subtle: #E8E3DA;

  /* Brand — muted gold accent */
  --accent: #8B6E2F;
  --accent-hover: #745B24;
  --accent-soft: #F0E6D0;
  --accent-ink: #FFFDF9;

  /* Semantic */
  --ok: #2D6A4F;
  --ok-soft: #D4EDDA;
  --okbg: #E8F5E9;
  --bad: #9B2C2C;
  --bad-soft: #F5D0CE;
  --badbg: #FDE8E8;

  /* Sage secondary */
  --sage: #6B8F71;
  --sage-soft: #E2EDE4;

  /* Elevation */
  --shadow: 0 1px 3px rgba(27,42,47,.06), 0 6px 20px rgba(27,42,47,.06);
  --shadow-lg: 0 4px 12px rgba(27,42,47,.08), 0 16px 40px rgba(27,42,47,.1);
  --shadow-card: 0 1px 2px rgba(27,42,47,.04), 0 4px 16px rgba(27,42,47,.06);

  /* Typography scale */
  --font-sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, 'Times New Roman', serif;
  --text-xs: 0.8rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-md: 1.0625rem;
  --text-lg: 1.2rem;
  --text-xl: 1.4rem;
  --text-2xl: 1.625rem;
  --text-3xl: 2.25rem;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 48px;

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Transitions */
  --ease-out: cubic-bezier(.2, .7, .3, 1);
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --duration-slow: 450ms;
}

/* ---------- Dark Theme ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111D20;
    --surface: #1A2B2F;
    --surface-raised: #213438;
    --surface-dim: #0E1719;

    --ink: #E6EEEE;
    --ink-secondary: #C4D0D2;
    --muted: #8FA3A7;
    --faint: #5C7276;

    --line: #2C4044;
    --line-subtle: #243538;

    --accent: #D4A84B;
    --accent-hover: #E0B960;
    --accent-soft: #2C2517;
    --accent-ink: #111D20;

    --ok: #6FD3A0;
    --ok-soft: #14382A;
    --okbg: #14382A;
    --bad: #F08080;
    --bad-soft: #3D1B1B;
    --badbg: #3D1B1B;

    --sage: #8FC29A;
    --sage-soft: #1A2E20;

    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.3);
    --shadow-card: 0 1px 2px rgba(0,0,0,.25), 0 4px 16px rgba(0,0,0,.2);
  }
}

:root[data-theme="dark"] {
  --bg: #111D20;
  --surface: #1A2B2F;
  --surface-raised: #213438;
  --surface-dim: #0E1719;

  --ink: #E6EEEE;
  --ink-secondary: #C4D0D2;
  --muted: #8FA3A7;
  --faint: #5C7276;

  --line: #2C4044;
  --line-subtle: #243538;

  --accent: #D4A84B;
  --accent-hover: #E0B960;
  --accent-soft: #2C2517;
  --accent-ink: #111D20;

  --ok: #6FD3A0;
  --ok-soft: #14382A;
  --okbg: #14382A;
  --bad: #F08080;
  --bad-soft: #3D1B1B;
  --badbg: #3D1B1B;

  --sage: #8FC29A;
  --sage-soft: #1A2E20;

  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.3);
  --shadow-card: 0 1px 2px rgba(0,0,0,.25), 0 4px 16px rgba(0,0,0,.2);
}

/* ---------- Reset & Base ---------- */
* { box-sizing: border-box; }

:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: var(--text-md)/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#app {
  max-width: 760px;
  margin: 0 auto;
  padding: var(--space-xl) var(--space-lg) 120px;
}

h1, h2, p { margin: 0; }

h1 {
  font: 700 var(--text-2xl)/1.25 var(--font-serif);
  color: var(--ink);
  letter-spacing: -0.01em;
}

h2 {
  font-size: var(--text-lg);
  font-weight: 600;
  line-height: 1.35;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; }

:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
}

a { color: var(--accent); text-decoration-thickness: 1px; }
a:hover { color: var(--accent-hover); }

/* ---------- Layout Utilities ---------- */
.row {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  flex-wrap: wrap;
}

.row.end {
  justify-content: flex-end;
  margin-top: var(--space-lg);
}

.row.spread {
  justify-content: space-between;
  flex-wrap: nowrap;
  margin: var(--space-lg) 0 var(--space-sm);
}

.row.grow {
  margin-top: var(--space-lg);
}

.row.grow > .btn { flex: 1; }

.meta {
  color: var(--muted);
  font-size: var(--text-sm);
}

/* ---------- Header ---------- */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  flex-wrap: wrap;
  margin: 0 0 var(--space-xl);
  padding-bottom: var(--space-lg);
  border-bottom: 1px solid var(--line-subtle);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 11px 18px;
  min-height: 48px;
  font-weight: 600;
  font-size: var(--text-base);
  line-height: 1.4;
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease, transform var(--duration-fast) ease;
  text-decoration: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--muted);
  box-shadow: 0 1px 4px rgba(27,42,47,.08);
}

.btn:active {
  transform: scale(0.98);
}

.btn.sm {
  padding: 7px 14px;
  min-height: 38px;
  font-size: var(--text-sm);
  border-radius: var(--radius-sm);
}

.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  font-weight: 700;
}

.btn.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  box-shadow: 0 2px 8px rgba(139,110,47,.2);
}

.btn.ghost {
  background: transparent;
  border-color: transparent;
}

.btn.ghost:hover {
  background: var(--surface-dim);
  border-color: transparent;
}

.btn.danger {
  color: var(--bad);
  border-color: var(--bad-soft);
  background: transparent;
}

.btn.danger:hover {
  background: var(--badbg);
  border-color: var(--bad);
}

.btn.full { width: 100%; }

.btn:disabled {
  opacity: 0.4;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.stack {
  display: grid;
  gap: var(--space-md);
  margin-top: var(--space-xl);
}

/* ---------- Study Mode Buttons ---------- */
.study-modes {
  display: flex;
  gap: var(--space-sm);
  flex-wrap: wrap;
  margin: 0 0 var(--space-xl);
}

.study-modes > .btn {
  flex: 1 1 130px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  font-weight: 600;
  font-size: var(--text-sm);
  transition: background var(--duration-fast) ease, border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
}

.study-modes > .btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
}

/* ---------- Badge ---------- */
.badge {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  margin-left: 6px;
  padding: 0 6px;
  border-radius: var(--radius-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: var(--text-xs);
  font-weight: 700;
}

/* ---------- Stats Line ---------- */
.statline {
  display: flex;
  gap: var(--space-sm);
  flex-wrap: wrap;
  margin: 0 0 var(--space-xl);
}

.stat {
  flex: 1 1 110px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-lg);
  text-align: center;
}

.stat b {
  display: block;
  font: 700 var(--text-lg)/1.2 var(--font-serif);
  color: var(--ink);
  margin-bottom: 2px;
}

.stat span {
  color: var(--muted);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}

/* ---------- Home Tools (Search) ---------- */
.home-tools {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--space-sm);
  margin: 0 0 var(--space-lg);
  align-items: center;
}

/* ---------- Deck Cards ---------- */
.deck {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-xs) var(--space-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--space-lg) var(--space-lg) var(--space-md);
  margin-bottom: var(--space-md);
  transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
}

.deck:hover {
  border-color: var(--muted);
  box-shadow: var(--shadow-card);
}

.deck[hidden] { display: none; }

.deck .chk { padding: 2px 0; }

.deck input[type=checkbox],
.sel-all input,
.check input {
  width: 20px;
  height: 20px;
  accent-color: var(--accent);
  cursor: pointer;
}

.deck .dinfo { min-width: 0; }

.deck .dinfo h2 {
  overflow-wrap: anywhere;
  font: 600 var(--text-base)/1.35 var(--font-serif);
  color: var(--ink);
}

.deck h2 {
  font-weight: 650;
  line-height: 1.3;
}

.deck .meta {
  margin-top: 2px;
}

/* Deck progress bar */
.deck-progress {
  grid-column: 2 / -1;
  height: 4px;
  background: var(--line-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin: 4px 0 6px;
}

.deck-progress i {
  display: block;
  height: 100%;
  background: var(--sage);
  border-radius: inherit;
  transition: width var(--duration-normal) var(--ease-out);
}

/* Deck actions */
.acts {
  grid-column: 1 / -1;
  display: flex;
  gap: var(--space-sm);
  flex-wrap: wrap;
  margin-top: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--line-subtle);
}

.acts .btn:not(.ghost) {
  flex: 1;
  min-width: 100px;
}

/* ---------- Select All ---------- */
.sel-all {
  justify-content: space-between;
  margin: 0 2px var(--space-md);
}

.sel-all label {
  display: flex;
  gap: var(--space-md);
  align-items: center;
  font-size: var(--text-sm);
  color: var(--muted);
  font-weight: 500;
}

/* ---------- Bottom Bar ---------- */
.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0 var(--space-md) calc(var(--space-md) + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  z-index: 15;
}

.barin {
  pointer-events: auto;
  max-width: 760px;
  margin: 0 auto;
  background: var(--ink);
  color: var(--bg);
  border-radius: var(--radius-lg);
  padding: 10px 14px 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-md);
  flex-wrap: wrap;
  box-shadow: var(--shadow-lg);
  font-weight: 500;
}

.barin .btn {
  background: var(--bg);
  color: var(--ink);
  border-color: transparent;
}

.barin .btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
}

/* ---------- Empty States ---------- */
.empty {
  text-align: center;
  padding: var(--space-3xl) var(--space-lg);
  color: var(--muted);
}

.empty h2 {
  color: var(--ink);
  font: 600 var(--text-xl)/1.3 var(--font-serif);
  margin-bottom: var(--space-sm);
}

.search-empty {
  display: none;
  text-align: center;
  padding: var(--space-2xl) var(--space-md);
  color: var(--muted);
  font-style: italic;
}

.search-empty.on { display: block; }

/* ---------- Notes & Warnings ---------- */
.note {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-lg);
  margin: var(--space-md) 0;
  font-size: var(--text-sm);
  line-height: 1.6;
}

.note.warn {
  border-color: var(--bad-soft);
  background: var(--badbg);
}

.note ul {
  margin: var(--space-sm) 0 0;
  padding-left: 18px;
}

/* ---------- Backup Reminder ---------- */
.backup-reminder {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-md);
  background: var(--accent-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
  margin-bottom: var(--space-xl);
}

.backup-reminder p {
  color: var(--muted);
  font-size: var(--text-sm);
  margin-top: 2px;
}

.backup-reminder .row { flex: none; }

/* ---------- Update Prompt ---------- */
.update-prompt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}

/* ---------- Progress Bar ---------- */
.pbar {
  height: 5px;
  background: var(--line-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-bottom: var(--space-xl);
}

.pbar i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: inherit;
  transition: width var(--duration-normal) var(--ease-out);
}

/* ---------- Flashcards ---------- */
.flip {
  perspective: 1400px;
  cursor: pointer;
  outline-offset: 4px;
  border-radius: var(--radius-xl);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.inner {
  display: grid;
  transition: transform var(--duration-slow) var(--ease-out);
  transform-style: preserve-3d;
}

.flip.on .inner {
  transform: rotateY(180deg);
}

.face {
  grid-area: 1 / 1;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--accent);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  min-height: 320px;
  padding: var(--space-xl) var(--space-xl) var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}

.back {
  transform: rotateY(180deg);
  border-left-color: var(--sage);
}

.flip[aria-pressed="true"] .front { visibility: hidden; }
.flip[aria-pressed="false"] .back { visibility: hidden; }

.tag {
  color: var(--muted);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.q, .a {
  font: var(--text-xl)/1.5 var(--font-serif);
  margin: auto 0;
  color: var(--ink);
}

.a {
  font-size: var(--text-2xl);
  font-weight: 600;
  color: var(--ink);
}

.qs {
  color: var(--muted);
  font-size: var(--text-sm);
  border-top: 1px solid var(--line-subtle);
  padding-top: var(--space-md);
  font-style: italic;
}

.card-note {
  font-size: var(--text-sm);
  line-height: 1.6;
  margin: 0;
  overflow-wrap: anywhere;
  color: var(--ink-secondary);
}

.card-ref {
  color: var(--muted);
  font-size: var(--text-xs);
  font-style: italic;
}

.hint {
  color: var(--faint);
  font-size: var(--text-xs);
  text-align: center;
  font-style: italic;
}

/* ---------- Quiz & Exam ---------- */
.count {
  color: var(--muted);
  font-size: var(--text-sm);
  margin-bottom: var(--space-sm);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  font-weight: 600;
}

.qtext {
  font: 500 var(--text-xl)/1.5 var(--font-serif);
  margin-bottom: var(--space-xl);
  color: var(--ink);
}

.opts {
  display: grid;
  gap: var(--space-md);
}

.opt {
  display: flex;
  gap: var(--space-md);
  align-items: flex-start;
  text-align: left;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-lg);
  min-height: 54px;
  transition: border-color var(--duration-fast) ease, background var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
  font-size: var(--text-base);
  line-height: 1.5;
}

.opt:not(:disabled):hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 1px 4px rgba(139,110,47,.1);
}

.opt b {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: var(--surface-dim);
  display: grid;
  place-items: center;
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--ink-secondary);
  transition: background var(--duration-fast) ease;
}

.opt:not(:disabled):hover b {
  background: var(--accent);
  color: var(--accent-ink);
}

.opt:disabled {
  cursor: default;
  color: inherit;
}

.opt.right {
  border-color: var(--ok);
  background: var(--okbg);
}

.opt.right b {
  background: var(--ok);
  color: white;
}

.opt.wrong {
  border-color: var(--bad);
  background: var(--badbg);
}

.opt.wrong b {
  background: var(--bad);
  color: white;
}

/* Feedback */
.fb {
  margin: var(--space-lg) 0 var(--space-md);
  font-weight: 700;
  font-size: var(--text-base);
}

.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }

/* Results */
.big {
  text-align: center;
  padding: var(--space-2xl) 0 var(--space-md);
}

.big .num {
  display: block;
  font: 700 var(--text-3xl)/1.1 var(--font-serif);
  color: var(--accent);
}

.big .meta {
  margin-top: var(--space-sm);
}

/* Exam Review */
.exam-review {
  margin: var(--space-xl) 0;
}

.exam-review h2 {
  margin-bottom: var(--space-md);
  font: 600 var(--text-lg)/1.3 var(--font-serif);
}

.exam-review ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-md);
}

.exam-review-item {
  border-top: 1px solid var(--line-subtle);
  padding: var(--space-lg) 0;
}

.exam-review-item h3 {
  font: 500 var(--text-base)/1.4 var(--font-serif);
  margin-bottom: var(--space-sm);
  color: var(--ink);
}

.exam-review-item p + p {
  margin-top: var(--space-sm);
}

/* ---------- Forms ---------- */
.field {
  display: grid;
  gap: var(--space-sm);
  margin: var(--space-md) 0;
}

.field > span {
  font-size: var(--text-sm);
  color: var(--muted);
  font-weight: 500;
}

input[type=text],
input:not([type]),
input[type=search],
input[type=number],
select,
textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 11px var(--space-md);
  min-height: 46px;
  font-size: var(--text-base);
  transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  outline: none;
}

textarea { resize: vertical; }

.search { flex: 1; min-width: 0; }

/* ---------- Edit View ---------- */
.clist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-sm);
}

.crow {
  display: flex;
  gap: var(--space-md);
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-lg);
  transition: border-color var(--duration-fast) ease;
}

.crow:hover {
  border-color: var(--muted);
}

.crow[hidden] { display: none; }

.crow .n {
  flex: none;
  width: 28px;
  color: var(--faint);
  font-size: var(--text-sm);
  font-weight: 600;
}

.crow .qt {
  flex: 1;
  min-width: 0;
  font-size: var(--text-sm);
  line-height: 1.5;
}

.crow small {
  display: block;
  color: var(--muted);
  font-size: var(--text-xs);
  margin-top: 2px;
}

.crow .row {
  flex: none;
  flex-wrap: nowrap;
}

.erow {
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: var(--radius-md);
  padding: var(--space-lg);
}

.orow {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  margin-bottom: var(--space-sm);
}

.radio {
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  flex: none;
}

.radio input {
  width: 20px;
  height: 20px;
  accent-color: var(--sage);
}

.hintline {
  color: var(--muted);
  font-size: var(--text-xs);
  margin-top: var(--space-sm);
}

.err {
  color: var(--bad);
  font-weight: 600;
  min-height: 1.2em;
  font-size: var(--text-sm);
}

/* ---------- Import View ---------- */
.drop {
  display: grid;
  place-items: center;
  border: 2px dashed var(--line);
  border-radius: var(--radius-lg);
  padding: var(--space-2xl) var(--space-lg);
  background: var(--surface);
  cursor: pointer;
  color: var(--muted);
  text-align: center;
  transition: border-color var(--duration-fast) ease, background var(--duration-fast) ease;
}

.drop:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.drop input { max-width: 100%; }

.preview { margin-top: var(--space-xl); }

.prow {
  display: flex;
  justify-content: space-between;
  gap: var(--space-md);
  padding: var(--space-sm) 0;
  border-bottom: 1px solid var(--line-subtle);
  font-size: var(--text-sm);
}

/* ---------- Modal ---------- */
#modal .scrim {
  position: fixed;
  inset: 0;
  background: rgba(10, 18, 20, 0.5);
  z-index: 20;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

#modal .sheet {
  position: fixed;
  left: var(--space-md);
  right: var(--space-md);
  bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px));
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: var(--radius-xl);
  padding: var(--space-xl);
  z-index: 21;
  box-shadow: var(--shadow-lg);
}

.dialog-title {
  margin-bottom: var(--space-sm);
  font: 600 var(--text-lg)/1.3 var(--font-serif);
}

.check {
  display: flex;
  gap: var(--space-md);
  align-items: center;
  margin: var(--space-md) 0;
  font-size: var(--text-sm);
}

/* ---------- Toast ---------- */
#toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translate(-50%, 10px);
  background: var(--ink);
  color: var(--bg);
  padding: var(--space-md) var(--space-lg);
  border-radius: var(--radius-md);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-fast) ease, transform var(--duration-fast) ease;
  z-index: 30;
  max-width: 90%;
  text-align: center;
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- Accessibility ---------- */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Reduced Motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .inner,
  .pbar i,
  .deck-progress i,
  #toast,
  .btn,
  .opt,
  .crow,
  .deck,
  .drop {
    transition: none;
  }
  html { scroll-behavior: auto; }
}

/* ---------- Responsive: Mobile ---------- */
@media (max-width: 520px) {
  #app {
    padding: var(--space-lg) var(--space-md) 120px;
  }

  h1 {
    font-size: var(--text-xl);
  }

  .top {
    align-items: flex-start;
  }

  .top h1 {
    max-width: 100%;
  }

  .home-tools {
    grid-template-columns: 1fr;
  }

  .home-tools .btn {
    width: 100%;
  }

  .deck {
    padding: var(--space-md);
  }

  .statline {
    gap: var(--space-sm);
  }

  .stat {
    flex: 1 1 90px;
    padding: var(--space-sm) var(--space-md);
  }

  .stat b {
    font-size: var(--text-base);
  }

  .crow {
    flex-wrap: wrap;
  }

  .crow .qt {
    flex-basis: calc(100% - 40px);
  }

  .crow .row {
    margin-left: 38px;
  }

  .backup-reminder {
    align-items: flex-start;
    flex-direction: column;
  }

  .backup-reminder .row {
    width: 100%;
  }

  .backup-reminder .btn {
    flex: 1;
  }

  .update-prompt {
    align-items: flex-start;
    flex-direction: column;
  }

  .face {
    min-height: 280px;
    padding: var(--space-lg);
  }

  .q, .a {
    font-size: var(--text-lg);
  }

  .qtext {
    font-size: var(--text-lg);
  }

  .study-modes > .btn {
    flex: 1 1 100%;
  }
}

/* ---------- Responsive: Tablet ---------- */
@media (min-width: 521px) and (max-width: 900px) {
  .statline {
    gap: var(--space-md);
  }
}

/* ---------- Responsive: Desktop ---------- */
@media (min-width: 901px) {
  #app {
    padding: var(--space-2xl) var(--space-xl) 120px;
  }

  .deck {
    padding: var(--space-lg) var(--space-xl);
  }

  .face {
    min-height: 360px;
    padding: var(--space-2xl);
  }

  .opt {
    padding: var(--space-lg) var(--space-xl);
  }
}

/* ---------- Nav row (flashcard prev/next) ---------- */
.row.grow.nav {
  margin-top: var(--space-md);
}

.row.grow.nav > .btn {
  font-weight: 500;
}


/* ---------- Hero Action Section ---------- */
.hero-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-lg);
  background: var(--accent-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--space-xl);
  margin-bottom: var(--space-xl);
}

.hero-content {
  flex: 1;
  min-width: 0;
}

.hero-title {
  font: 600 var(--text-lg)/1.3 var(--font-serif);
  color: var(--ink);
  margin-bottom: var(--space-xs);
}

.hero-desc {
  color: var(--muted);
  font-size: var(--text-sm);
  margin: 0;
}

.hero-action.hero-complete {
  background: var(--sage-soft);
}

.hero-action .btn {
  flex: none;
  white-space: nowrap;
}

/* Stat due-today highlight */
.stat.stat-due b {
  color: var(--accent);
}

@media (max-width: 520px) {
  .hero-action {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: var(--space-lg);
  }

  .hero-action .btn {
    width: 100%;
  }
}


/* ============================================================
   Refined Dashboard Hierarchy & Deck Grid (Prompt 2)
   ============================================================ */

/* ---------- Brand & Header ---------- */
.home-top {
  align-items: flex-start;
}

.brand-block h1 {
  margin: 0;
  font-size: var(--text-2xl);
  font-family: var(--font-serif);
  letter-spacing: -0.01em;
  color: var(--ink);
}

.brand-sub {
  font-size: var(--text-sm);
  color: var(--muted);
  margin: 2px 0 0;
  font-style: italic;
  font-family: var(--font-serif);
}

.header-acts {
  margin-left: auto;
}

/* ---------- Hero Action Tag ---------- */
.hero-tag {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: var(--space-xs);
}

.hero-complete .hero-tag {
  color: var(--ok);
}

/* ---------- Decks Section Bar ---------- */
.decks-section-bar {
  margin-top: var(--space-xl);
  margin-bottom: var(--space-md);
}

.spread-mid {
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-sm);
}

.decks-heading {
  font-family: var(--font-serif);
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--ink);
  margin: 0;
}

/* ---------- Deck Grid Layout (Responsive) ---------- */
.deck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: var(--space-md);
  margin-bottom: var(--space-xl);
}

.deck {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: 0;
  transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease, transform var(--duration-fast) ease;
}

.deck:hover {
  border-color: var(--muted);
  box-shadow: var(--shadow-card);
  transform: translateY(-1.5px);
}

.deck-header {
  display: flex;
  gap: var(--space-sm);
  align-items: flex-start;
  margin-bottom: var(--space-xs);
}

.deck-header .chk {
  padding-top: 2px;
  flex: none;
}

.deck-header .dinfo {
  flex: 1;
  min-width: 0;
}

.deck-header .dinfo h2 {
  font-size: var(--text-base);
  line-height: 1.35;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.deck-sec-badge {
  display: inline-block;
  font-size: 0.72rem;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--surface-dim);
  color: var(--muted);
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  line-height: 1.4;
}

.deck-topic {
  font-weight: 650;
  font-family: var(--font-serif);
  font-size: var(--text-base);
  color: var(--ink);
}

/* Deck Status Badge */
.badge-status {
  flex: none;
  font-size: var(--text-xs);
  font-weight: 650;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  letter-spacing: 0.02em;
  line-height: 1.3;
}

.badge-mastered {
  background: var(--okbg);
  color: var(--ok);
  border: 1px solid var(--ok-soft);
}

.badge-progress {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--line);
}

.badge-new {
  background: var(--surface-dim);
  color: var(--muted);
}

/* Deck Meta Indicators */
.meta-due {
  color: var(--accent);
  font-weight: 650;
}

.meta-weak {
  color: var(--bad);
  font-weight: 650;
}

/* Deck Actions Hierarchy */
.deck .acts {
  grid-column: auto;
  display: flex;
  gap: var(--space-sm);
  align-items: center;
  margin-top: auto;
  padding-top: var(--space-sm);
  border-top: 1px solid var(--line-subtle);
}

.deck .acts .btn.primary {
  flex: 2;
  font-weight: 650;
  box-shadow: 0 1px 3px rgba(139,110,47,.15);
}

.deck .acts .btn:not(.primary):not(.deck-edit-btn) {
  flex: 1;
}

.deck .acts .deck-edit-btn {
  flex: none;
  padding: 7px 10px;
  min-height: 38px;
  color: var(--muted);
  border-color: transparent;
}

.deck .acts .deck-edit-btn:hover {
  color: var(--ink);
  background: var(--surface-dim);
}

/* Desktop Width Expansion for Dashboard */
@media (min-width: 960px) {
  #app {
    max-width: 980px;
  }
}

@media (max-width: 600px) {
  .deck-grid {
    grid-template-columns: 1fr;
  }
  
  .brand-block h1 {
    font-size: var(--text-xl);
  }
  
  .header-acts {
    margin-left: 0;
    width: 100%;
    margin-top: var(--space-sm);
  }
  
  .spread-mid {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-sm);
  }
  
  .spread-mid .sel-all {
    width: 100%;
  }
  
  .deck .acts {
    flex-wrap: wrap;
  }
  
  .deck .acts .btn.primary {
    flex: 1 1 100%;
  }
  
  .deck .acts .btn:not(.primary):not(.deck-edit-btn) {
    flex: 1;
  }
}

/* ---------- Focused Study Sessions ---------- */
.study-shell {
  width: min(100%, 720px);
  margin: 0 auto;
  padding-bottom: var(--space-xl);
}

.study-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
  padding-bottom: var(--space-md);
}

.study-exit { justify-self: start; }

.study-heading {
  min-width: 0;
  text-align: center;
}

.study-heading h1 {
  font-size: clamp(1.2rem, 3vw, var(--text-2xl));
  line-height: 1.2;
}

.eyebrow {
  display: block;
  color: var(--muted);
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: .09em;
  line-height: 1.4;
  text-transform: uppercase;
}

.session-status {
  justify-self: end;
  min-width: 56px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius-full);
  background: var(--surface);
  color: var(--ink-secondary);
  font-size: var(--text-sm);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
}

.session-status.is-timer {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
  font-size: var(--text-base);
}

.study-progress {
  height: 6px;
  margin-bottom: var(--space-xl);
}

/* Flashcards: large, unmistakable question/answer surfaces. */
.flash-session .flip {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  border-radius: var(--radius-xl);
  background: transparent;
  color: inherit;
  text-align: left;
  touch-action: pan-y;
}

.flash-session .face {
  min-height: clamp(320px, 48vh, 440px);
  padding: clamp(20px, 4vw, 34px);
  border: 1px solid var(--line);
  border-top: 4px solid var(--accent);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
}

.flash-session .back {
  border-top-color: var(--sage);
  background: var(--surface-raised);
}

.card-face-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}

.face-index {
  flex: none;
  color: var(--muted);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
}

.flash-session .q,
.flash-session .a {
  overflow-wrap: anywhere;
  font-size: clamp(1.35rem, 3.5vw, 1.8rem);
  line-height: 1.45;
}

.flash-session .a { font-size: clamp(1.45rem, 3.7vw, 2rem); }

.flip-cue {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  margin-top: auto;
  padding-top: var(--space-md);
  border-top: 1px solid var(--line-subtle);
  color: var(--muted);
  font: 600 var(--text-sm)/1.4 var(--font-sans);
  text-align: center;
}

.flip-cue-icon {
  color: var(--accent);
  font-size: 1.15em;
}

.flash-session .qs {
  display: block;
  margin-top: auto;
}

.flash-rating .btn,
.study-navigation .btn {
  min-height: 52px;
}

.flash-rating .btn { flex: 1 1 140px; }
.study-navigation .btn { flex: 1; }

.study-shortcuts {
  margin-top: var(--space-md);
  color: var(--muted);
  font-size: var(--text-xs);
  text-align: center;
}

/* Quiz/exam: deliberate reading column and calm answer feedback. */
.question-panel {
  padding: clamp(18px, 4vw, 30px);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.exam-session .question-panel {
  border-top: 4px solid var(--accent);
}

.question-panel .count {
  margin-bottom: var(--space-md);
  color: var(--accent);
}

.question-panel .qtext {
  margin-bottom: var(--space-xl);
  font-size: clamp(1.35rem, 3.2vw, 1.75rem);
  line-height: 1.48;
  overflow-wrap: anywhere;
}

.question-panel .opts { gap: var(--space-sm); }

.question-panel .opt {
  align-items: center;
  min-height: 58px;
  padding: 13px 15px;
  border-radius: var(--radius-md);
  overflow-wrap: anywhere;
}

.question-panel .opt b {
  width: 32px;
  height: 32px;
  border-radius: 50%;
}

/* In an exam, selected means only “saved”, never right or wrong. */
.question-panel .opt.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.question-panel .opt.selected b {
  background: var(--accent);
  color: var(--accent-ink);
}

.study-feedback {
  display: grid;
  gap: var(--space-md);
  margin-top: var(--space-lg);
}

.feedback-panel {
  display: grid;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-lg);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-dim);
}

.feedback-panel.is-correct {
  border-color: var(--ok);
  background: var(--okbg);
}

.feedback-panel.is-incorrect {
  border-color: var(--bad);
  background: var(--badbg);
}

.feedback-panel .fb { margin: 0; }
.feedback-panel .card-note { margin: 0; }

.feedback-answer {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  color: var(--ink);
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: 1.5;
}

.feedback-answer > span:last-child { overflow-wrap: anywhere; }

.feedback-answer-letter {
  display: inline-grid;
  flex: none;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 50%;
  background: var(--ok);
  color: white;
  font-size: var(--text-xs);
  font-weight: 800;
}

.exam-progress-note {
  padding: var(--space-sm) 0 0;
  color: var(--muted);
  font-size: var(--text-sm);
}

.quiz-session > .study-shortcuts,
.exam-session > .study-shortcuts { margin-bottom: 0; }

/* Results: prominent score, simple next steps, explicit answer comparison. */
.results-header {
  align-items: center;
}

.results-header h1 {
  min-width: 0;
}

.result-hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xl);
  margin: var(--space-xl) 0;
  padding: var(--space-xl);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.result-mark {
  display: grid;
  flex: none;
  width: 92px;
  height: 92px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font: 700 var(--text-2xl)/1 var(--font-serif);
  font-variant-numeric: tabular-nums;
}

.result-score { min-width: 0; }

.result-score .num {
  display: block;
  color: var(--ink);
  font: 700 clamp(1.8rem, 5vw, 2.5rem)/1.1 var(--font-serif);
  font-variant-numeric: tabular-nums;
}

.result-score .meta {
  display: block;
  margin-top: var(--space-sm);
}

.new-best {
  display: inline-flex;
  margin-top: var(--space-md);
  padding: 5px 10px;
  border-radius: var(--radius-full);
  background: var(--sage-soft);
  color: var(--ok);
  font-size: var(--text-xs);
  font-weight: 700;
}

.result-actions {
  display: grid;
  max-width: 520px;
  gap: var(--space-sm);
  margin: 0 auto;
}

.result-actions .btn { min-height: 52px; }
.result-note { margin: 0; text-align: center; }

.exam-score { justify-content: flex-start; }
.exam-score .result-score { text-align: left; }

.review-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

.review-heading h2 {
  margin-top: 3px;
  font: 600 var(--text-2xl)/1.25 var(--font-serif);
}

.exam-review ol {
  gap: var(--space-md);
}

.exam-review-item {
  padding: var(--space-lg);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.review-item-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

.review-item-head h3 {
  flex: 1;
  margin: 0;
  font-size: var(--text-md);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.review-status {
  flex: none;
  padding: 4px 9px;
  border-radius: var(--radius-full);
  background: var(--surface-dim);
  color: var(--ink-secondary);
  font-size: var(--text-xs);
  font-weight: 700;
}

.review-status.is-correct {
  background: var(--okbg);
  color: var(--ok);
}

.review-status.is-incorrect {
  background: var(--badbg);
  color: var(--bad);
}

.answer-review-line {
  display: grid;
  grid-template-columns: minmax(100px, .35fr) minmax(0, 1fr);
  gap: var(--space-md);
  margin-top: var(--space-sm);
  padding: var(--space-md);
  border-left: 3px solid var(--line);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  background: var(--surface-dim);
  font-size: var(--text-sm);
  line-height: 1.5;
}

.answer-label {
  color: var(--muted);
  font-size: var(--text-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.answer-copy { overflow-wrap: anywhere; }

.selected-answer { border-left-color: var(--bad); }
.correct-answer { border-left-color: var(--ok); }
.unanswered { border-left-color: var(--line); }

.exam-review-item .card-note {
  margin-top: var(--space-md);
}

.result-home { margin-top: var(--space-md); }

@media (max-width: 600px) {
  .study-header {
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: var(--space-sm);
    padding-bottom: var(--space-sm);
  }

  .study-exit {
    min-height: 44px;
    padding: 6px 8px;
    font-size: var(--text-xs);
  }

  .study-heading h1 { font-size: var(--text-lg); }
  .study-heading .eyebrow { font-size: .65rem; }

  .session-status {
    min-width: 48px;
    padding: 7px 8px;
    font-size: var(--text-xs);
  }

  .session-status.is-timer { font-size: var(--text-sm); }
  .question-panel { padding: 18px 15px; }
  .question-panel .opt { gap: 10px; padding: 12px; }
  .question-panel .opt b { width: 30px; height: 30px; }
  .result-hero { gap: var(--space-lg); padding: var(--space-lg); }
  .result-mark { width: 76px; height: 76px; font-size: var(--text-xl); }
  .review-item-head { flex-direction: column; gap: var(--space-sm); }
  .review-status { align-self: flex-start; }
  .answer-review-line { grid-template-columns: 1fr; gap: 3px; }
}

@media (max-width: 380px) {
  .study-heading h1 { font-size: var(--text-base); }
  .study-exit { padding-inline: 6px; }
  .session-status { min-width: 43px; padding-inline: 6px; }
  .flash-session .face { min-height: 300px; padding: 18px; }
  .question-panel { padding: 16px 12px; }
  .question-panel .opt { padding: 11px 10px; font-size: var(--text-sm); }
  .result-hero { flex-direction: column; text-align: center; }
  .result-score { text-align: center !important; }
  .exam-review-item { padding: var(--space-md); }
}

@media (prefers-reduced-motion: reduce) {
  .flash-session .inner,
  .study-progress i,
  .question-panel .opt,
  .study-shell .btn {
    transition-duration: 0.01ms !important;
  }
}

<script type="application/json" id="starter-fallback">"DECK: Discipleship Experience (Section 1) Soteriology\n\nQ1. Why does the lesson use the example of the criminal on the cross?\nA. To show that everyone receives equal earthly rewards.\nB. To teach that good deeds after death determine salvation\nC. To demonstrate that repentance always removes earthly consequences.\nD. To illustrate that justification is a legal declaration made on the basis of Christ's substitution.\nANSWER: D\nEXPLANATION: The criminal on the cross illustrates justification as a legal declaration of acquittal on the basis of Christ's substitution.\nREF: Justification — 05:03–06:07; 07:06–08:16\n\nQ2. According to the lesson, what is the strongest biblical basis for concluding that condemnation comes after a person knowingly rejects the gospel?\nA. Genesis 3: 11\nB. John 3:18–19\nC. Romans 7: 1\nD. Psalm 51: 2\nANSWER: B\nEXPLANATION: The lesson uses John 3:18–19 to explain that condemnation applies to those who hear and understand the gospel but choose not to receive it.\nREF: Original Sin — 08:41–09:41\n\nQ3. Which argument involving Jesus does Michael Heiser use to challenge the view that every person inherits Adam's personal guilt?\nA. Jesus obeyed the Law perfectly.\nB. If everyone born through Adam is automatically guilty, Jesus would also have been guilty.\nC. Jesus' miracles prove He was sinless.\nD. Jesus never discussed original sin.\nANSWER: B\nEXPLANATION: Michael Heiser's argument is that if everyone born through Adam automatically inherited personal guilt, then Jesus would also be guilty.\nREF: Original Sin — 03:22–04:13\n\nQ4. In the salvation lesson, why are both Nicodemus and Cornelius discussed?\nA. To demonstrate that both moral and religious people still needed salvation through faith in Christ.\nB. To compare Jewish and Roman cultures.\nC. To explain the history of evangelism.\nD. To illustrate different spiritual gifts.\nANSWER: A\nEXPLANATION: Nicodemus and Cornelius illustrate that moral or religious standing does not replace the need to receive the gospel and be saved through faith in Christ.\nREF: Born Again — 06:39–08:30\n\nQ5. Which statement best summarizes the lesson's definition of being born again?\nA. Becoming more disciplined in religious practice.\nB. Joining a local church.\nC. Living a morally upright life.\nD. Receiving the life of God through faith in Christ.\nANSWER: D\nEXPLANATION: Being born again is receiving God's supernatural life through faith in Jesus, rather than earning it by behavior.\nREF: Born Again — 08:30–10:04\n\nQ6. According to the lesson on righteousness, believers are described as \"accepted in the Beloved\" because:\nA. They consistently obey God's commands.\nB. They no longer require repentance.\nC. Christ's work secures their acceptance before God.\nD. They possess greater spiritual gifts than others.\nANSWER: C\nEXPLANATION: Believers are accepted in the Beloved because Christ took their place and secured the benefits of His work.\nREF: Righteousness — 04:26–05:11\n\nQ7. Which statement best reflects the lesson's explanation of right standing with God?\nA. It depends on maintaining perfect obedience.\nB. It depends on sincere intentions.\nC. It is grounded in faith in Christ rather than personal behaviour.\nD. It is earned through consistent repentance.\nANSWER: C\nEXPLANATION: The lesson says right standing with God rests on faith in Christ and what He has done, not on how well a person behaves.\nREF: Righteousness — 06:12–06:53\n\nQ8. Why does the lesson distinguish between metamelomai and metanoia?\nA. To argue that sorrow alone is insufficient because it should lead to repentance.\nB. To show they can be used similarly.\nC. To teach that repentance belongs only to the Old Testament.\nD. To show the role of emotions in repentance.\nANSWER: A\nEXPLANATION: The distinction shows that sorrow is not itself repentance; the lesson says godly sorrow leads to repentance.\nREF: Repentance — 04:41–05:47\n\nQ9. What role does the pornography illustration serve in the lesson?\nA. To explain discipline and it's role in a believer.\nB. To show that behavioural change alone is not the same as gospel repentance.\nC. To teach that addiction can be overcome just by making changes.\nD. To argue against moral discipline.\nANSWER: B\nEXPLANATION: The example shows that stopping an outward behavior alone is not gospel repentance; repentance turns toward Christ.\nREF: Repentance — 01:54–02:46\n\nQ10. Why does the lesson distinguish redemption from justification?\nA. Redemption describes Christ's saving work, while justification describes God's legal declaration concerning the believer.\nB. Redemption applies to Old Testament, while justification applies to the Church now.\nC. Redemption concerns forgiveness, while justification concerns rewards.\nD. They are presented as completely unrelated doctrines.\nANSWER: A\nEXPLANATION: Redemption describes Christ's saving provision through His death and resurrection, while justification is the legal declaration that the believer is not guilty.\nREF: Justification — 09:24–10:31\n\nQ11. Apostle's final position on original sin is that humanity inherits:\nA. Adam's guilt alone.\nB. Mortality together with an irresistible tendency to sin.\nC. Physical death without any inclination toward sin.\nD. Immediate spiritual condemnation at birth.\nANSWER: B\nEXPLANATION: The speaker says humanity receives mortality from Adam and describes an irresistible tendency for the natural person to sin.\nREF: Original Sin — 02:19–03:22; 10:47–11:43\n\nQ12. Which statement best reflects the lesson's teaching about the moment a person is saved?\nA. At water baptism.\nB. At the altar call.\nC. At the point of genuine faith in Christ.\nD. After completing discipleship classes.\nANSWER: C\nEXPLANATION: The speaker says a person receives Christ's life and is saved at the point of placing genuine faith in Jesus.\nREF: Born Again — 10:04–11:39\n\nQ13. According to the lesson, why does Paul repeatedly affirm believers' identity before correcting their conduct?\nA. Because identity provides the foundation from which lasting transformation occurs.\nB. Because behaviour is unimportant.\nC. Because discipline belongs only to church leaders.\nD. Because sin disappears after conversion.\nANSWER: A\nEXPLANATION: Paul emphasizes believers' identity in Christ by grace as a basis for realigning their conduct.\nREF: Righteousness — 01:48–03:34\n\nQ14. What is the significance of Luke 24:47 in the repentance lesson?\nA. It limits repentance to the nation of Israel.\nB. It shows repentance and forgiveness are to be proclaimed to all nations.\nC. It teaches repentance is unnecessary after Christ's resurrection.\nD. It defines repentance as sorrow alone.\nANSWER: B\nEXPLANATION: The lesson cites Luke 24:47 to show that repentance and remission of sins should be preached to all nations.\nREF: Repentance — 10:09–11:08\n\nQ15. The lesson explains that once God declares a believer justified:\nA. Other accusations remain equally authoritative.\nB. The believer must continually earn that verdict.\nC. No other opinion overrides God's verdict.\nD. The believer no longer faces any earthly consequences.\nANSWER: C\nEXPLANATION: Once the judge declares someone not guilty, the lesson says no other opinion overrides that verdict.\nREF: Justification — 07:06–08:16\n\nQ16. Which statement best integrates the teaching across the salvation and righteousness lessons?\nA. Spiritual life begins through faith in Christ, and that new identity becomes the basis for transformed living.\nB. Spiritual growth must precede salvation.\nC. Good behaviour produces spiritual life.\nD. Identity in Christ replaces the need for obedience.\nANSWER: A\nEXPLANATION: The salvation lesson says faith in Jesus brings Christ's life; the righteousness lesson says identity in Christ by grace influences behavior.\nREF: Born Again — 09:15–10:04; Righteousness — 01:48–03:34\n\nQ17. Across the week's lessons, which recurring pattern best describes how God transforms people?\nA. Behaviour changes first, then God grants acceptance.\nB. God grants acceptance in Christ, and that reality shapes a transformed life.\nC. Fear of judgment produces lasting holiness.\nD. Religious discipline creates spiritual life.\nANSWER: B\nEXPLANATION: The lesson presents acceptance in Christ by grace as the foundation for realigning believers' conduct.\nREF: Righteousness — 01:48–03:34; 04:26–05:11\n\nQ18. Which statement best captures the relationship between faith and repentance as presented throughout the lessons?\nA. Faith removes any expectation of changed living.\nB. Repentance earns salvation before faith.\nC. Faith in Christ brings salvation, while genuine repentance accompanies that faith and produces its fruit.\nD. Repentance and faith are unrelated ideas.\nANSWER: C\nEXPLANATION: The lessons connect salvation with faith in Jesus and describe genuine repentance as turning toward Christ, with behavior change as its fruit.\nREF: Born Again — 10:04–10:54; Repentance — 06:53–08:04; 13:36–14:40\n\nQ19. Looking across all five lessons, which statement most accurately summarizes the central message?\nA. Christianity is primarily about becoming morally disciplined.\nB. Salvation is God's gracious work in Christ, received through faith, resulting in a new identity that produces transformed living.\nC. The Christian life is sustained mainly through religious activities.\nD. The gospel is chiefly a call to improve personal behaviour.\nANSWER: B\nEXPLANATION: Across the lessons, salvation is presented as God's work in Christ received through faith, with acceptance in Christ leading to transformed conduct.\nREF: Born Again — 08:30–10:54; Original Sin — 08:41–09:41; Repentance — 06:53–08:04; 13:36–14:40; Justification — 05:03–06:07; 09:24–10:31; Righteousness — 01:48–03:34; 05:11–06:53\n\nQ20. Which statement best explains why the lesson begins by discussing God's role as Judge before defining justification?\nA. To establish that justification should be understood as a legal declaration rather than merely a feeling of forgiveness.\nB. To show that believers should fear God's judgment every day.\nC. To demonstrate that Old Testament believers understood salvation exactly as Christians do today.\nD. To explain why every Christian will receive earthly rewards.\nANSWER: A\nEXPLANATION: The introduction establishes the legal setting by identifying God as Judge and describing justification and condemnation in legal terms.\nREF: Justification — 01:16–04:06\n\nQ21. In the lesson on original sin, what distinction is presented as central to interpreting Romans 5:12?\nA. Humanity inherited Adam's personal guilt.\nB. Humanity inherited death and an eventual tendency to sin rather than Adam's personal guilt.\nC. Humanity inherited neither death nor sin from Adam.\nD. Humanity only inherited physical weakness from Adam.\nANSWER: B\nEXPLANATION: The speaker distinguishes mortality received from Adam from Adam's personal guilt, then describes an irresistible tendency to sin.\nREF: Original Sin — 02:19–03:22; 10:47–11:43\n\nQ22. The CNDP framework introduced in the salvation lesson is primarily intended to help believers:\nA. Memorize the order of the New Testament books.\nB. Explain salvation in a complete and coherent way.\nC. Compare different theological traditions.\nD. Study biblical Greek more effectively.\nANSWER: B\nEXPLANATION: CNDP organizes the lesson around the context, necessity, definition, and provision of salvation.\nREF: Born Again — 02:06–03:06\n\nQ23. Paul's approach to correcting the Corinthians' moral failures was to:\nA. First question whether they were truly saved.\nB. Focus primarily on punishment as motivation for holiness.\nC. Emphasize their identity in Christ before addressing their conduct.\nD. Remove members involved in every form of sin before teaching them.\nANSWER: C\nEXPLANATION: Paul emphasizes the Corinthians' identity in Christ by grace and uses it as a basis to realign their conduct.\nREF: Righteousness — 01:48–03:34\n\nQ24. Which statement best captures the lesson's understanding of genuine repentance?\nA. It is turning to Christ in faith, producing an inner change that naturally bears fruit in conduct.\nB. It is behavioural reform that earns God's acceptance.\nC. It is simply feeling remorse for past actions.\nD. It is abandoning sinful habits before believing the gospel.\nANSWER: A\nEXPLANATION: Repentance is turning toward Christ with an inner resolve that eventually bears fruit in conduct.\nREF: Repentance — 06:53–08:04; 13:36–14:40\n\nQ25. The courtroom illustration used in the justification lesson primarily emphasizes that:\nA. Every believer will eventually stand trial again.\nB. Justification changes a person's legal standing before God because of Christ's substitution.\nC. Christians must defend themselves before God.\nD. Good works overturn past guilt.\nANSWER: B\nEXPLANATION: The courtroom illustration presents justification as a legal verdict of acquittal on the basis of Christ's substitution.\nREF: Justification — 05:03–06:07; 07:06–08:16\n\nQ26. Why does Apostle disagree, at least in part, with Michael Heiser's final conclusion?\nA. He believes Adam's guilt alone explains human sinfulness.\nB. He believes children should be considered guilty from birth.\nC. He believes Romans 5 should not be used when discussing original sin.\nD. He believes mortality alone cannot explain why every human eventually sins.\nANSWER: D\nEXPLANATION: The speaker disagrees in part because mortality alone does not explain why humans eventually sin; he also argues for an irresistible tendency to sin.\nREF: Original Sin — 10:47–11:43\n\nQ27. Which illustration is used to explain that a person may appear physically alive while lacking spiritual life?\nA. A courtroom verdict\nB. A ledger balancing debts\nC. A funeral where the body looked unchanged\nD. A child learning to walk\nANSWER: C\nEXPLANATION: The funeral story illustrates that a body may appear unchanged after life has departed, introducing the lesson's explanation of spiritual life.\nREF: Born Again — 04:46–05:40\n\nQ28. According to the lesson on righteousness, why does Paul remind believers that their bodies are temples of the Holy Spirit?\nA. To convince them they have permanently lost God's presence.\nB. To use their identity in Christ as the basis for transformed behaviour.\nC. To teach that holiness depends on human effort.\nD. To discourage participation in public worship.\nANSWER: B\nEXPLANATION: Paul reminds believers that their bodies are temples of the Holy Spirit and uses their identity and relationship with God to encourage changed behavior.\nREF: Righteousness — 02:47–03:34\n\nQ29. Why does the lesson distinguish between repentance and its fruit?\nA. Because repentance is an inward turning to God that should eventually produce outward obedience.\nB. Because behavioural change has no place in the Christian life.\nC. Because repentance only applies before salvation.\nD. Because obedience and repentance always mean the same thing.\nANSWER: A\nEXPLANATION: The lesson distinguishes repentance from its fruit by describing repentance as an inward turning to God, while changed behavior is its fruit.\nREF: Repentance — 13:36–14:40\n\nQ30. The Greek word dikaio, as explained in the lesson, most accurately means to:\nA. Become morally perfect over time.\nB. Be declared righteous or acquitted.\nC. Earn righteousness through obedience.\nD. Receive power for holy living.\nANSWER: B\nEXPLANATION: The lesson defines the term as to declare righteous, acquit, or vindicate.\nREF: Justification — 05:03–06:07\n\nDECK: Discipleship Experience (Section 2) Soteriology II\n\nQ1. Isaiah 32:17 is used to show the result of righteousness in the life of a believer. What does it produce?\nA. Boldness and authority\nB. Peace, quietness, and assurance forever\nC. Spiritual gifts and power\nD. Holiness through personal effort\nANSWER: B\nEXPLANATION: Isaiah 32:17 is quoted as saying righteousness produces peace, quietness, and assurance.\nREF: ASSURANCE – Celebration Church International - LMS.mp4 — [00:16]–[01:14] (approximate range)\n\nQ2. Which statement best describes propitiation as taught in the lesson?\nA. Christ's death satisfied the demands of God's justice.\nB. Christ's resurrection replaced His sacrifice.\nC. God overlooked humanity's sin.\nD. Believers now satisfy God's justice through obedience.\nANSWER: A\nEXPLANATION: Christ’s redemptive work appeased God’s justice; the lesson describes propitiation as satisfaction.\nREF: PROPITIATION – Celebration Church International - LMS.mp4 — [00:16]–[01:13] (approximate range)\n\nQ3. The teaching describes reconciliation as God's work through Christ to:\nA. reward righteous living.\nB. remove the hostility between God and humanity.\nC. restore Israel's kingdom.\nD. unite all nations politically.\nANSWER: B\nEXPLANATION: Reconciliation is described as Christ’s work removing the hostility between God and humanity.\nREF: ATONEMENT – Celebration Church International - LMS.mp4 — [02:09]–[04:11] (approximate range)\n\nQ4. What does it mean to redeem someone?\nA. Restore a broken relationship.\nB. Ignore an offence.\nC. Free someone from bondage by paying a ransom.\nD. Remove every earthly consequence of sin.\nANSWER: C\nEXPLANATION: To redeem is to free someone from bondage by paying ransom.\nREF: REDEMPTION – Celebration Church International - LMS.mp4 — [04:49]–[05:50] (approximate range)\n\nQ5. According to the teaching, why are people \"without excuse\" before God?\nA. They all possess the written Law.\nB. Creation reveals the existence of God.\nC. Every person has heard the gospel.\nD. Every nation received the prophets.\nANSWER: B\nEXPLANATION: The lesson says creation makes God’s existence knowable and therefore leaves people without excuse.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [05:42]–[06:36] (approximate range)\n\nQ6. Believers sometimes struggle with assurance because:\nA. God deliberately withholds assurance.\nB. They are conditioned to think acceptance must always be earned.\nC. Salvation depends on daily performance.\nD. Faith naturally produces uncertainty.\nANSWER: B\nEXPLANATION: The lesson says believers may doubt assurance because they are conditioned to think in terms of what must be earned.\nREF: ASSURANCE – Celebration Church International - LMS.mp4 — [02:15]–[03:32] (approximate range)\n\nQ7. The comparison between Noah's ark and the blood of Jesus illustrates that:\nA. Christ's atoning work provides the covering that secures believers.\nB. Noah earned God's favour through obedience.\nC. Judgment is greater under grace.\nD. The ark represents heaven.\nANSWER: A\nEXPLANATION: The lesson compares the ark’s protective covering with the covering provided by Jesus’ blood.\nREF: ATONEMENT – Celebration Church International - LMS.mp4 — [05:04]–[07:03] (approximate range)\n\nQ8. Which responsibility was specifically associated with a kinsman-redeemer?\nA. Leading Israel in worship.\nB. Buying back a relative's inheritance.\nC. Interpreting the Law.\nD. Serving as high priest.\nANSWER: B\nEXPLANATION: A kinsman-redeemer could buy back land or inheritance sold because of poverty.\nREF: REDEMPTION – Celebration Church International - LMS.mp4 — [00:55]–[01:53] (approximate range)\n\nQ9. Why was Cain mentioned in the teaching?\nA. To explain the beginning of sacrifice.\nB. To show people instinctively recognize wrongdoing.\nC. To introduce God's covenant.\nD. To explain the origin of death.\nANSWER: B\nEXPLANATION: Cain is used to illustrate that people can recognize wrongdoing without a specific written command.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [02:12]–[03:07] (approximate range)\n\nQ10. Paul expressed confidence that God would:\nA. prevent believers from facing trials.\nB. complete the work He began in believers.\nC. remove every weakness immediately.\nD. reward only mature Christians.\nANSWER: B\nEXPLANATION: The lesson quotes Philippians 1:6 as Paul’s confidence that God will complete the good work He began in believers.\nREF: ASSURANCE – Celebration Church International - LMS.mp4 — [03:32]–[04:29] (approximate range)\n\nQ11. Propitiation is best understood as:\nA. regaining favour where favour had been lost.\nB. becoming spiritually mature.\nC. earning God's acceptance.\nD. receiving spiritual gifts.\nANSWER: A\nEXPLANATION: The lesson explains propitiation as appeasement or satisfaction and describes it as regaining favor where it was lost.\nREF: PROPITIATION – Celebration Church International - LMS.mp4 — [00:16]–[01:13] (approximate range)\n\nQ12. Who initiated humanity's reconciliation with God?\nA. Humanity\nB. The Church\nC. God\nD. The Prophets\nANSWER: C\nEXPLANATION: The lesson explicitly identifies God as the initiator of reconciliation.\nREF: ATONEMENT – Celebration Church International - LMS.mp4 — [08:05]–[08:56] (approximate range)\n\nQ13. Why does redemption and forgiveness go hand in hand?\nA. Forgiveness came at the cost of Christ's blood.\nB. Forgiveness replaced redemption.\nC. Redemption only applies to Israel.\nD. Forgiveness is earned through obedience.\nANSWER: A\nEXPLANATION: The lesson connects redemption and forgiveness, saying forgiveness came at the cost of Christ’s blood.\nREF: REDEMPTION – Celebration Church International - LMS.mp4 — [06:49]–[07:57] (approximate range)\n\nQ14. Romans 2 teaches that even those without God's written law possess:\nA. complete knowledge of salvation.\nB. an instinctive awareness of right and wrong.\nC. perfect obedience.\nD. the Abrahamic covenant.\nANSWER: B\nEXPLANATION: The lesson says people without the written law still have an instinctive moral awareness.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [01:09]–[02:12] (approximate range)\n\nQ15. The illustration of protecting a candle from the wind emphasizes:\nA. self-preservation.\nB. perseverance through discipline.\nC. the Holy Spirit's preserving work.\nD. the importance of church leadership.\nANSWER: C\nEXPLANATION: The candle illustration describes the Holy Spirit preserving believers.\nREF: ASSURANCE – Celebration Church International - LMS.mp4 — [06:14]–[07:19] (approximate range)\n\nQ16. Isaiah 53:11 supports propitiation by stating that the Lord would:\nA. remember sin forever.\nB. see the suffering of His Servant and be satisfied.\nC. establish a new covenant.\nD. judge Israel's enemies.\nANSWER: B\nEXPLANATION: The lesson connects Isaiah 53:11’s ‘be satisfied’ with propitiation as satisfaction.\nREF: PROPITIATION – Celebration Church International - LMS.mp4 — [00:16]–[01:13] (approximate range)\n\nQ17. The Greek word katalaso helps explain reconciliation by emphasizing:\nA. an exchange made possible through Christ.\nB. forgiveness without sacrifice.\nC. moral improvement.\nD. religious devotion.\nANSWER: A\nEXPLANATION: The lesson describes reconciliation as involving an exchange made possible through Christ’s substitution.\nREF: ATONEMENT – Celebration Church International - LMS.mp4 — [07:03]–[08:05] (approximate range)\n\nQ18. The statement, \"The judge is the one who paid the price,\" highlights that:\nA. Christ fully met the requirements needed for believers' freedom.\nB. everyone pays for personal sin.\nC. justice was cancelled.\nD. believers no longer face temptation.\nANSWER: A\nEXPLANATION: The lesson says Christ, who knows the requirements, paid the price in full, freeing believers from guilt.\nREF: REDEMPTION – Celebration Church International - LMS.mp4 — [10:40]–[11:29] (approximate range)\n\nQ19. The story of Cornelius illustrates that:\nA. good works save.\nB. God responds to sincere seekers and brings them further light.\nC. evangelism is unnecessary.\nD. prayer alone brings salvation.\nANSWER: B\nEXPLANATION: The Apostle says God responds to those seeking Him and describes God sending Peter to Cornelius with further information.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [06:36]–[07:33] and [16:38]–[17:33] (approximate ranges)\n\nQ20. According to Jude 24, believers can be confident because God is able to:\nA. make them wealthy.\nB. keep them from stumbling.\nC. remove all suffering.\nD. prevent every temptation.\nANSWER: B\nEXPLANATION: The lesson quotes Jude 24 as assurance that God is able to keep believers from stumbling.\nREF: ASSURANCE – Celebration Church International - LMS.mp4 — [08:07]–[09:14] (approximate range)\n\nQ21. Romans 3:25 teaches that Christ became our propitiation through:\nA. His teachings.\nB. His blood.\nC. His miracles.\nD. His resurrection.\nANSWER: B\nEXPLANATION: The lesson explicitly says Christ was set forth as propitiation by His blood.\nREF: PROPITIATION – Celebration Church International - LMS.mp4 — [02:14]–[03:11] (approximate range)\n\nQ22. The Holy Spirit's role in reconciliation includes:\nA. replacing Christ's work.\nB. applying the benefits of reconciliation to believers.\nC. judging unbelievers.\nD. establishing the Law.\nANSWER: B\nEXPLANATION: The lesson identifies the Holy Spirit as the applier of reconciliation.\nREF: ATONEMENT – Celebration Church International - LMS.mp4 — [08:05]–[08:56] (approximate range)\n\nQ23. Christ became our kinsman-redeemer by:\nA. becoming human.\nB. being born into Israel.\nC. fulfilling the Law.\nD. After completing discipleship classes.\nANSWER: A\nEXPLANATION: The lesson says Christ became human and thereby became our kinsman.\nREF: REDEMPTION – Celebration Church International - LMS.mp4 — [03:52]–[04:49] (approximate range)\n\nQ24. What assumption does the teaching challenge about people who have never heard the gospel?\nA. That they are automatically innocent before God.\nB. That they are all saved.\nC. That they lived before Christ.\nD. That they rejected the gospel.\nANSWER: A\nEXPLANATION: The lesson challenges the assumption that people are justified simply because they have not heard the gospel.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [00:00]–[01:09] (approximate range)\n\nQ25. According to the teaching, assurance is strongest when it is based on:\nA. personal consistency.\nB. spiritual discipline.\nC. God's preserving work.\nD. church accountability.\nANSWER: C\nEXPLANATION: The lesson grounds assurance in God and the Spirit’s preserving work rather than in self-confidence.\nREF: ASSURANCE – Celebration Church International - LMS.mp4 — [06:14]–[07:19] (approximate range)\n\nQ26. Rahab's example shows that genuine faith is:\nA. based on complete theological knowledge.\nB. demonstrated through corresponding actions.\nC. limited to Israel.\nD. always rewarded immediately.\nANSWER: B\nEXPLANATION: Rahab’s actions are presented as a demonstration of her faith.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [12:40]–[13:39] (approximate range)\n\nQ27. According to the second view presented, people are judged based on:\nA. their nationality.\nB. the light they received and how they responded to it.\nC. the era in which they lived.\nD. the number of good works they performed.\nANSWER: B\nEXPLANATION: The second view is described as judgment according to the information a person received and their response to it.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [13:39]–[14:50] (approximate range)\n\nQ28. What enables believers to call God \"Abba, Father\"?\nA. Spiritual maturity.\nB. The spirit of adoption received through the Holy Spirit.\nC. Faithful church attendance.\nD. Keeping the commandments.\nANSWER: B\nEXPLANATION: The lesson links the Spirit of adoption with believers crying ‘Abba, Father.’\nREF: ATONEMENT – Celebration Church International - LMS.mp4 — [08:05]–[08:56] (approximate range)\n\nQ29. One result of Christ's propitiatory work emphasized in the teaching is that believers:\nA. stand without guilt before God.\nB. no longer need repentance.\nC. become incapable of sin.\nD. immediately become spiritually mature.\nANSWER: A\nEXPLANATION: The lesson says propitiation means believers stand without guilt before God.\nREF: PROPITIATION – Celebration Church International - LMS.mp4 — [03:11]–end of transcript (approximate boundary)\n\nQ30. Which statement best reflects the Apostle's own conclusion regarding those who have never heard the gospel?\nA. They are automatically saved.\nB. They are automatically condemned.\nC. He leans toward the view that God judges people according to the light they have received.\nD. Scripture provides no basis for any conclusion.\nANSWER: C\nEXPLANATION: The Apostle says he leans toward the view based on the information a person received and their receptiveness to it.\nREF: THOSE WHO NEVER HEARD THE GOSPEL – Celebration Church International - LMS.mp4 — [18:40]–end of transcript (approximate boundary); see also [13:39]–[14:50] (approximate range)\n\nDECK: Discipleship Experience (Section 3) Predestination and Trinity\n\nQ1. Why does Apostle point to \"Spirit of Christ,\" \"Spirit of God,\" and \"Spirit of His Son\"?\nA. To show that the Spirit carries different identities in different ages.\nB. To demonstrate that Scripture speaks of the same Spirit in relation to the Father and the Son.\nC. To distinguish the ministry of Jesus from that of the Spirit.\nD. To prove Paul preferred figurative language.\nANSWER: B\nEXPLANATION: Scripture refers to the Spirit as the Spirit of Christ, the Spirit of God, and the Spirit of the Son.\nREF: TRINITY II – Celebration Church International - LMS.mp4 — [09:36]–[10:43] (approximate range)\n\nQ2. If a believer says, \"I lost my job because God specifically willed it.\" What will be the most consistent response according to the lesson?\nA. Every painful event is individually ordained by God.\nB. God may have known it would happen, but not every painful event is His predetermined will.\nC. Painful events only happen because believers lack faith.\nD. Since God is sovereign, human choices have no real influence on life's events.\nANSWER: B\nEXPLANATION: God’s foreknowledge of a painful event does not mean He predetermined it.\nREF: PREDESTINATION I – Celebration Church International - LMS.mp4 — [02:47]–[03:53] and [05:45]–[06:52] (approximate ranges)\n\nQ3. Why is the word Trinity compared with words like rapture and omniscient?\nA. To show that theology often creates words to describe biblical truths.\nB. To show that every theological term came from church councils.\nC. To prove that every theological word appears in Scripture.\nD. To argue that Christians should avoid theological language.\nANSWER: A\nEXPLANATION: The lesson says theological terms can describe concepts taught in Scripture even when the exact words are absent.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [11:30]–[12:30] (approximate range)\n\nQ4. What is the primary danger of reading Romans 8:28–30 without continuing into Romans 9–11?\nA. One may misunderstand Paul's teaching on spiritual gifts.\nB. One may confuse justification with glorification.\nC. One may overlook the broader discussion concerning Jews and Gentiles.\nD. One may ignore the historical setting of the Roman church.\nANSWER: C\nEXPLANATION: The lesson says Romans 8 should be read in the wider argument through chapters 9–11, including its discussion of Jews and Gentiles.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [12:03]–[13:39] (approximate range)\n\nQ5. What was the role of the Council of Nicaea regarding the doctrine of the Trinity?\nA. It created a doctrine previously unknown.\nB. It introduced new Scriptures into the canon.\nC. It pointed to biblical evidence that already existed.\nD. It replaced Old Testament teaching with New Testament theology.\nANSWER: C\nEXPLANATION: The lesson says the Council of Nicaea pointed to scriptural evidence that already existed rather than inventing the doctrine.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [17:01]–[18:00] (approximate range)\n\nQ6. Why is the illustration of a dog on a leash used?\nA. Human beings possess unrestricted freedom.\nB. God frequently overrides every human decision.\nC. God's sovereignty removes human responsibility.\nD. Human freedom operates within limits of God's ultimate purposes.\nANSWER: D\nEXPLANATION: The leash illustration describes human freedom operating within the limits of God’s ultimate purposes.\nREF: PREDESTINATION I – Celebration Church International - LMS.mp4 — [04:50]–[05:45] (approximate range)\n\nQ7. What observation from Genesis 18 does Apostle emphasize before discussing Abraham's intercession?\nA. Abraham immediately recognized all three visitors as angels.\nB. One of the three visitors is identified in the narrative as the Lord.\nC. Abraham misunderstood the identity of the visitors.\nD. The visitors never spoke directly to Abraham.\nANSWER: B\nEXPLANATION: The lesson identifies one of the three visitors in Genesis 18 as the Lord.\nREF: TRINITY II – Celebration Church International - LMS.mp4 — [05:50]–[06:46] (approximate range)\n\nQ8. Which statement best distinguishes foreknowledge from predestination?\nA. Everything God foreknows must occur because He predetermined it.\nB. Foreknowledge and predestination describe the same aspect of God's sovereignty.\nC. God may know an event will occur without ordaining or causing it to happen.\nD. Predestination exists because human beings do not possess genuine free will.\nANSWER: C\nEXPLANATION: The lesson distinguishes God’s foreknowledge of an event from His predetermining it.\nREF: PREDESTINATION I – Celebration Church International - LMS.mp4 — [02:47]–[03:53] (approximate range)\n\nQ9. Why does the lesson focus on the Hebrew word echad in Deuteronomy 6:4?\nA. It always refers to a single individual.\nB. It is only used when speaking about God.\nC. It means exactly the same as yahid.\nD. It can describe a unified plurality rather than absolute singularity.\nANSWER: D\nEXPLANATION: The lesson uses Genesis 2:24 to show that echad can describe a compound unity.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [06:10]–[07:11] (approximate range)\n\nQ10. What gives believers confidence even when others exercise free will against them?\nA. God prevents every harmful decision before it happens.\nB. Human beings will eventually choose what is right.\nC. God's ultimate purpose cannot be frustrated by the free choices of people.\nD. Every difficult circumstance was specifically designed by God.\nANSWER: C\nEXPLANATION: Human choices cannot frustrate God’s ultimate purpose.\nREF: PREDESTINATION I – Celebration Church International - LMS.mp4 — [04:50]–[05:45] and [06:52]–[07:36] (approximate ranges)\n\nQ11. Which conclusion best reflects the relationship between Romans 8:28 and free will?\nA. God works through circumstances He did not necessarily ordain to accomplish His ultimate purpose for those who love Him.\nB. Since all things work together for good, every event must have been individually predetermined by God.\nC. Human free will only exists until God decides otherwise.\nD. God's sovereignty eliminates the significance of human choices.\nANSWER: A\nEXPLANATION: The lesson says God can work all things for good for those who love Him, including circumstances He did not necessarily will.\nREF: PREDESTINATION I – Celebration Church International - LMS.mp4 — [05:45]–[07:36] (approximate range)\n\nQ12. In Ephesians 1:11–13, who are \"we who first trusted in Christ\"?\nA. All believers everywhere.\nB. The apostles alone.\nC. The Jews.\nD. The Gentile believers.\nANSWER: C\nEXPLANATION: The lesson identifies ‘we who first trusted’ as the Jews in that context.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [03:53]–[05:10] (approximate range)\n\nQ13. Which part of the Trinity's definition must not be omitted?\nA. That the three persons perform different ministries.\nB. That the three persons are co-equal and co-eternal.\nC. That the Son appears more frequently in Scripture.\nD. That the Father alone possesses supreme authority.\nANSWER: B\nEXPLANATION: The lesson defines the Trinity as three co-equal and co-eternal persons within one being that is God.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [04:07]–[05:05] (approximate range)\n\nQ14. What attitude should accompany discovering difficult truths about God's nature?\nA. Suspend belief until every question is answered.\nB. Accept only what appears logically consistent.\nC. Receive what Scripture teaches with humility.\nD. Avoid doctrines that seem mysterious.\nANSWER: C\nEXPLANATION: The lesson says biblical truth should be embraced with humility even when it is difficult to understand.\nREF: TRINITY II – Celebration Church International - LMS.mp4 — [14:03]–end of transcript (approximate boundary)\n\nQ15. Why was God able to declare that the people of Keilah would surrender David?\nA. His perfect knowledge of human nature made Him know how they would respond.\nB. Their betrayal had already become unavoidable.\nC. God intended to force them into betraying David.\nD. David's departure confirmed God's decree.\nANSWER: A\nEXPLANATION: The lesson says God knew the people of Keilah would give David up because He knew they would cave under pressure.\nREF: PREDESTINATION I – Celebration Church International - LMS.mp4 — [03:53]–[04:50] (approximate range)\n\nQ16. What conclusion can we draw from Acts 26:5 regarding the word \"foreknew\"?\nA. It always refers to God's eternal knowledge of future events.\nB. It is a technical theological term used only by Paul.\nC. Its meaning depends on context and is not inherently a reference to divine omniscience.\nD. It always describes God's covenant relationship with Israel.\nANSWE
