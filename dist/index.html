.study-bottom-bar .btn.primary {
  width: 100%;
  border-radius: var(--radius-full);
  padding: 14px var(--space-xl);
  font-size: var(--text-base);
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(181, 23, 58, 0.25);
  margin-top: var(--space-md);
}

.study-bottom-bar {
  margin-top: auto;
  padding-top: var(--space-lg);
}

.study-bottom-bar .btn.ghost {
  border-radius: var(--radius-full);
  padding: 12px var(--space-lg);
}

.flash-rating {
  margin-top: var(--space-md);
}

.btn-confidence {
  flex: 1 1 auto;
  border-radius: var(--radius-full);
  padding: 12px;
  font-weight: 600;
}

/* Encouraging Coaching Completion Screen */
.desktop-main > .coaching-completion-screen {
  padding-bottom: var(--space-2xl);
}

.coaching-completion-hero {
  margin: var(--space-md) 0 var(--space-2xl);
}

.completion-hero-card {
  background: var(--grad-hero-indigo);
  color: #FFFFFF;
  border-radius: var(--radius-card);
  padding: var(--space-2xl) var(--space-xl);
  text-align: center;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.completion-score-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 84px;
  height: 84px;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.2);
  border: 2px solid rgba(255, 255, 255, 0.4);
  color: #FFFFFF;
  font-size: var(--text-2xl);
  font-weight: 800;
  margin-bottom: var(--space-lg);
  backdrop-filter: blur(8px);
}

.completion-hero-title {
  font-size: var(--text-2xl);
  font-weight: 800;
  color: #FFFFFF;
  margin-bottom: var(--space-xs);
  letter-spacing: -0.01em;
}

.completion-hero-message {
  font-size: var(--text-md);
  color: rgba(255, 255, 255, 0.95);
  max-width: 480px;
  line-height: 1.5;
  margin: 0 auto var(--space-xl);
}

.completion-stats-row {
  display: flex;
  gap: var(--space-sm);
  width: 100%;
  max-width: 440px;
  justify-content: center;
}

.stat-pill {
  flex: 1 1 90px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-md);
  backdrop-filter: blur(6px);
}

.stat-pill b {
  display: block;
  font-size: var(--text-md);
  color: #FFFFFF;
  font-weight: 700;
}

.stat-pill span {
  display: block;
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.85);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.completion-actions-bar {
  margin-top: var(--space-xl);
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}

.expired-tag {
  color: #FFAAA6;
  font-weight: 600;
}

/* ==========================================================================
   Prompt 5: Onboarding Flow, Tap-and-Hold to Commit & Gentle Streaks
   ========================================================================== */

.onboarding-screen {
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md);
  min-height: calc(100vh - 40px);
  min-height: calc(100dvh - 40px);
  box-sizing: border-box;
}

.splash-screen {
  justify-content: center;
  align-items: center;
  text-align: center;
}

.onboarding-hero-art {
  margin: var(--space-xl) auto var(--space-md) auto;
  display: flex;
  justify-content: center;
}

.splash-icon-wrapper {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  box-shadow: 0 12px 28px rgba(59, 43, 176, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
}

.onboarding-title {
  font-size: var(--text-2xl);
  font-weight: 700;
  line-height: 1.25;
  color: var(--text);
  margin: var(--space-sm) 0 var(--space-xs) 0;
  text-align: center;
}

.onboarding-lead {
  font-size: var(--text-base);
  color: var(--text-sub);
  line-height: 1.5;
  text-align: center;
  margin: 0 0 var(--space-lg) 0;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

.onboarding-top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-sm);
  min-height: 40px;
}

.btn-back-step {
  background: none;
  border: none;
  font-size: 1.8rem;
  line-height: 1;
  color: var(--text);
  padding: var(--space-xs) var(--space-sm);
  cursor: pointer;
  border-radius: var(--radius-pill);
  min-width: 48px;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-back-step:hover {
  background: var(--surface-hover);
}

.onboarding-step-counter {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--text-sub);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.btn-text-skip {
  background: none;
  border: none;
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-sub);
  padding: var(--space-xs) var(--space-sm);
  cursor: pointer;
  border-radius: var(--radius-pill);
  transition: color var(--duration-fast) ease;
}

.btn-text-skip:hover {
  color: var(--text);
}

.onboarding-progress-bar {
  width: 100%;
  height: 6px;
  background: var(--line);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin-bottom: var(--space-lg);
}

.onboarding-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #3B2BB0, #B5173A);
  border-radius: var(--radius-pill);
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.onboarding-feature-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}

.onboarding-feature-card {
  display: flex;
  align-items: flex-start;
  gap: var(--space-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-md);
}

.feature-icon {
  font-size: 1.6rem;
  flex: none;
}

.feature-text b {
  display: block;
  font-size: var(--text-base);
  color: var(--text);
  margin-bottom: 2px;
}

.feature-text p {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--text-sub);
  line-height: 1.4;
}

.onboarding-choices-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}

.onboarding-choice-card {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-md) var(--space-lg);
  cursor: pointer;
  text-align: left;
  transition: all var(--duration-fast) ease;
  min-height: 68px;
}

.onboarding-choice-card:hover {
  border-color: var(--muted);
  transform: translateY(-1px);
}

.onboarding-choice-card.selected {
  border-color: var(--primary);
  background: rgba(181, 23, 58, 0.05);
  box-shadow: 0 4px 14px rgba(181, 23, 58, 0.12);
}

.choice-icon {
  font-size: 1.5rem;
  flex: none;
}

.choice-body {
  flex: 1;
  min-width: 0;
}

.choice-title {
  font-size: var(--text-base);
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.choice-desc {
  font-size: var(--text-sm);
  color: var(--text-sub);
  margin-top: 2px;
  line-height: 1.35;
}

.choice-indicator {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 700;
  color: #FFFFFF;
  flex: none;
  transition: all var(--duration-fast) ease;
}

.onboarding-choice-card.selected .choice-indicator {
  background: var(--primary);
  border-color: var(--primary);
}

/* Plan summary */
.plan-summary-hero-card {
  background: linear-gradient(135deg, #3B2BB0 0%, #7A3FD0 100%);
  border-radius: var(--radius-card);
  padding: var(--space-xl) var(--space-lg);
  color: #FFFFFF;
  box-shadow: 0 10px 24px rgba(59, 43, 176, 0.28);
  margin-bottom: var(--space-md);
}

.summary-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.22);
  color: #FFFFFF;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  margin-bottom: var(--space-sm);
}

.summary-hero-title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: #FFFFFF;
  margin: 0 0 var(--space-xs) 0;
}

.summary-hero-sub {
  font-size: var(--text-sm);
  color: rgba(255, 255, 255, 0.9);
  margin: 0 0 var(--space-lg) 0;
  line-height: 1.4;
}

.summary-pills-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-sm);
}

.summary-pill {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-md);
  display: flex;
  flex-direction: column;
}

.pill-k {
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.82);
  font-weight: 600;
  margin-bottom: 2px;
}

.pill-v {
  font-size: var(--text-sm);
  color: #FFFFFF;
  font-weight: 700;
}

.summary-coaching-card {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-md);
  margin-bottom: var(--space-lg);
}

.summary-coaching-icon {
  font-size: 1.8rem;
  flex: none;
}

.summary-coaching-text {
  margin: 0;
  font-size: var(--text-sm);
  color: var(--text-sub);
  line-height: 1.45;
}

/* Tap & Hold Commit Screen */
.commit-screen {
  text-align: center;
}

.commit-hold-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: var(--space-2xl) 0;
}

.commit-hold-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: var(--space-md);
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.commit-hold-btn:active,
.commit-hold-btn.holding {
  transform: scale(0.95);
}

.commit-hold-ring {
  position: relative;
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.commit-ring-svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring-bg {
  fill: none;
  stroke: var(--line);
  stroke-width: 6;
}

.ring-fill {
  fill: none;
  stroke: var(--primary);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 327;
  stroke-dashoffset: 327;
  transition: stroke-dashoffset 0.15s ease;
}

.commit-hold-btn.holding .ring-fill {
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1.1s linear;
}

.commit-center-icon {
  position: absolute;
  font-size: 2.8rem;
  line-height: 1;
}

.commit-btn-label {
  margin-top: var(--space-md);
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--text);
}

.commit-btn-hint {
  font-size: var(--text-sm);
  color: var(--text-sub);
  margin-top: 2px;
}

.onboarding-bottom-bar {
  margin-top: auto;
  padding-top: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

/* Gentle Streak Screen */
.streak-screen-container {
  max-width: 460px;
  margin: 0 auto;
  padding: var(--space-xl) var(--space-md);
  min-height: calc(100vh - 40px);
  min-height: calc(100dvh - 40px);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.streak-hero-card {
  background: linear-gradient(135deg, #FF8A3D 0%, #FF4F7A 100%);
  border-radius: var(--radius-card);
  padding: var(--space-2xl) var(--space-lg);
  color: #241126;
  text-align: center;
  box-shadow: 0 12px 28px rgba(255, 79, 122, 0.28);
}

.streak-flame-hero {
  display: flex;
  justify-content: center;
  margin-bottom: var(--space-sm);
}

.streak-flame-circle {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.24);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
}

.streak-number {
  font-size: 3.5rem;
  font-weight: 800;
  line-height: 1;
  color: #241126;
}

.streak-title {
  font-size: var(--text-xl);
  font-weight: 700;
  color: #241126;
  margin: var(--space-sm) 0 var(--space-xs) 0;
}

.streak-subtitle {
  font-size: var(--text-sm);
  color: #241126;
  margin: 0 0 var(--space-xl) 0;
  line-height: 1.45;
}

.streak-week-row {
  display: flex;
  justify-content: space-between;
  max-width: 280px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.72);
  border-radius: var(--radius-lg);
  padding: var(--space-sm) var(--space-md);
}

.streak-day-dot {
  display: flex;
  flex-direction: column;

}

.streak-day-name {
  font-size: 0.72rem;
  font-weight: 600;
}

.streak-day-mark {
  font-size: 0.85rem;
  font-weight: 700;
}

.streak-day-dot.done {
  color: #241126;
}

.streak-day-dot.current {
  color: #241126;
  font-weight: 800;
}

.streak-gentle-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  margin: var(--space-lg) 0;
  text-align: center;
}

.streak-gentle-title {
  font-size: var(--text-base);
  font-weight: 700;
  color: var(--text);
  margin-bottom: var(--space-xs);
}

.streak-gentle-text {
  font-size: var(--text-sm);
  color: var(--text-sub);
  line-height: 1.5;
  margin: 0;
}

.streak-bottom-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-sm);
  padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

.streak-opt-out-hint {
  font-size: 0.75rem;
  color: var(--text-sub);
  text-align: center;
}

/* ==========================================================================
   Prompt 2C — Devotionals Feed & Article Reader
   ========================================================================== */

.devotion-feed-section {
  margin: var(--space-xl) 0 var(--space-lg);
}

.devotion-feed-section .section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: var(--space-md);
  padding: 0 4px;
}

.devotion-dismiss-btn {
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text-sub);
  width: 36px;
  height: 36px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
  margin-top: 2px;
}

.devotion-dismiss-btn:hover,
.devotion-dismiss-btn:focus-visible {
  color: var(--text);
  border-color: var(--text-sub);
  background: var(--bg);
}

.devotion-carousel {
  display: flex;
  gap: var(--space-md);
  overflow-x: auto;
  padding: 4px 4px 16px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.devotion-carousel::-webkit-scrollbar {
  display: none;
}

.devotion-card {
  flex: 0 0 280px;
  max-width: 85vw;
  scroll-snap-align: start;
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  color: #FFFFFF;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 200px;
  box-shadow: var(--shadow-card);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.devotion-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-float);
}

.devotion-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-sm);
}

.devotion-badge {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.2);
  color: #FFFFFF;
}

.devotion-badge.is-today {
  background: #FFE600;
  color: #1A1A1A;
}

.devotion-time,
.devotion-read-badge {
  font-size: 0.75rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
}

.devotion-read-badge {
  background: rgba(0, 0, 0, 0.25);
  padding: 2px 8px;
  border-radius: 999px;
}

.devotion-card-hit {
  background: transparent;
  border: none;
  padding: 0;
  text-align: left;
  color: inherit;
  cursor: pointer;
  flex-grow: 1;
}

.devotion-card-title {
  font-size: var(--text-lg);
  font-weight: 700;
  line-height: 1.25;
  margin: var(--space-xs) 0 4px;
  color: #FFFFFF;
}

.devotion-card-sub {
  font-size: var(--text-xs);
  color: rgba(255, 255, 255, 0.85);
  margin: 0;
  line-height: 1.4;
}

.devotion-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: var(--space-md);
  padding-top: var(--space-sm);
  border-top: 1px solid rgba(255, 255, 255, 0.2);
}

.devotion-scripture-pill {
  font-size: 0.75rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.9);
}

.devotion-card-action-btn {
  background: rgba(255, 255, 255, 0.25);
  border: none;
  color: #FFFFFF;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 5px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.devotion-card-action-btn:hover {
  background: rgba(255, 255, 255, 0.35);
}

/* Devotional Reader View */
.devotional-view-shell {
  max-width: 680px;
  margin: 0 auto;
  padding-bottom: max(32px, env(safe-area-inset-bottom, 32px));
}

.devotional-header {

}

.devotional-header .chapter-ill {

}

.devotional-nav-row {

}

.devotional-back-btn {

  padding: 8px 16px;

}

.devotional-actions {

}

.devotional-icon-btn {

  color: #FFFFFF;

  height: 48px;
  border-radius: 999px;

  align-items: center;

}

.devotional-icon-btn:hover {

}

.devotional-icon-btn.active {

}

.devotional-hero-content {
  position: relative;

}

.devotional-pill {

  background: rgba(0, 0, 0, 0.22);

  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: var(--space-xs);

}

.devotional-title {
  font-size: 1.65rem;
  font-weight: 700;
  line-height: 1.25;
  margin: 0 0 var(--space-xs);
  color: #FFFFFF;
}

.devotional-sub {
  font-size: var(--text-sm);
  color: rgba(255, 255, 255, 0.9);
  margin: 0;
  line-height: 1.4;
}

.devotional-content-body {
  padding: 0 var(--space-xs);
}

.devotional-scripture-quote {
  background: var(--surface);
  border-left: 4px solid var(--primary);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  padding: var(--space-md) var(--space-lg);

}

.devotional-scripture-quote strong {
  display: block;
  font-size: 0.85rem;
  color: var(--primary);
  margin-bottom: var(--space-xs);

  letter-spacing: 0.05em;
}

.devotional-scripture-quote p {
  font-size: 1.05rem;
  font-style: italic;
  line-height: 1.55;

}

.devotional-paragraphs {
  margin: var(--space-lg) 0;
}

.devotional-p {
  font-size: 17px;
  line-height: 1.6;
  color: var(--text);
  margin: 0 0 var(--space-md);
  font-family: var(--font-stack);
  font-weight: 400;
}

.devotional-more-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--link);
  padding: 10px 20px;
  min-height: 48px;
  border-radius: 999px;
  font-size: var(--text-sm);
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0 0 var(--space-lg);
  transition: all 0.2s ease;
}

.devotional-more-btn:hover {
  background: var(--surface);
  border-color: var(--link);
}

.devotional-callout {
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  margin-bottom: var(--space-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}

.reflection-box {
  border-left: 4px solid #7A3FD0;
}

.step-box {
  border-left: 4px solid #FF8A3D;
}

.callout-head {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  margin-bottom: var(--space-xs);
}

.callout-icon {
  font-size: 1.2rem;
}

.callout-title {
  font-size: var(--text-base);
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.callout-text {
  font-size: var(--text-sm);
  color: var(--text-sub);

}

.devotional-footer-bar {
  margin-top: var(--space-xl);
  padding-top: var(--space-md);
}

/* ============================================================
   Rocket Study Menu & Lesson Picker (Prompt 2B v2)
============================================================ */

.rocket-container {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 120;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  pointer-events: none;
}

@media (max-width: 767px) {
  /* The bottom Practice tab exposes the same study modes at compact sizes. */
  .rocket-container,
  .rocket-backdrop {
    display: none;
  }
}

@media (min-width: 641px) {
  .rocket-container {
    right: 28px;
    bottom: 28px;
  }
}

@media (max-width: 640px) {
  .rocket-container,
  .rocket-backdrop {
    display: none;
  }
}

.rocket-container > * {
  pointer-events: auto;
}

.rocket-fab-btn {
  width: 56px;
  height: 56px;
  min-width: 56px;
  min-height: 56px;
  border-radius: 999px;
  background: var(--primary, #B5173A);
  color: #FFFFFF;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 18px rgba(181, 23, 58, 0.42), 0 2px 6px rgba(0, 0, 0, 0.16);
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.18s ease, box-shadow 0.18s ease;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.rocket-fab-btn:hover {
  transform: scale(1.06);
  background: #C91D44;
  box-shadow: 0 6px 22px rgba(181, 23, 58, 0.5), 0 3px 8px rgba(0, 0, 0, 0.2);
}

.rocket-fab-btn:active {
  transform: scale(0.94);
}

.rocket-fab-btn.is-open {
  background: var(--text, #16152B);
  color: #FFFFFF;
  transform: rotate(90deg);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
}

.rocket-fab-btn:focus-visible,
.rocket-pill-btn:focus-visible,
.picker-close-btn:focus-visible,
.picker-tile:focus-visible {
  outline: 3px solid var(--primary, #B5173A);
  outline-offset: 3px;
}

.rocket-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(18, 16, 58, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 115;
  cursor: pointer;
  animation: rocketFadeIn 0.2s ease forwards;
}

@keyframes rocketFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.rocket-pills {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  margin-bottom: 14px;
  animation: rocketPillsFanOut 0.24s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
}

@keyframes rocketPillsFanOut {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.rocket-pill-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface, #FFFFFF);
  color: var(--text, #16152B);
  border: 1px solid var(--line, #E5E7EB);
  border-radius: 999px;
  padding: 10px 18px 10px 14px;
  min-height: 48px;
  box-shadow: 0 4px 16px rgba(18, 16, 58, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
  cursor: pointer;
  font-family: inherit;
  font-size: var(--text-sm, 14px);
  font-weight: 600;
  white-space: nowrap;
  transition: transform 0.18s ease, background-color 0.15s ease, box-shadow 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}

.rocket-pill-btn:hover {
  background: var(--surface-raised, #F8F9FE);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(18, 16, 58, 0.18);
}

.rocket-pill-btn:active {
  transform: translateY(1px);
}

.rocket-pill-btn .pill-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(181, 23, 58, 0.12);
  color: var(--primary, #B5173A);
  flex-shrink: 0;
}

:root[data-theme="dark"] .rocket-pill-btn {
  background: var(--surface, #1D1A55);
  color: #FFFFFF;
  border-color: rgba(255, 255, 255, 0.14);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
}

:root[data-theme="dark"] .rocket-pill-btn:hover {
  background: var(--surface-raised, #25226B);
}

:root[data-theme="dark"] .rocket-pill-btn .pill-icon {
  background: rgba(255, 255, 255, 0.14);
  color: #FFFFFF;
}

:root[data-theme="dark"] .rocket-fab-btn.is-open {
  background: #FFFFFF;
  color: #16152B;
}

:root[data-theme="dark"] .rocket-pill-text strong {
  color: #FFFFFF;
}

:root[data-theme="dark"] .rocket-pill-text small {
  color: var(--text-sub, #A8A6D8);
}

.rocket-pill-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
}

.rocket-pill-text strong {
  font-size: var(--text-sm, 14px);
  color: var(--text, #16152B);
  line-height: 1.25;
}

.rocket-pill-text small {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-sub, #6B7280);
  line-height: 1.2;
}

/* Lesson Picker View */
.picker-view-shell {
  min-height: 100vh;
  padding: calc(var(--space-md) + env(safe-area-inset-top, 0px)) var(--space-md) calc(var(--space-2xl) + env(safe-area-inset-bottom, 0px));
  max-width: 680px;
  margin: 0 auto;
}

.picker-header {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

.picker-close-btn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;

.picker-close-btn:hover {
  background: var(--surface-raised);
  transform: scale(1.05);
}

.picker-close-btn:active {
  transform: scale(0.95);
}

.picker-title-wrap {
  flex: 1;
}

.picker-title-wrap .eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--primary);

}

.picker-title-wrap h1 {

  color: var(--text);

}

.picker-subtitle {

}

.picker-grid {

@media (max-width: 380px) {

  .picker-tile {

  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  border-radius: 20px;
  padding: 16px;
  min-height: 130px;
  border: none;
  cursor: pointer;
  color: #FFFFFF;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1), box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.picker-tile:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.picker-tile:active {
  transform: translateY(1px);
}

.picker-tile-top {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 6px;
}

.picker-tile-badge {
  font-size: 11px;
  font-weight: 700;
  background: rgba(0, 0, 0, 0.24);
  color: #FFFFFF;
  padding: 3px 8px;
  border-radius: 999px;
  letter-spacing: 0.04em;
}

.picker-tile-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.28;
  margin: 0 0 auto;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);

.picker-tile-bottom {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0.95;
}

.picker-tile-count {
  font-size: 11px;
  opacity: 0.9;
}

.picker-tile-pct {
  font-weight: 700;
}

.picker-tile-bar {

  height: 4px;
  background: rgba(255, 255, 255, 0.26);

  margin-top: 6px;

.picker-tile-bar i {

.picker-tile-all {

.picker-tile-all .picker-tile-badge {

.picker-tile-all .picker-tile-title {
  color: #241126;
  text-shadow: none;
}

.picker-tile-all .picker-tile-bottom,
.picker-tile-all .picker-tile-count {
  color: #241126;
  opacity: 1;

/* Selection states shared by the lesson pickers. */

  padding-bottom: 12px;
}

.picker-view-shell .picker-title-wrap h1 {
  font-size: 1.45rem;
}

.picker-view-shell .picker-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.picker-view-shell .picker-tile-all {
  grid-column: auto;
  min-height: 108px;
  background: linear-gradient(135deg, #211d5d, #2d287c);
  color: #fff;
}

.picker-view-shell .picker-tile-all .picker-tile-title,
.picker-view-shell .picker-tile-all .picker-tile-bottom,
.picker-view-shell .picker-tile-all .picker-tile-count {

.picker-tile-mixed {

  background: linear-gradient(120deg, #ff8a39, #fb3b6d);

.picker-tile-mixed .picker-tile-title,
.picker-tile-mixed .picker-tile-count {
  color: #241126;
  text-shadow: none;
}

.picker-view-shell .picker-selectable {
  min-height: 108px;
  padding: 14px 16px;
  border: 2px solid transparent;
  border-radius: 22px;
}

.picker-view-shell .picker-selectable.is-selected {
  border-color: #B5173A;
  box-shadow: 0 0 0 3px rgba(181, 23, 58, .15);

.picker-view-shell .picker-tile-top {
  margin-bottom: 0;
}

.picker-view-shell .picker-tile-badge {
  display: none;
}

.picker-view-shell .picker-tile-title {
  font-size: 15px;
  line-height: 1.28;
}

.picker-view-shell .picker-tile-bottom {
  margin-top: 8px;
  font-size: 12px;
}

.picker-view-shell .picker-tile-pct {

}

.picker-view-shell .picker-tile-bar {

.picker-view-shell .picker-selectable.is-selected::after {

  width: 32px;
  height: 32px;
  place-items: center;

  background: #fff;
  color: #087544;

.picker-selection-footer {

.picker-footer-controls {

  justify-content: flex-start;

.picker-multi-toggle {

  min-height: 44px;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 4px 0;

  color: var(--ink);
  font: 500 14px/1.2 var(--font-sans);

.picker-multi-toggle i {
  position: relative;
  width: 60px;
  height: 36px;

  }

  .quiz-session button.opt.wrong .opt-result-icon {

  }

  .quiz-session button.opt.right .opt-result-icon {

    color: var(--desktop-quiz-correct-icon-bg);
  }

  .quiz-session button.opt.wrong .opt-result-icon {
    background: var(--desktop-quiz-wrong-icon-color);
    color: var(--desktop-quiz-wrong-icon-bg);
  }

  .quiz-explanation-card.sheet-correct {
    border-top-color: var(--desktop-quiz-correct-border);
  }

  .quiz-explanation-card.sheet-incorrect {
    border-top-color: var(--desktop-quiz-wrong-border);
  }

  .quiz-explanation-card.sheet-correct .fb.ok,
  .quiz-explanation-card.sheet-correct .feedback-mark-icon {
    color: var(--desktop-quiz-correct-color);
  }

  .quiz-explanation-card.sheet-incorrect .fb.bad,
  .quiz-explanation-card.sheet-incorrect .feedback-mark-icon {
    color: var(--desktop-quiz-wrong-color);
  }

  .quiz-explanation-card.sheet-correct .feedback-mark-icon {
    background: var(--desktop-quiz-correct-icon-bg);
    color: var(--desktop-quiz-correct-icon-color);
  }

  .quiz-explanation-card.sheet-incorrect .feedback-mark-icon {
    background: var(--desktop-quiz-wrong-icon-bg);
    color: var(--desktop-quiz-wrong-icon-color);
  }

@media (min-width: 901px) and (max-width: 1100px) {
  .devotional-reader-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .devotional-reader-rail {
    position: static;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    margin-top: 8px;
  }

  .devotional-rail-actions {
    grid-column: 1 / -1;
  }

  .devotional-mark-read {
    grid-column: 1 / -1;
  }

  .devotional-more-card {
    grid-column: 1 / -1;
  }
}

@media (max-width: 900px) {

}

@media (prefers-reduced-motion: reduce) {
  .devotional-header,

/* Reference-aligned Practice chooser */
.practice-selection-view {
  padding-bottom: 28px;
}

.practice-view-header h1 {
  font-size: clamp(2rem, 3vw, 2.5rem);
  line-height: 1.1;
  margin-bottom: 4px;
}

.practice-view-header .view-sub {
  margin: 0;
}

.practice-mode-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin: 30px 0 26px;
}

.practice-mode-tile {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  min-height: 90px;
  padding: 16px 20px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease, transform var(--duration-fast) ease;
}

.practice-mode-tile:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}

.practice-mode-tile.is-selected {
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 3px rgba(190, 18, 74, 0.1);
}

.practice-mode-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  flex: 0 0 auto;
  border-radius: 14px;
  background: var(--surface-dim);
  color: var(--link);
}

.practice-mode-tile:first-child .practice-mode-icon {
  background: linear-gradient(135deg, #ff8b3d, #f03358);
  color: #fff;
}

.practice-mode-copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 5px;
}

.practice-mode-copy strong {
  color: var(--ink);
  font-size: 1rem;
  line-height: 1.2;
}

.practice-mode-copy small {
  color: var(--muted);
  font-size: 0.875rem;
  line-height: 1.3;
}

.practice-cover-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.practice-cover-heading h2 {
  margin: 0;
  color: var(--ink);
  font-size: 1.25rem;
}

.practice-multi-toggle {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 4px 0 4px 12px;
  border: 0;
  background: transparent;
  color: var(--ink-secondary);
  font: 600 var(--text-sm)/1.2 var(--font-sans);
  cursor: pointer;
}

.practice-multi-toggle i {
  position: relative;
  width: 60px;
  height: 32px;
  border-radius: 999px;
  background: var(--line);
  transition: background var(--duration-fast) ease;
}

.practice-multi-toggle i::after {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #fff;
  content: '';
  transition: transform var(--duration-fast) ease;
}

.practice-multi-toggle.is-on i {
  background: var(--accent);
}

.practice-multi-toggle.is-on i::after {
  transform: translateX(28px);
}

.practice-cover-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.practice-cover-tile {
  position: relative;
  display: flex;
  min-width: 0;
  min-height: 130px;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  padding: 20px 22px 18px;
  overflow: hidden;
  border: 2px solid transparent;
  border-radius: 20px;
  color: #fff;
  text-align: left;
  cursor: pointer;
  transition: transform var(--duration-fast) ease, box-shadow var(--duration-fast) ease, border-color var(--duration-fast) ease;
}

.practice-cover-tile:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(24, 17, 60, 0.16);
}

.practice-cover-tile.is-selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(190, 18, 74, 0.12);
}

.practice-cover-tile.cover-all {
  background: linear-gradient(135deg, #25177e, #17145e);
}

.practice-cover-tile.cover-mixed {
  background: linear-gradient(120deg, #ff8a39, #fb3b5d);
}

.practice-cover-title {
  display: block;
  max-width: 190px;
  padding-right: 28px;
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.35;
}

.practice-cover-stats {
  display: block;
  color: rgba(255, 255, 255, 0.94);
  font-size: 0.84rem;
  font-weight: 600;
  line-height: 1.2;
}

.practice-cover-check {
  position: absolute;
  top: 14px;
  right: 14px;
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  color: #087544;
  font-size: 1.2rem;
  font-weight: 800;
}

.practice-start-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  min-height: 92px;
  margin-top: 24px;
  padding: 16px 22px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  color: var(--ink-secondary);
  box-shadow: var(--shadow-card);
}

.practice-start-button {
  min-width: 220px;
  min-height: 56px;
  border-radius: 999px;
}

.practice-start-button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

/* Bible translation controls stay usable inside narrow verse previews. */
.bible-version-picker { display: grid; gap: 8px; width: 100%; min-width: 0; }
.bible-version-picker label { display: grid; gap: 4px; font-size: 13px; }
.bible-version-picker select { width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; }
.bible-preview-notice, .bible-preview-copyright { display: block; margin-top: 8px; font-size: 12px; }
.bible-preview-notice:empty, .bible-preview-copyright:empty { display: none; }
.bible-preview-esv-link, .bible-preview-youversion-link { display: inline-block; margin-top: 4px; font-size: 12px; }
[hidden].bible-preview-esv-link, [hidden].bible-preview-youversion-link { display: none !important; }
/* Short, purposeful transitions help route and dialog changes feel connected. */
@keyframes appScreenEnter{from{opacity:.72;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes appModalScrimEnter{from{opacity:0}to{opacity:1}}
@keyframes appModalSheetEnter{from{opacity:.88;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.app-screen-enter{animation:appScreenEnter 180ms var(--ease-out, ease-out) both}
#modal .scrim{animation:appModalScrimEnter 150ms ease-out both}
#modal .sheet{animation:appModalSheetEnter 190ms var(--ease-out, ease-out) both}
.lesson-video-continue{transition:transform 160ms ease,box-shadow 160ms ease}
.lesson-video-continue:hover{transform:translateY(-1px)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  .app-screen-enter,#modal .scrim,#modal .sheet{animation:none!important}
  .lesson-video-continue:hover{transform:none}
}

/* Keep motion only for the onboarding handshake; other interface motion is disabled. */
@keyframes onboardingHandshakeShake {
  0%, 76%, 100% { transform: rotate(0deg); }
  80% { transform: rotate(18deg); }
  84% { transform: rotate(-12deg); }
  88% { transform: rotate(16deg); }
  92% { transform: rotate(-8deg); }
  96% { transform: rotate(8deg); }
}
*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.onboarding-screen.commit-screen .commit-emoji{display:inline-block;transform-origin:70% 80%;animation:onboardingHandshakeShake 2.4s ease-in-out infinite!important}
@media(prefers-reduced-motion:reduce){.onboarding-screen.commit-screen .commit-emoji{animation:none!important}}

/* ---------- Video Lesson In-Page Study Modal ---------- */
.video-study-scrim {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65) !important;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 210 !important;
}

#modal .video-study-modal {
  position: fixed;
  z-index: 211;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--ink);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
}

@media (max-width: 767px) {
  #modal .video-study-modal {
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    max-width: none !important;
    border-radius: 0 !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    transform: none !important;
  }
}

@media (min-width: 768px) {
  #modal .video-study-modal {
    top: 24px !important;
    right: 24px !important;
    bottom: 24px !important;
    left: 24px !important;
    margin: auto !important;
    width: min(720px, calc(100vw - 48px)) !important;
    max-width: 720px !important;
    height: fit-content !important;
    max-height: min(860px, calc(100vh - 48px)) !important;
    max-height: min(860px, calc(100dvh - 48px)) !important;
    border-radius: 24px !important;
    padding: 0 !important;
  }
}

.video-study-header {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  z-index: 10;
  flex-shrink: 0;
}

.video-study-close-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 99px;
  font-size: var(--text-sm);
}

.video-study-header-title {
  flex: 1 1 auto;
  text-align: center;
  overflow: hidden;
}

.video-study-header-title h2 {
  margin: 0;
  font-size: var(--text-base);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
}

.video-study-header-counter {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  min-width: 60px;
  text-align: right;
}

.video-study-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--space-md);
  display: flex;
  flex-direction: column;
}

.video-study-body .study-shell {
  padding: 0;
  margin: 0;
  max-width: none;
  background: transparent;
  box-shadow: none;
  border: none;

}

.video-study-body .study-header {

}

.video-study-body .coaching-completion-hero {
  padding-top: var(--space-sm);
}

.video-study-return-btn {
  font-weight: 700;
}

<script type="application/json" id="starter-fallback">""</script>
<script type="application/json" id="devotionals-fallback">[{"id":"devotional-soteriology","title":"Grace That Sets You Free","subtitle":"Resting in the Finished Work of Christ","scripture":"Ephesians 2:8-9","scriptureText":"For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast.","body":["Salvation is neither earned through human merit nor sustained by personal stamina. The scriptures declare with crystal clarity that every believer is justified freely by God's unmerited favor through the redemption that is in Christ Jesus. When Jesus hung upon the cross and proclaimed that it was finished, the penalty for our sin was completely and eternally satisfied. There remains no lingering debt to pay, no punishment left to fear, and no requirement of self-righteousness to fulfill.","Many believers struggle with deep feelings of inadequacy, wondering whether their devotion, prayers, or daily discipline are sufficient to keep them secure in God's family. But true biblical assurance does not depend upon human performance; it rests entirely upon the unshakeable foundation of what Jesus Christ accomplished on our behalf as our substitute. When we place our faith in Him, His perfect righteousness is credited to our account once and for all.","Because justification is a definitive legal verdict rendered by God the Judge, you can approach the presence of the Father with holy confidence and joyful peace. You are not striving to win acceptance; you are living each day from the settled reality of being thoroughly loved, fully accepted, and forever forgiven."],"reflection":"In what areas of your daily walk are you tempted to rely on personal effort rather than resting in Christ's completed work?","step":"Take a quiet moment today to thank God specifically that your standing before Him is an unearned gift of grace.","lessonId":"d-discipleship-experience-section-1-soteriology","readMinutes":2,"gradient":"deck-grad-1","status":"draft","sources":["Ephesians 2:8-9","Romans 3:24-25","Romans 5:1"]},{"id":"devotional-soteriology-ii","title":"Eternal Security in Christ","subtitle":"Preserved by the Power of God","scripture":"Jude 1:24-25","scriptureText":"Now to him who is able to keep you from falling, and to present you before the presence of his glory with exceedingly great joy, to the only God our Savior, be glory and majesty, dominion and power, both now and forever. Amen.","body":["The preservation of the believer is not an achievement of human willpower or moral perfection, but a living testament to divine faithfulness. When God began a good work of redemption in your heart through the gospel, He committed His own character and covenant integrity to completing it until the day of Jesus Christ. Our eternal security rests in the capable hands of the Savior who bought us.","Jesus spoke of His sheep with absolute assurance, declaring that they shall never perish and that no created power can snatch them out of His hand or the Father's hand. Because Christ lives forever to make intercession for us before the throne, His saving power reaches to the uttermost. Even when we stumble or face seasons of weakness, His gripping grace holds us steadfast.","This holy assurance does not encourage spiritual carelessness or license; instead, it fuels genuine gratitude, deep peace, and faithful discipleship. When you know you are held secure by the Sovereign God, fear loses its grip, and sincere love becomes the compelling motivation for your daily walk."],"reflection":"How does knowing God Himself is keeping you secure change how you face spiritual doubts and seasons of trial?","step":"Remind yourself of Jude 1:24 today whenever anxious thoughts about your spiritual standing arise.","lessonId":"d-discipleship-experience-section-2-soteriology-ii","readMinutes":2,"gradient":"deck-grad-2","status":"draft","sources":["Jude 1:24-25","John 10:28-29","Philippians 1:6"]},{"id":"devotional-predestination-trinity","title":"The Eternal Counsel of God","subtitle":"Trusting the Triune God in All Things","scripture":"Romans 8:28-30","scriptureText":"We know that all things work together for good for those who love God, for those who are called according to his purpose. For whom he foreknew, he also predestined to be conformed to the image of his Son.","body":["Before the foundations of the world were laid, the Father, the Son, and the Holy Spirit worked in eternal harmony with a unified purpose centered on redemption. God's sovereign plan is never reactive or caught off guard by human events; His infinite wisdom oversees all history, orchestrating every circumstance to conform believers into the glorious likeness of His beloved Son.","Understanding God's sovereign predestination brings tremendous comfort in times of hardship and uncertainty. Even when events appear disordered, confusing, or painful to human eyes, we can know with unwavering certainty that the One who called us has already secured our eternal glorification. What God begins in eternity past, He unfailingly completes in eternity future.","Our Triune God invites us into fellowship with Himself. The Father's electing love, the Son's redeeming sacrifice, and the Spirit's sealing presence unite to give every Christian unshakeable hope. Rest today in the knowledge that your life is held within His unassailable divine decree."],"reflection":"Are there challenging circumstances right now that you need to entrust to the sovereign, loving plan of God?","step":"Pause to surrender one specific unresolved situation in your life into the Father's hands today.","lessonId":"d-discipleship-experience-section-3-predestination-and-trinity","readMinutes":2,"gradient":"deck-grad-3","status":"draft","sources":["Romans 8:28-30","Deuteronomy 6:4","Ephesians 1:4-5"]},{"id":"devotional-christology","title":"Christ the Supreme Lord","subtitle":"The Image of the Invisible God","scripture":"Colossians 1:15-17","scriptureText":"He is the image of the invisible God, the firstborn of all creation. For by him all things were created in the heavens and on the earth... and he is before all things, and in him all things are held together.","body":["Jesus Christ is not merely a wise moral teacher, a historical martyr, or an inspirational prophet; He is God manifested in human flesh. In Him dwells all the fullness of the Godhead in bodily form. All creation owes its very existence to His sovereign word, and by His power, every particle of the universe is held together at this very moment.","When we look upon the person and character of Jesus in the scriptures, we behold the true nature and compassion of Almighty God. His genuine humanity enabled Him to identify with our weaknesses, suffer on our behalf, and conquer death, while His undiminished deity made His sacrifice of infinite worth for the salvation of all who believe.","Giving Christ preeminence in our thoughts, choices, relationships, and ambitions aligns our lives with the ultimate design of the cosmos. He is worthy of our complete surrender, supreme reverence, and wholehearted worship in every sphere of life."],"reflection":"What would it look like for Jesus Christ to hold first place in your daily schedule and thought life?","step":"Identify one ambition or decision today and deliberately ask yourself how to honor Christ's supremacy in it.","lessonId":"d-discipleship-experience-section-4-christology","readMinutes":2,"gradient":"deck-grad-4","status":"draft","sources":["Colossians 1:15-17","John 1:1-3","Hebrews 1:1-3"]},{"id":"devotional-christian-conduct","title":"Walking in Newness of Life","subtitle":"Living from Our Union with Christ","scripture":"Romans 6:6-11","scriptureText":"Knowing this, that our old man was crucified with him, that the body of sin might be done away with, that we would no longer be in bondage to sin... So you also consider yourselves also to be dead to sin, but alive to God in Christ Jesus our Lord.","body":["Christian ethics are not an external set of burdensome rules designed to earn divine favor or avoid punitive condemnation. They are the natural outflow of a miraculously transformed identity. When we believed in Jesus, our old self was united with Him in His death, breaking once and for all the tyrannical dominion that sin held over our lives.","Now, by the Holy Spirit residing within us, we are commanded to consider ourselves dead to sin and vibrantly alive to God. This means we do not resist temptation through mere fleshly willpower or guilt-driven restraint, but by agreeing with the spiritual reality of who we have become in Christ. We are new creations in Him.","As we yield our minds, speech, and bodies as instruments of righteousness, the radiant life of Jesus becomes visible in our integrity, love, and community. True holiness is not legalistic drudgery; it is the joyful fruit of walking in the liberty of the Spirit."],"reflection":"Where in your life have you been treating holiness like mere rule-following rather than walking in your new identity?","step":"When confronted with temptation today, pause and declare: I am alive to God in Christ Jesus.","lessonId":"d-discipleship-experience-section-5-christian-conduct","readMinutes":2,"gradient":"deck-grad-5","status":"draft","sources":["Romans 6:6-11","Galatians 5:16","Colossians 3:1-3"]},{"id":"devotional-prayer","title":"The Privilege of Communion","subtitle":"Approaching the Throne of Grace with Boldness","scripture":"Hebrews 4:16","scriptureText":"Let us therefore draw near with boldness to the throne of grace, that we may receive mercy, and find grace for help in time of need.","body":["Prayer is not an exhausting religious ritual designed to persuade a reluctant deity to notice our needs. It is the blood-bought privilege of coming directly into the presence of our Heavenly Father, knowing that our Great High Priest has opened a new and living way through the veil of His sacrifice. Christ is our continuous advocate in heaven.","Because Jesus represents us before the Father, we never have to approach God with fearful hesitation, shame, or condemnation. His throne is explicitly named a throne of grace, where mercy is generously poured out and timely spiritual help is granted for every trial, burden, and decision we face in daily living. We are welcomed as beloved children.","In prayer, we align our wills with God's loving purposes, intercede for a broken world, and cast all our anxieties upon Him because He cares for us. As we cultivate a lifestyle of unceasing prayer with thanksgiving, the supernatural peace of God guards our hearts and minds above all circumstances."],"reflection":"Do you view prayer primarily as a duty, or as an open door into unbroken communion with a loving Father?","step":"Set aside five unhurried minutes today simply to thank God for His goodness before asking for anything.","lessonId":"d-discipleship-experience-section-6-prayer","readMinutes":2,"gradient":"deck-grad-6","status":"draft","sources":["Hebrews 4:16","Philippians 4:6-7","Luke 11:1-4"]},{"id":"devotional-bible-experience-i","title":"The Living and Active Word","subtitle":"Nourishing the Soul on God's Truth","scripture":"2 Timothy 3:16-17","scriptureText":"Every Scripture is God-breathed and profitable for teaching, for reproof, for correction, and for instruction in righteousness, that each person of God may be complete, thoroughly equipped for every good work.","body":["The Bible is not merely an ancient historical record or a human collection of spiritual philosophy; it is the God-breathed revelation inspired by the Holy Spirit. Through its sacred pages, the living God has faithfully revealed His timeless character, His eternal covenants, and His unfolding wisdom for all of human life and redemption across generations.","Scripture acts as an infallible lamp to our feet and a trustworthy light to our path in a dark and confusing world. When we read it with submissive and receptive hearts, it exposes the lies of our culture, corrects our faulty perspectives, and thoroughly equips us to walk in fruitfulness, humility, and moral integrity.","Make God's written Word your primary daily nourishment. As you read, study, and meditate upon its rich promises, your spiritual foundation will remain unshakeable, providing steady anchor and divine clarity against every storm of doubt, fear, or worldly adversity that you encounter."],"reflection":"What consistent rhythm do you have for reading and meditating upon God's Word each day?","step":"Choose one verse from your reading today and write it down or recite it three times throughout your day.","lessonId":"d-discipleship-experience-section-7-bible-experience-i","readMinutes":2,"gradient":"deck-grad-7","status":"draft","sources":["2 Timothy 3:16-17","Psalm 119:105","Hebrews 4:12"]},{"id":"devotional-bible-experience-ii","title":"Reading with a Christ-Centered Lens","subtitle":"Seeing Jesus Throughout All Scripture","scripture":"Luke 24:27","scriptureText":"Beginning from Moses and from all the prophets, he explained to them in all the Scriptures the things concerning himself.","body":["On the road to Emmaus, the risen Lord opened the eyes of downcast disciples by demonstrating that the entire Hebrew canon—the Law of Moses, the Prophets, and the Psalms—points directly to His suffering and subsequent glory. Jesus Christ is the unifying theme, fulfillment, and ultimate destination of all biblical revelation from Genesis to Revelation.","When we read Scripture without Christ as our interpretive center, the Bible can easily be reduced to a handbook of dry legalism or a moralistic catalog of behavioral examples. But when we view each narrative through the lens of redemption, the text bursts with life, purpose, and transforming gospel grace for our everyday faith.","Every priesthood foreshadowed His mediation; every sacrificial lamb pointed toward His cross; every righteous king looked ahead to His eternal kingdom. Whenever you open the Bible, approach it with expectant eyes and a teachable spirit, asking the Holy Spirit to reveal the matchless glory and salvation of Jesus."],"reflection":"How does looking for Jesus in the Old Testament change the way you understand and appreciate its stories?","step":"The next time you read an Old Testament passage, ask yourself: How does this point forward to Christ?","lessonId":"d-discipleship-experience-section-8-bible-experience-ii","readMinutes":2,"gradient":"deck-grad-8","status":"draft","sources":["Luke 24:25-27","John 5:39","1 Corinthians 10:4"]},{"id":"devotional-evangelism","title":"Ambassadors of Reconciliation","subtitle":"Sharing the Good News of Grace","scripture":"2 Corinthians 5:18-20","scriptureText":"All things are of God, who reconciled us to himself through Jesus Christ, and gave to us the ministry of reconciliation... We are therefore ambassadors on behalf of Christ.","body":["The message of the gospel is the most urgent, joyful, and liberating news the world has ever heard. In the incarnation, death, and resurrection of Jesus, God was reconciling the world to Himself, not imputing their trespasses against them. Having tasted this boundless mercy, we are now entrusted with the sacred ministry of gospel reconciliation.","Evangelism is neither an aggressive intellectual argument nor a guilt-ridden sales pitch; it is the natural overflow of a heart captivated by the kindness and majesty of the Savior. As Christ's chosen ambassadors, we represent His heart to our neighbors with gentle respect, authentic love, and an unwavering commitment to the truth of His Word.","Every day, we encounter individuals who are carrying heavy burdens of shame, quiet despair, and spiritual hopelessness. When we share the simple truth of God's grace and authenticate it with compassionate deeds, the Holy Spirit works powerfully through our witness to draw people into eternal salvation and freedom."],"reflection":"Who in your circle of friends, family, or work colleagues needs to hear the comforting message of God's love?","step":"Pray by name today for one person who does not know Christ, asking for an opportunity to show them His love.","lessonId":"d-discipleship-experience-section-9-evangelism","readMinutes":2,"gradient":"deck-grad-9","status":"draft","sources":["2 Corinthians 5:18-20","Romans 1:16","Acts 1:8"]},{"id":"devotional-apologetics","title":"Ready with Gentle Answers","subtitle":"Defending the Faith with Grace and Reason","scripture":"1 Peter 3:15","scriptureText":"Sanctify the Lord God in your hearts; and always be ready to give an answer to everyone who asks you a reason concerning the hope that is in you, yet with humility and fear.","body":["The Christian faith is never a blind leap into ungrounded wishful thinking; it is intelligent trust rooted in verifiable history, fulfilled biblical prophecy, and the bodily resurrection of our Lord Jesus Christ. God welcomes sincere questions and provides compelling, rational evidence to undergird our confidence in His promises.","Biblical apologetics begins not in debate halls, but within our own quiet devotion. When we sanctify Christ as Lord of our hearts and demonstrate unshakable peace amidst adversity, thoughtful observers will inevitably ask about the origin of our living hope. Our personal character and gentle love must always support our defense of truth.","Peter instructs us to present our reasons with humility, gentleness, and reverent respect. Our ultimate objective is never to humiliate an opponent or triumph in an argument, but to point seekers toward the beauty and truth of Jesus Christ so they too may find forgiveness and eternal life in His name."],"reflection":"How can you prepare yourself to answer common questions about your faith with both intellectual clarity and Christlike kindness?","step":"Think of one question someone recently asked you about your faith, and research the biblical answer to strengthen your readiness.","lessonId":"d-discipleship-experience-section-10-apologetics","readMinutes":2,"gradient":"deck-grad-10","status":"draft","sources":["1 Peter 3:15","Colossians 4:6","Acts 17:2-3"]},{"id":"devotional-believers-authority","title":"Standing in Christ's Victory","subtitle":"Exercising the Authority of the Risen Lord","scripture":"Ephesians 1:19-21","scriptureText":"According to the working of the strength of his might which he worked in Christ, when he raised him from the dead, and made him to sit at his right hand in the heavenly places, far above all rule, authority, power, dominion...","body":["When Jesus Christ rose bodily from the grave and ascended to the right hand of the Father, He disarmed principalities and powers, triumphing over them in His resurrection. The astounding declaration of the gospel is that every believer is seated with Christ in heavenly places, sharing in His decisive victory.","We do not labor or battle in order to achieve victory; we stand steadfast from the position of victory that our Lord has already secured on our behalf. The authority belonging to the believer is not born of human charisma, pride, or personal strength, but is founded upon the mighty name of Jesus and His shed blood.","When confronted with spiritual opposition, debilitating fear, or adversity, we are called to stand firm in the armor of God, speaking His Word in faith. As we abide in Christ and exercise His authority with humility, His light dispels darkness and brings liberty to those around us."],"reflection":"Are you living defensively, or are you walking with confident assurance in Christ's triumph over sin and darkness?","step":"Declare Ephesians 1:20-21 out loud over your home, family, or situation of anxiety today.","lessonId":"d-discipleship-experience-section-11-believers-authority-chari","readMinutes":2,"gradient":"deck-grad-11","status":"draft","sources":["Ephesians 1:19-21","Ephesians 2:6","Luke 10:19"]},{"id":"devotional-church-history","title":"The Unstoppable Church","subtitle":"Built upon the Rock of Christ","scripture":"Matthew 16:18","scriptureText":"I also tell you that you are Peter, and on this rock I will build my assembly, and the gates of Hades will not prevail against it.","body":["Throughout two millennia of human history, the church of Jesus Christ has persevered through intense persecution, political turmoil, cultural revolutions, and internal adversity. Across every age and empire, the Lord's prophetic declaration remains totally unbroken: He is building His church, and the gates of hell cannot overpower it.","Studying church history reminds believers that we are part of a glorious, unbroken spiritual lineage. Courageous brothers and sisters before us preserved orthodox doctrine, translated the Scriptures at the hazard of their lives, and carried the gospel across oceans so that we might walk in truth and liberty today.","We do not run this race alone or in isolation. As local assemblies gather in fellowship, sound teaching, worship, and mutual love, we testify to the living reality of the resurrected Christ. Be strengthened today knowing that the sovereign God who faithfully sustained His saints in past generations is with us right now, guiding our steps."],"reflection":"How does remembering the faithfulness of prior generations of Christians encourage your own perseverance today?","step":"Say a prayer of thanksgiving today for the local church and for the brothers and sisters who labor alongside you in the faith.","lessonId":"d-discipleship-experience-section-12-church-history","readMinutes":2,"gradient":"deck-grad-12","status":"draft","sources":["Matthew 16:18","Hebrews 12:1-2","Acts 2:42-47"]}]</script>

  views.streak = function () {
    var now = Date.now();

    var title = streak === 1 ? "You're showing up!" : (streak + ' Days in a Row!');
    var subtitle = streak === 1

      : (streak + ' consecutive days of study. Steady growth in faith and understanding.');

    var dayNames = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    var todayDay = 0;
    if (typeof Date === 'function') {
      try {
        var today = new Date(now);
        todayDay = (today.getDay() + 6) % 7;
      } catch (e) {}
    } else {
      var daysSinceEpoch = Math.floor(now / 86400000);
      todayDay = (daysSinceEpoch + 3) % 7;
    }
    var weekDots = dayNames.map(function (dName, idx) {
      var isCurrent = idx === todayDay;
      var isPast = idx < todayDay;
      var isStudied = isCurrent || (isPast && (todayDay - idx < streak));
      var cls = 'streak-day-dot';
      if (isCurrent) cls += ' current';
      if (isStudied) cls += ' done';
      return '<div class="' + cls + '"><span class="streak-day-name">' + dName + '</span><span class="streak-day-mark">' + (isStudied ? '✓' : '·') + '</span></div>';

  function todayString(ts) {
    var ms = Number.isFinite(ts) ? ts : (typeof Date !== 'undefined' && Date.now ? Date.now() : 0);
    if (typeof Date === 'function') {
      try {
        var d = new Date(ms);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      } catch (e) {}
    }
    var days = Math.floor(ms / 86400000);
    var z = days + 719468;
    var era = Math.floor((z >= 0 ? z : z - 146096) / 146097);
    var doe = z - era * 146097;
    var yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
    var y = yoe + era * 400;
    var doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
    var mp = Math.floor((5 * doy + 2) / 153);
    var dNum = doy - Math.floor((153 * mp + 2) / 5) + 1;
    var mNum = mp < 10 ? mp + 3 : mp - 9;
    if (mNum <= 2) y++;
    return y + '-' + String(mNum).padStart(2, '0') + '-' + String(dNum).padStart(2, '0');
  }

      case 'restore': if (IMP.backup) ask('Replace all current decks, progress, and preferences with the selected backup?', 'Restore backup', function () { S = IMP.backup; S.pausedSession = null; SEL.clear(); homeFilter = ''; preserveStorage = false; applyDataMigrations(); save(); applyTheme(); IMP = { decks: [], errors: [], warnings: [], text: '', parsed: false, backup: null }; toast('Backup restored.'); go({ name: 'home' }); }); break;
      case 'exportall': download('all-decks.txt', P.serializeDecks(S.decks)); break;
      case 'edit': go({ name: 'edit', id: t.dataset.id, editing: null, filter: '' }); break;
      case 'export': exportDeck(deck(V.id)); break;
      case 'ddel': d = deck(V.id); ask('Delete "' + (MobileStudy.parseChapterTitle(d.title).topic || d.title) + '" and its progress? Export it first if you want to keep a copy.', 'Delete deck', function () { S.decks = S.decks.filter(function (x) { return x.id !== d.id; }); delete S.progress[d.id]; SEL.delete(d.id); save(); go({ name: 'home' }); }); break;
      case 'cnew': V.editing = 'new'; render(true); break;
      case 'cedit': V.editing = +t.dataset.i; render(true); break;
      case 'ccancel': V.editing = null; render(true); break;
      case 'csave': saveCard(); break;
      case 'cdel': d = deck(V.id); var ci = +t.dataset.i; ask('Delete question ' + (ci + 1) + '?', 'Delete card', function () { var c = d.cards.splice(ci, 1)[0], p = prog(d.id); delete p.cards[c.id]; p.best = null; V.editing = null; save(); render(true); }); break;
      case 'flip':
        if (V.videoStudy) {
          V.videoStudy.flipped = !V.videoStudy.flipped;
          S.pausedSession = MobileStudy.snapshot(V.videoStudy);
          save();
          renderVideoStudyModal();
        } else {
          V.flipped = !V.flipped;
          saveActiveSession();
          render(true);
        }
        break;
      case 'mark':
        if (V.videoStudy) {
          mark(V.videoStudy.cards[V.videoStudy.i], t.dataset.v);
          V.videoStudy.marks[V.videoStudy.cards[V.videoStudy.i].card.id] = t.dataset.v;
          stepVideoStudy(1);
        } else {
          mark(V.cards[V.i], t.dataset.v);
          V.marks[V.cards[V.i].card.id] = t.dataset.v;
          step(1);
        }
        break;
      case 'next':
        if (V.videoStudy) stepVideoStudy(1);
        else step(1);
        break;
      case 'prev':
        if (V.videoStudy) stepVideoStudy(-1);
        else step(-1);
        break;
      case 'pick':
        if (V.videoStudy) pickVideoStudy(+t.dataset.i);
        else pick(+t.dataset.i);
        break;
      case 'review':
        if (V.videoStudy && V.videoStudy.results) {
          var missed = V.videoStudy.results.kind === 'quiz' ? V.videoStudy.results.missed : V.videoStudy.results.learning;
          startVideoStudyModal('flash', shuffle(missed), {}, V.videoStudy.results.ids, V.videoStudy.results.returnToVideo);
        } else {
          begin('flash', shuffle(V.kind === 'quiz' ? V.missed : V.learning), {}, V.ids, V.returnToVideo);
        }
        break;
      case 'again':
        if (V.videoStudy && V.videoStudy.results) {
          var allCards = V.videoStudy.results.all;
          var nextMode = V.videoStudy.results.kind === 'quiz' ? 'quiz' : 'flash';
          startVideoStudyModal(nextMode, nextMode === 'quiz' ? shuffle(allCards) : allCards, V.videoStudy.results.opts, V.videoStudy.results.ids, V.videoStudy.results.returnToVideo);
        } else {
          var all = V.all;
          begin(V.kind === 'quiz' ? 'quiz' : 'flash', V.kind === 'quiz' ? shuffle(all) : all, V.opts, V.ids, V.returnToVideo);
        }
