R: C\nEXPLANATION: Acts 26:5 uses foreknew of people knowing Paul’s former life, so the term must be interpreted in context.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [15:16]–[16:34] (approximate range)\n\nQ17. Which two truths must both be upheld for a correct understanding of the Trinity?\nA. Unity and authority.\nB. Distinction and equality.\nC. Glory and power.\nD. Love and holiness.\nANSWER: B\nEXPLANATION: The lesson presents distinction and equality as the two pillars of the Trinity doctrine.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [04:07]–[06:10] (approximate range)\n\nQ18. What principle is reflected by the movement between Genesis, Isaiah, Psalms, Daniel, John, Hebrews, Acts, and Revelation?\nA. Difficult doctrines should rest on the cumulative witness of Scripture.\nB. Every doctrine should begin in the New Testament.\nC. Old Testament passages are only illustrations.\nD. Individual verses should be interpreted independently.\nANSWER: A\nEXPLANATION: The lessons support the doctrine using passages from across Scripture rather than relying on a single text.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [05:05]–[18:00] and TRINITY II – Celebration Church International - LMS.mp4 — [05:50]–[12:50] (approximate ranges)\n\nQ19. What interpretive mistake leads many readers to misunderstand predestination in Ephesians 1?\nA. Reading poetry as literal doctrine.\nB. Ignoring the original language.\nC. Confusing salvation with inheritance.\nD. Reading a corporate discussion as though it were about individuals.\nANSWER: D\nEXPLANATION: The lesson warns against treating a corporate discussion of Jews and Gentiles as though it were about individuals.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [12:03]–[14:09] (approximate range)\n\nQ20. \"Whatever you are looking for, you will find...There is a scripture for everything you believe.\" What principle is being warned against?\nA. Depending too much on Bible translations.\nB. Ignoring the original biblical languages.\nC. Looking for verses that support ideas you already hold.\nD. Relying too heavily on cross-references.\nANSWER: C\nEXPLANATION: Finding a verse that supports a belief does not by itself make that belief true.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [19:13]–[19:59] (approximate range)\n\nQ21. Someone says the Trinity can't be biblical since the word isn't in Scripture. What is your best response?\nA. Every biblical doctrine must appear by name in Scripture.\nB. A doctrine is biblical if Scripture teaches the concept, even if the term is not used.\nC. The Trinity became biblical after church councils accepted it.\nD. The Trinity is mainly based on Christian tradition.\nANSWER: B\nEXPLANATION: The lesson says theological terms may name concepts taught in Scripture even when the exact term is absent.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [11:30]–[12:30] (approximate range)\n\nQ22. Why does Apostle repeatedly appeal to Old Testament passages when discussing the Trinity?\nA. To show that later Christian writers misunderstood them.\nB. To demonstrate that the doctrine was already present before the New Testament.\nC. To establish that the New Testament should be interpreted through Judaism alone.\nD. To prove that every Old Testament appearance of God refers only to Christ.\nANSWER: B\nEXPLANATION: Old Testament passages are used to show that evidence for the Trinity predates the New Testament.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [13:28]–[17:01] (approximate range)\n\nQ23. Which observation from Ephesians 1 forms the foundation of the interpretation of predestination?\nA. The inheritance belongs only to the apostles.\nB. God's will excludes every human response.\nC. Paul's repeated change in audience throughout the passage must be accounted for.\nD. Every occurrence of \"predestined\" always refers to salvation.\nANSWER: C\nEXPLANATION: The lesson distinguishes ‘we who first trusted’ from the ‘you also’ addressed in Ephesians 1.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [03:53]–[05:10] (approximate range)\n\nQ24. According to the lesson, what should be the primary test of any doctrine about God?\nA. Whether it agrees with human reasoning.\nB. Whether respected scholars accept it.\nC. Whether it can be illustrated from nature.\nD. Whether it is taught by Scripture.\nANSWER: D\nEXPLANATION: The lesson says a doctrine should be tested by whether the Bible teaches it, not by whether it fits human logic.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [02:13]–[03:10] (approximate range)\n\nQ25. Why does Apostle repeatedly distinguish between \"we\" and \"you\" in Ephesians 1?\nA. To distinguish the apostles from ordinary believers.\nB. To show that Paul's argument distinguishes Jewish believers from Gentile believers.\nC. To identify mature Christians and immature Christians.\nD. To explain the difference between believers before and after Pentecost.\nANSWER: B\nEXPLANATION: The lesson identifies ‘we’ as Jewish believers and ‘you also’ as Gentile believers in the passage.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [03:53]–[05:10] (approximate range)\n\nQ26. Why is it important for Christians to study doctrines such as the Trinity?\nA. To become more effective in theological debates.\nB. To answer sincere questions about their faith with biblical understanding.\nC. To master historical church controversies.\nD. To avoid reading non-Christian literature.\nANSWER: B\nEXPLANATION: Believers should be ready to explain and defend their faith when asked.\nREF: TRINITY III – Celebration Church International - LMS.mp4 — [01:00]–[01:42] (approximate range)\n\nQ27. Why is the parable in Matthew 20 and Matthew 22 used when discussing \"called\"?\nA. To prove that every use of the word has exactly the same meaning.\nB. To establish that \"called\" always refers to believers.\nC. To demonstrate that the Greek word has only one possible definition.\nD. To let Jesus' own use of the term shape how Paul's language is understood.\nANSWER: D\nEXPLANATION: The lesson compares Jesus’ use of ‘called’ in Matthew 20 and 22 with Paul’s wording in Romans 8.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [06:53]–[12:03] (approximate range)\n\nQ28. How does Genesis 2:24 support the explanation of echad?\nA. It uses the same word to describe two persons united as one.\nB. It teaches that marriage represents the Trinity.\nC. It shows that Adam and Eve became one person.\nD. It replaces the meaning of Deuteronomy 6:4.\nANSWER: A\nEXPLANATION: Genesis 2:24 is cited as an example of echad describing two persons united as one.\nREF: TRINITY I – Celebration Church International - LMS.mp4 — [06:10]–[07:11] (approximate range)\n\nQ29. Apostle challenges a student's interpretation of Romans 8:29 by opening other passages, what principle is he modeling?\nA. Difficult passages should only be interpreted using the original Greek.\nB. Every doctrine should be established from multiple Bible translations.\nC. Individual verses should be interpreted within the flow of the Bible's larger argument.\nD. New Testament doctrines should always be explained from the Old Testament first.\nANSWER: C\nEXPLANATION: The lesson models interpreting a verse in context and within the Bible’s wider argument.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [01:04]–[02:07] and [06:53]–[13:39] (approximate ranges)\n\nQ30. Which statement best summarizes the overall philosophy of biblical interpretation in this lesson?\nA. Strong theological systems should determine how individual passages are read.\nB. Greek word studies are sufficient to settle difficult doctrines.\nC. Logical deductions should take priority whenever Scripture appears unclear.\nD. Scripture must interpret Scripture, with context governing the meaning of theological terms.\nANSWER: D\nEXPLANATION: The lesson repeatedly says to interpret passages and theological terms in their biblical context.\nREF: PREDESTINATION II – Celebration Church International - LMS.mp4 — [01:04]–[02:07], [12:03]–[14:09], and [14:09]–[16:34] (approximate ranges)\n\nDECK: Discipleship Experience (Section 4) Christology\n\nQ1. In explaining Luke 24:25–27, how does the lesson define the theological term \"hermeneutical framework\"?\nA. A systematic method of memorizing Hebrew root words to translate the Old Testament accurately.\nB. A practical, step-by-step strategy for conducting effective soul-winning in urban centers.\nC. A specific lens or science of Bible interpretation used to read and understand the scriptures.\nD. An ancient church creed established to guard local congregations against heresies.\nANSWER: C\nEXPLANATION: The lesson defines a hermeneutical framework as a way of reading Scripture, grounded in the science of biblical interpretation.\nREF: JESUS- SON OF GOD I – Celebration Church International - LMS.mp4 — [09:27]–[10:15] (approximate range)\n\nQ2. Why did Jesus address the two sad disciples on the road to Emmaus as \"foolish ones and slow of heart\" instead of offering immediate emotional comfort?\nA. Because they had abandoned the apostles in Jerusalem during a time of intense political persecution.\nB. Because the realm of the spirit operates on the consciousness of the Word, not on emotions\nC. Because they refused to believe the eyewitness testimony of the women who had visited the empty tomb that morning.\nD. Because their grief was causing them to walk away from their assigned geographic ministry destination.\nANSWER: B\nEXPLANATION: The lesson presents Jesus’ response as correcting the disciples’ understanding through Scripture rather than simply responding to their sadness.\nREF: JESUS- SON OF GOD I – Celebration Church International - LMS.mp4 — [03:29]–[04:31] (approximate range)\n\nQ3. What detail does the lesson highlight to prove that John 1:1 was written as a deliberate theological commentary on Genesis 1:1?\nA. Both books were originally transcribed in Aramaic during the exilic period in Babylon.\nB. The Greek Septuagint translation of Genesis 1:1 and John 1:1 open with the exact same phrasing.\nC. John explicitly cites Moses by name in the opening sentence of his Gospel account.\nD. The original Hebrew text of John's Gospel was discovered alongside the Genesis scrolls at Qumran.\nANSWER: B\nEXPLANATION: The lesson says the matching opening in the Septuagint links John’s opening to Genesis.\nREF: JESUS- SON OF GOD I – Celebration Church International - LMS.mp4 — [14:49]–[15:41] (approximate range)\n\nQ4. How does John 1 resolve the chronological puzzle of light appearing in Genesis 1:3 days before the physical sun and moon were created?\nA. It explains that Genesis 1:3 refers to atmospheric lightning caused by rapid thermal expansion.\nB. It reveals that the light was Christ Himself, whose divine life was the creative light of men.\nC. It shows that Moses used metaphorical poetry rather than a literal chronological sequence.\nD. It clarifies that the sun was actually created in Genesis 1:1 but was hidden by heavy vapor clouds.\nANSWER: B\nEXPLANATION: The lesson identifies the light in Genesis 1 with Christ, referring to John 1’s description of life and light.\nREF: JESUS- SON OF GOD I – Celebration Church International - LMS.mp4 — [17:42]–[18:47] (approximate range)\n\nQ5. When Joshua encountered the man standing with a drawn sword in Joshua 5 and fell down to worship him, why was this act of worship NOT considered blasphemy?\nA. Because Joshua was an anointed military commander who possessed special exemption from the Second Commandment.\nB. Because the figure was a physical divine manifestation of Yahweh Himself.\nC. Because Old Testament saints were permitted to worship holy angels prior to the giving of the Mosaic Law.\nD. Because Joshua was actually worshipping the holy ground beneath his feet rather than the person standing before him.\nANSWER: B\nEXPLANATION: The lesson identifies the figure Joshua worshipped as a manifestation of God, not an ordinary angel.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [07:21]–[08:24] (approximate range)\n\nQ6. According to Genesis 15:1–5 and 1 Samuel 3:10, how should we understand the phrase \"the Word of the Lord came\"?\nA. As an audible voice.\nB. As a poetic literary device used by ancient prophets to express human intuition.\nC. As a physical, visible Divine Person.\nD. As a secret message passed through angelic messengers to the high priest.\nANSWER: C\nEXPLANATION: The lesson interprets ‘the Word of the Lord came’ in these passages as a personal, visible encounter.\nREF: JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [10:30]–[13:11] (approximate range)\n\nQ7. How does the lesson explain Jesus' statement in John 8:58, \"Before Abraham was, I am\"?\nA. Jesus was referring to His pre-ordained selection in the mind of God before creation.\nB. Jesus was asserting His pre-existence, having personally interacted with Abraham in Genesis.\nC. Jesus was referring to the immortal nature that all human souls possess prior to biological birth.\nD. Jesus was claiming that His earthly human lineage could be traced back genealogically before Abraham.\nANSWER: B\nEXPLANATION: The lesson connects Jesus’ claim with the Word of the Lord’s earlier personal encounters with Abraham.\nREF: JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [13:11]–[14:14] (approximate range)\n\nQ8. According to the lesson, what is the primary doctrinal difference between Christ's Old Testament manifestations and His New Testament Incarnation?\nA. In the Old Testament He appeared as an angel, whereas in the New Testament He appeared as a prophet.\nB. In the Old Testament He assumed temporary physical forms, but in the Incarnation He was permanently born as a true man.\nC. In the Old Testament He possessed limited divine power, but in the New Testament He received full omnipotence.\nD. In the Old Testament He spoke only to Israel, but in the Incarnation He spoke exclusively to the Gentiles.\nANSWER: B\nEXPLANATION: The lesson distinguishes temporary Old Testament manifestations from Christ’s birth as a true man in the Incarnation.\nREF: JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [14:14]–[15:28] (approximate range)\n\nQ9. What makes Christ the ultimate standard when we are commanded to be \"imitators of Christ\"?\nA. He bypassed real human emotional limitations through His divine omniscience.\nB. He lived out God's character in human shoes, proving that divine righteousness is applicable to human existence.\nC. He laid down His divine attributes permanently and functioned purely as a human prophet.\nD. He established an easier way suited for fragile human nature compared to the Old Testament standard.\nANSWER: B\nEXPLANATION: The lesson presents Christ’s genuinely human, sinless life as the example believers are to imitate.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [15:12]–[17:30] (approximate range)\n\nQ10. How does the revelation of God in Jesus Christ refine our understanding of God's nature under the Law?\nA. It shows that the Law were not the full expression of God's nature.\nB. It proves God was vengeful in the Old Testament but changed His personality in the New Testament.\nC. It shows that the Law was authored by angels rather than God.\nD. It proves that God's grace did not exist prior to the birth of Jesus in Bethlehem.\nANSWER: A\nEXPLANATION: The lesson says Jesus reveals aspects of God’s nature, such as mercy and grace, not fully expressed in the Law.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [17:30]–end of transcript (approximate boundary)\n\nQ11. How do we resolve the contradiction between Jesus \"growing in wisdom\" (Luke 2:52) and Jesus being the All-Knowing God?\nA. Jesus only feigned ignorance in public so His peers wouldn't feel uncomfortable.\nB. He is omniscient, but in His human nature He voluntarily experienced human development.\nC. His divine nature completely replaced His human mind once He turned thirty.\nD. Luke 2:52 is talking about spiritual growth rather than actual cognitive development.\nANSWER: B\nEXPLANATION: The lesson explains that Jesus is all-knowing in His divine nature and experienced growth in His human nature.\nREF: JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [02:31]–[04:54] (approximate range)\n\nQ12. Why is it crucial for our redemption that Jesus suffered as a genuine human rather than a divine manifestation?\nA. Because if He were only divine, the crucifixion would be acting rather than actual human suffering absorbing the penalty of sin.\nB. Because angels are incapable of entering physical blood covenants.\nC. Because divine beings cannot experience physical fatigue or emotional sadness.\nD. Because the Mosaic Law required a human priest to offer a human sacrifice to satisfy the altar's requirements.\nANSWER: A\nEXPLANATION: The lessons connect Christ’s humanity with real suffering and with His ability to die for humanity’s sins.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [09:49]–[12:10] and JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [16:01]–[16:56] (approximate ranges)\n\nQ13. How does the reality of hematidrosis (sweating drops of blood) substantiate the doctrine of Christ’s humanity?\nA. It proves that Jesus contracted a physical disease right before His arrest.\nB. It serves as proof of extreme human stress, proving He was never insulated from human pain.\nC. It proves that the blood shed in Gethsemane had more redemptive power than the blood shed on the cross.\nD. It demonstrates that Jesus was physically weaker than most religious martyrs.\nANSWER: B\nEXPLANATION: The lesson presents the blood-like sweat as evidence of the extreme stress Jesus experienced as a human.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [11:00]–[12:10] (approximate range)\n\nQ14. How does the lady turned \"detective\" illustrate the believer's duty to \"love the Lord with all your mind\" (Matthew 22:37)?\nA. Genuine love naturally produces an intense, investigating hunger.\nB. True devotion requires believers to know their faith well to win debates against secular scholars.\nC. A loving heart must constantly cross-examine church leaders to verify whether their personal life matches their doctrine\nD. Loving God with the mind means experiencing emotional expressions during worship.\nANSWER: A\nEXPLANATION: The illustration links love for God with a desire to know more about Him.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [02:38]–[04:30] (approximate range)\n\nQ15. Why does Apostle state that Christianity and Buddhism are fundamentally incompatible (\"we cannot both be right\")?\nA. Buddhism denies the existence of moral evil, whereas Christianity teaches that evil is inherited from Adam.\nB. Buddhism teaches that world miseries end when we do what is right, whereas Christianity teaches we must believe what is right to be empowered to do what is right.\nC. Buddhism claims spiritual enlightenment is achieved through suffering, while Christianity claims suffering is always a sign of demonic influence.\nD. Buddhism rejects the reality of an afterlife, whereas Christianity teaches that we live eternally in heaven or hell.\nANSWER: B\nEXPLANATION: The Apostle contrasts the two teachings about what ends the world’s miseries and how people are enabled to do what is right.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [07:41]–[08:41] (approximate range)\n\nQ16. Which scripture directly dismantles the Jehovah's Witness assertion that Jesus is merely the archangel Michael?\nA. John 11\nB. Hebrews 1\nC. Matthew 28\nD. Colossians 2\nANSWER: B\nEXPLANATION: The lesson cites Hebrews 1 to show Jesus receives worship and does works associated with God, rather than being merely an angel.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [08:41]–[09:36] and [13:34]–[14:58] (approximate ranges)\n\nQ17. What combination of divine Deeds (\"D\") and Seat (\"S\") in the HANDS acronym belongs exclusively to Jesus?\nA. Creating the universe, forgiving sins, exercising final judgment, and occupying God's eternal throne.\nB. Parting waters, giving divine commandments, defeating earthly armies, and ruling over angels.\nC. Establishing the Church, indwelling believers, authoring Scripture, and interceding for saints.\nD. Raising the dead, instituting communion, abolishing the Old Covenant, and establishing physical Israel.\nANSWER: A\nEXPLANATION: The lesson gives creation, forgiveness of sins, final judgment, and God’s throne as evidence of Christ’s deity.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [12:24]–[14:58] (approximate range)\n\nQ18. Why did the Sanhedrin condemn Jesus for blasphemy when He claimed the title \"Son of Man\" before Caiaphas?\nA. Because \"Son of Man\" was a political title reserved for the earthly King of Israel.\nB. Because He was invoking Daniel 7.\nC. Because the title implied that God had entered human existence through biological reproduction.\nD. Because claims of divine sonship were strictly forbidden under the traditional oral rabbinic code.\nANSWER: B\nEXPLANATION: The lessons connect Jesus’ words before the high priest with Daniel 7 and explain that His hearers understood the claim as one to deity.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [14:58]–[15:57] and JESUS- SON OF GOD III – Celebration Church International - LMS.mp4 — [23:41]–[25:26] (approximate ranges)\n\nQ19. How does the lesson explain the Old Testament concept of the \"Two Yahwehs\"?\nA. As a metaphor describing the dual nature of God's justice and God's mercy.\nB. As an invisible Yahweh in heaven and a physical Yahweh who appeared visibly as a man on Earth.\nC. As an early Hebrew misunderstanding that was later corrected by the New Testament writers.\nD. As a reference to the distinction between Yahweh the Creator and the Angel of Death.\nANSWER: B\nEXPLANATION: The lesson describes a Yahweh in heaven and another Yahweh manifesting visibly on earth.\nREF: JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [08:24]–[10:30] (approximate range)\n\nQ20. According to Hebrews 2:10–14, what does it mean that Christ is the Archegos (Captain/Fountainhead) of our salvation?\nA. He sits safely in heaven sharing instructions on how we should live.\nB. He paved the way through death and legally brought us into adoption as His brethren.\nC. He replaced angels as the chief military officer over physical earth wars.\nD. He serves as a legal advocate only for those who observe Levitical priesthood laws.\nANSWER: B\nEXPLANATION: The lesson says Christ entered into suffering and death to bring believers into salvation and adoption as His brethren.\nREF: JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [15:06]–[16:56] (approximate range)\n\nQ21. Why is the fulfillment of Psalm 22:16 (\"They pierced my hands and my feet\") powerful proof of divine prophecy?\nA. Because King David studied ancient execution methods used by foreign nations.\nB. Because when David wrote that prophecy, the execution method known as crucifixion did not even exist yet.\nC. Because Jesus gave the Roman soldiers written instructions on how to fulfill the prophecy.\nD. Because it is the only verse in the Old Testament that describes physical pain.\nANSWER: B\nEXPLANATION: The lesson says Psalm 22 described pierced hands and feet centuries before crucifixion existed.\nREF: JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [08:42]–[09:39] (approximate range)\n\nQ22. According to 1 John 4:2–3, what is the ultimate litmus test for discerning whether a spiritual teacher is of God?\nA. Their ability to work undeniable physical miracles.\nB. Their confession affirming Jesus Christ both in His full humanity and deity.\nC. Their public commitment to living an ascetic lifestyle free from worldly riches.\nD. Their alignment with historical church hierarchies and ordained leadership.\nANSWER: B\nEXPLANATION: The lesson presents confession of Christ’s coming in the flesh as a test and emphasizes His humanity as well as His deity.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [06:41]–[08:57] (approximate range)\n\nQ23. What is the theological significance of distinguishing between \"a child is born\" and \"a son is given\" in Isaiah 9:6?\nA. \"Child is born\" refers to His earthly ministry; \"Son is given\" refers to after resurrection.\nB. \"Child is born\" points to the beginning of His humanity, while \"Son is given\" reveals His pre-existent Sonship.\nC. \"Child is born\" applies to Israel's national birth; \"Son is given\" refers to the spiritual adoption of believers.\nD. \"Child is born\" signifies His flesh; \"Son is given\" signifies the Holy Spirit coming upon Him at baptism.\nANSWER: B\nEXPLANATION: The lessons contrast the beginning of Jesus’ humanity with His eternal Sonship.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [16:58]–[18:00] and JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [15:28]–[16:34] (approximate ranges)\n\nQ24. What forms the true foundation of a Christian’s bold confidence before the throne of grace?\nA. God looking at us through the lens of who we are in Christ and what Christ has legally accomplished for us.\nB. The believer’s personal record of flawless obedience and religious commitment.\nC. The emotional feelings of warmth experienced during church services.\nD. The public praise given to a believer by spiritual leaders.\nANSWER: A\nEXPLANATION: The lesson grounds confidence before the throne of grace in being reckoned in Christ and in what Christ has done.\nREF: JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [18:50]–[19:59] (approximate range)\n\nQ25. Why do all human beings inherit a fallen nature because of Adam's sin?\nA. Every human being signed a spiritual contract in heaven agreeing to Adam's choice.\nB. Inheritance of sin is governed by demonic assignments rather than covenant representation.\nC. Death was introduced as an penalty rather than a structural legal reality.\nD. Adam was God's covenant representative for all humanity.\nANSWER: D\nEXPLANATION: The lesson says Adam represented humanity and that his sin affected those who came after him.\nREF: JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [11:57]–[12:52] (approximate range)\n\nQ26. Based on Genesis 5:2, what vital detail is revealed about the word \"Adam\"?\nA. \"Adam\" is not merely one man's proper name, but the Hebrew word for mankind.\nB. \"Adam\" was a royal title given exclusively to Abraham’s spiritual lineage.\nC. \"Adam\" translates directly to \"sinful flesh\" in ancient Egyptian texts.\nD. The name \"Adam\" was invented by Moses.\nANSWER: A\nEXPLANATION: The lesson says ‘Adam’ refers to mankind, not only to one individual.\nREF: JESUS- SON OF MAN III – Celebration Church International - LMS.mp4 — [10:52]–[12:52] (approximate range)\n\nQ27. What vital lesson does the pastor draw from the historic confrontation between Athanasius and Arius at Nicaea?\nA. Theological disagreements are personal power struggles that fractured early church unity.\nB. The defense of precise biblical doctrine by individuals preserved the true understanding of Christ's Deity for future generations.\nC. Church doctrine are more authoritative than Scripture when settling arguments about the Trinity.\nD. Early church fathers relied on alliances rather than Scripture to establish doctrine.\nANSWER: B\nEXPLANATION: The lesson credits Athanasius’s defense of Christ’s deity with helping preserve a clear understanding of Scripture.\nREF: JESUS- SON OF MAN II – Celebration Church International - LMS.mp4 — [04:47]–[06:41] (approximate range)\n\nQ28. Why is Jesus called both a \"Child [that] is born\" and \"The Everlasting Father\" within the single prophecy of Isaiah 9:6?\nA. Because Jesus transforms into God the Father whenever He ascends into the heavenly sanctuary.\nB. Because while His humanity had an origin in time, His divine identity as God is eternal, without beginning or end.\nC. Because Isaiah was combining two separate prophecies written by different authors into one text.\nD. Because \"Everlasting Father\" was a title.\nANSWER: B\nEXPLANATION: The lessons contrast the beginning of Jesus’ humanity with His eternal divine identity.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [16:58]–[18:00] and JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [15:28]–[16:34] (approximate ranges)\n\nQ29. What combination of actions directed toward Jesus under the \"H\" in the HANDS acronym proves His Deity?\nA. Performing public miracles, receiving tithes, and appointing twelve apostles.\nB. Receiving direct worship, hearing prayers, and having saving faith placed explicitly in Him\nC. Calming the storm, rebuking religious hypocrites, and forgiving executioners on the cross.\nD. Reading human thoughts, fasting forty days, and promising physical thrones to His followers.\nANSWER: B\nEXPLANATION: The lesson cites worship, prayer, and faith placed in Jesus as evidence of His deity.\nREF: JESUS- SON OF MAN I – Celebration Church International - LMS.mp4 — [08:41]–[09:36] (approximate range)\n\nQ30. Using the lesson's practical illustration of a phone call vs. a video call, what defines a \"mediated encounter\" with God in the Old Testament?\nA. Communicating through a distinct physical medium or manifestation, such as a burning bush or pillar of fire.\nB. Reading written prophecies inscribed on stone tablets through an ordained Levitical priest.\nC. Experiencing emotional conviction during high moments of congregational worship and sacrifice.\nD. Seeking guidance through casting physical lots like the Urim and Thummim.\nANSWER: A\nEXPLANATION: The lesson defines a mediated encounter as communication through a medium, with the burning bush and pillar of fire as examples.\nREF: JESUS- SON OF GOD II – Celebration Church International - LMS.mp4 — [05:24]–[07:21] (approximate range)\n\nDECK: Discipleship Experience (Section 5) Christian Conduct\n\nQ1. Why did Paul pray that the believers in Ephesus would receive the spirit of wisdom and revelation in the knowledge of Him?\nA. Because they needed to know what was theirs in Christ in order to take full advantage of those provisions.\nB. Because they had faith in Christ but had not yet received the spiritual blessings available to those who believe.\nC. Because their love unto all the saints showed that they were growing, but they still needed to become faithful in Christ Jesus.\nD. Because revelation knowledge was what would give them the inheritance that had not yet been provided in Christ.\nANSWER: A\nEXPLANATION: The lesson says Paul prayed for their understanding because knowing what was theirs in Christ enabled them to benefit from those provisions.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [02:25]–[03:17] (approximate range)\n\nQ2. What does Jeremiah 31 specifically establish about the new covenant?\nA. It would renew the covenant God made with their fathers while giving them greater ability to obey it.\nB. It would add new instructions to the covenant that was made when God brought their fathers out of Egypt.\nC. It is not according to the covenant God made with their fathers.\nD. It would preserve the old covenant while placing its requirements in their hearts.\nANSWER: C\nEXPLANATION: The lesson emphasizes that Jeremiah describes a new covenant, not one identical to the covenant made with the fathers.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [11:09]–[12:53] (approximate range)\n\nQ3. According to Romans 6:6 as taught, what happened to the old man?\nA. He was gradually weakened as the believer learned more about Christ.\nB. He was crucified with Christ.\nC. He was removed when the believer began to mortify the deeds of the body.\nD. He remains present but no longer has any spiritual relevance.\nANSWER: B\nEXPLANATION: The lesson teaches that the old man was crucified with Christ.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [25:54]–[28:20] (approximate range)\n\nQ4. A believer says, \"This temptation strengthened me, so God sent it for my growth.\" What's your response based on the lesson?\nA. Temptation can produce growth, but only when God directly allows it for that purpose.\nB. God can use what the enemy meant for evil without being the one who tempted the believer.\nC. If temptation produces growth, the source is no longer important.\nD. God may send temptation when He knows the believer is ready to turn it into spiritual growth.\nANSWER: B\nEXPLANATION: The lesson distinguishes God using a temptation for good from God being the one who tempts.\nREF: HOW TO OVERCOME HABITS III – Celebration Church International - LMS.mp4 — [06:06]–[07:47] (approximate range)\n\nQ5. A believer keeps falling in the same environment but says, \"Next time I will try harder.\" What needs attention?\nA. His determination, because repeated failure shows that his desire has not become strong enough.\nB. His structure, because good intention in the same system may keep producing the same outcome.\nC. His spiritual experience, because practical structures cannot replace the work of the Spirit.\nD. His accountability, because another person can change him.\nANSWER: B\nEXPLANATION: The lesson recommends changing the structure or environment rather than relying only on stronger determination.\nREF: HOW TO OVERCOME HABITS IV – Celebration Church International - LMS.mp4 — [01:08]–[04:06] (approximate range)\n\nQ6. Which accountability response conflicts most with Galatians 6:1 as used in the Lesson?\nA. Noticing a pattern the person has become unable to see.\nB. Intervening when the person insists that nothing is wrong.\nC. Helping the person return to the right path with gentleness.\nD. Using the person's shame to make sure he does not repeat the behaviour.\nANSWER: D\nEXPLANATION: The lesson calls for gentle restoration rather than shaming someone as a corrective response.\nREF: HOW TO OVERCOME HABITS II – Celebration Church International - LMS.mp4 — [07:57]–[10:21] (approximate range)\n\nQ7. How did the Lesson explain the relationship between \"you have put off the old man\" and the instruction to \"put off\" the old man?\nA. The two passages refer to two different old men operating at different stages of Christianity.\nB. The old man has been put off as a spiritual provision, and the believer must partner by faith to see it in his life.\nC. The old man is only considered put off after the believer has successfully stopped the deeds associated with him.\nD. The instruction to put off the old man shows that the statement \"you have put off\" is describing a future reality.\nANSWER: B\nEXPLANATION: The lesson distinguishes the provision in Christ from the believer’s practical response of faith.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [06:30]–[10:02] (approximate range)\n\nQ8. What does Romans 7:22–23 demonstrate about the problem under the law?\nA. The person did not delight in the law of God and therefore resisted it.\nB. The law was not spiritual enough to overcome the desires of the flesh.\nC. Another law in his members warred against the law of his mind.\nD. The person understood the law but deliberately chose not to obey it.\nANSWER: C\nEXPLANATION: The lesson explains that an inner mechanism opposed the desire to follow God’s law.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [16:45]–[17:59] (approximate range)\n\nQ9. According to the Lesson, what does Romans 8:14 mean in its immediate context?\nA. Those who are led by the Spirit will become sons of God.\nB. Those who are sons of God are led by the Spirit of God.\nC. Those who want to become sons must first learn to follow the Spirit.\nD. Those who are spiritually mature are led by the Spirit, unlike other Christians.\nANSWER: B\nEXPLANATION: The lesson reads Romans 8:14 as describing the Spirit’s leading as characteristic of God’s sons.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [35:28]–[37:51] (approximate range)\n\nQ10. What does the statement \"I'm kept, so I keep\" communicate?\nA. The believer keeps himself through discipline while the Spirit watches over his progress.\nB. The Spirit keeps the believer, and the believer responds by yielding to the living of the Spirit.\nC. The believer does not need to keep his body because the Spirit has already done everything.\nD. The believer must keep his body before the Spirit can work in him.\nANSWER: B\nEXPLANATION: The lesson describes keeping the body as a partnership: the believer yields to the Spirit and acts accordingly.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [40:09]–[41:11] (approximate range)\n\nQ11. A mature believer says, \"I know my limits, so I can stay around this temptation.\" What does the Lesson challenge?\nA. Self-assessment should not replace God's wisdom; when you can run, you should run.\nB. Spiritual maturity should eventually make deliberate boundaries unnecessary.\nC. The believer should remain in the situation long enough to prove that his discipline is genuine.\nD. Exposure becomes dangerous only when temptation has already become strong.\nANSWER: A\nEXPLANATION: The lesson warns against overconfidence and advises avoiding unnecessary exposure when possible.\nREF: HOW TO OVERCOME HABITS IV – Celebration Church International - LMS.mp4 — [02:01]–[03:09] (approximate range)\n\nQ12. Why does the lesson compare Esau's hunger with Jesus' forty-day fast?\nA. To show that Esau lacked the biblical knowledge needed to recognise the seriousness of his decision.\nB. To show that hunger weakens a person's ability to distinguish right from wrong.\nC. To show that fasting gives a believer greater resistance to temptation than ordinary discipline can provide.\nD. To show that the condition a person is in can affect his vulnerability so you must train for when defenses are down.\nANSWER: D\nEXPLANATION: The comparison highlights that vulnerability can depend on a person’s condition, so preparation matters before defenses are weakened.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [03:47]–[06:12] (approximate range)\n\nQ13. A believer breaks one destructive habit but soon begins depending heavily on another source of comfort. What does the Lesson suggest?\nA. The believer needs stronger discipline because changing the source of pleasure is still a failure of restraint.\nB. The new source has simply replaced the old temptation, showing that the first habit was never truly overcome.\nC. The believer should remove the new source if it is becoming excessive, regardless of whether it is legitimate.\nD. He may have changed the behaviour without addressing where he is looking for satisfaction.\nANSWER: D\nEXPLANATION: The lesson directs the believer to seek lasting satisfaction in God rather than relying on other sources of comfort.\nREF: HOW TO OVERCOME HABITS II – Celebration Church International - LMS.mp4 — [02:02]–[03:47] and [06:09]–[06:59] (approximate ranges)\n\nQ14. Which best illustrates \"wanting good things badly\"?\nA. A legitimate thing becomes excessive because the desire for it moves beyond its proper place.\nB. A legitimate thing becomes dangerous simply because the believer enjoys it regularly.\nC. A believer deliberately avoids a legitimate thing because he fears that enjoyment could become sinful.\nD. A believer exercises restraint with a legitimate thing because he recognises that all pleasure must eventually be denied.\nANSWER: A\nEXPLANATION: The lesson explains that a legitimate good, such as food, can become sinful when pursued excessively.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [06:12]–[07:02] (approximate range)\n\nQ15. What should be the believer's relationship with his mind and body?\nA. His mind and body determine his spiritual identity but should gradually be brought under control.\nB. His mind and body are irrelevant because only his spirit matters.\nC. He is not his mind or his body therefore they are under control and subjected to the will of God.\nD. His body is naturally controlled by the Spirit, while his mind must be controlled through human discipline.\nANSWER: C\nEXPLANATION: The lesson distinguishes the believer from the mind and body, and says they are to be brought under God’s will.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [48:47]–[50:00] and [57:13]–[58:47] (approximate ranges)\n\nQ16. According to the Lesson, what does a believer demonstrate when he walks in victory over sin?\nA. That his personal discipline has become stronger than his previous habits.\nB. That he has attained a higher level of Christianity.\nC. That the resurrection of Jesus Christ has practical relevance in his life.\nD. That his works have become sufficient for his acceptance before God.\nANSWER: C\nEXPLANATION: The lesson connects victory over sin with the practical relevance of Christ’s resurrection.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [34:01]–[35:28] (approximate range)\n\nQ17. Why can the believer \"mortify\" his members according to the Lesson?\nA. Because mortification is what makes him dead to sin.\nB. Because the practical action of mortifying follows the knowledge.\nC. Because mortification causes the old man to become crucified with Christ.\nD. Because the believer's ability to mortify depends on how strongly he feels the desire to resist sin.\nANSWER: B\nEXPLANATION: The lesson says the believer’s practical action follows the spiritual reality of being dead to sin.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [41:11]–[43:21] (approximate range)\n\nQ18. According to 2 Peter 1, why should the believer \"give all diligence\" if God has already given all things that pertain to life and godliness?\nA. Because God's provision becomes effective only after the believer adds his own works to it.\nB. Because the fact that God has already provided it is the very reason the believer can give all diligence.\nC. Because the believer must complete what God began by supplying what was missing from the provision.\nD. Because escaping the corruption in the world is dependent on human effort.\nANSWER: B\nEXPLANATION: The lesson presents God’s provision as the reason believers can diligently live it out, not something their effort must complete.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [45:37]–[47:48] (approximate range)\n\nQ19. Why does the Lesson connect the revelation of grace with Romans 12?\nA. Grace is meant to move the believer from what he has received into a practical response of presenting himself to God.\nB. Grace first establishes doctrine, while presenting yourself to God introduces the separate discipline of Christian living.\nC. Romans 12 shows that practical obedience becomes necessary when grace alone has not produced enough spiritual maturity.\nD. The revelation of grace reduces the need for discipline because a believer who understands grace should naturally become transformed.\nANSWER: A\nEXPLANATION: The lesson links the teaching of grace to the practical response of presenting one’s body to God.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [00:16]–[01:05] (approximate range)\n\nQ20. Why can a recurring temptation become a \"ticket to the next level\"?\nA. Successfully resisting repeated temptation demonstrates readiness for greater ministry responsibility.\nB. Repeated temptation exposes weaknesses that, once removed, automatically produce spiritual promotion.\nC. The presence of recurring temptation shows that God is preparing the believer for greater spiritual authority.\nD. Overcoming it through the Word can strengthen the believer's capacity.\nANSWER: D\nEXPLANATION: The lesson teaches that overcoming temptation through the Word can strengthen the believer and contribute to spiritual growth.\nREF: HOW TO OVERCOME HABITS III – Celebration Church International - LMS.mp4 — [04:31]–[06:54] (approximate range)\n\nQ21. A believer notices that certain movies repeatedly stir desires she later struggles to control. She stops watching them. What is this?\nA. Avoiding temptation because mature believers should eventually be able to handle any environment.\nB. Legalism, unless the content itself is clearly sinful.\nC. A temporary measure that may protect her but does not actually train spiritual discipline.\nD. Controlling exposure and building a structure that supports the outcome she wants.\nANSWER: D\nEXPLANATION: The lesson advises limiting exposure and using structures that support the desired outcome.\nREF: HOW TO OVERCOME HABITS IV – Celebration Church International - LMS.mp4 — [01:08]–[04:06] (approximate range)\n\nQ22. Someone finds it difficult to give money even when he knows he should. From the Lesson, why can practising generosity become part of his training?\nA. The discomfort of letting something go can become an opportunity to practise putting the flesh under.\nB. His unwillingness to give reveals that the root of his other struggles is ultimately a lack of faith.\nC. Giving is more powerful than all other disciplines because financial discipline controls other areas of the flesh.\nD. His money must be brought under control first because attachment to possessions is the major cause of other forms of fleshly behaviour.\nANSWER: A\nEXPLANATION: The lesson presents giving, even when it feels difficult, as a way to practise putting the flesh under.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [10:47]–[11:30] (approximate range)\n\nQ23. Which response best reflects \"zoom out and zoom in\"?\nA. Focus on the wider discipline first, then return to the specific struggle once the broader weakness has been corrected.\nB. Focus on the specific struggle because broader discipline can distract from the actual issue being addressed.\nC. Replace the specific exercise with general spiritual disciplines because the specific behaviour is only a symptom.\nD. Address the specific struggle while examining where the same lack of discipline may be appearing elsewhere.\nANSWER: D\nEXPLANATION: The lesson pairs targeted work on a specific struggle with attention to discipline in other areas.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [08:54]–[12:26] (approximate range)\n\nQ24. A believer prays in tongues, casts out demons, and attends church faithfully, yet repeatedly loses his temper. What does the Lesson tell us about this?\nA. Those activities have not produced genuine spiritual maturity because anger is still there\nB. He may be exercising spiritually without deliberately training the particular area where he is weak.\nC. He needs to replace those activities with anger-focused exercises because general disciplines cannot address specific struggles.\nD. His anger shows that his spiritual activities have become disconnected from the practical demands of Christian living.\nANSWER: B\nEXPLANATION: The lesson says general spiritual activity may not address a specific area that needs targeted training.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [01:05]–[02:54] (approximate range)\n\nQ25. A believer is targeting a sexual habit and begins practising restraint with food, sleep and social media. Why can this help based on the Lesson?\nA. These areas create the sexual temptation, so removing them removes the source of the struggle.\nB. These pleasures are forms of fleshly gratification that must be brought under control before sexual discipline can develop.\nC. Restraining the flesh in other areas can train the general capacity needed in the targeted area.\nD. The believer is indirectly addressing the sexual habit because all forms of lack of discipline have the same immediate cause.\nANSWER: C\nEXPLANATION: The lesson presents self-restraint in other areas as general training that can strengthen discipline in a targeted struggle.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [09:42]–[10:47] (approximate range)\n\nQ26. A believer understands grace, defends it well, and listens to Lesson on it regularly, but his response to lusts doesn't change. What is he missing?\nA. A stronger emphasis on spiritual gifts, since grace should first produce spiritual power.\nB. A distinction between grace and holiness, since change comes later with growth.\nC. More revelation, because practical obedience cannot be expected until the doctrine is fully understood.\nD. The practical response grace is meant to produce which is denying ungodliness.\nANSWER: D\nEXPLANATION: The lesson says the revelation of grace is meant to lead to a practical response, including denying ungodliness and worldly lusts.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [00:16]–[01:05] (approximate range)\n\nQ27. According to the Lesson, what does the grace message include beyond the fact that sins are forgiven and not imputed?\nA. That believers no longer need to be concerned about their conduct because grace covers every failure.\nB. That the old man has been dealt with and believers are learning to walk consistently with the provision of Christ.\nC. That believers should focus primarily on avoiding condemnation when they fall.\nD. That practical holiness should be separated from the message of grace so that grace remains the focus.\nANSWER: B\nEXPLANATION: The lesson includes both the old man being dealt with and learning to live consistently with Christ’s provision in its account of grace.\nREF: THAT OLD MAN – Celebration Church International - LMS.mp4 — [53:22]–[55:07] (approximate range)\n\nQ28. Two believers pray, fast and study the Word. One struggles with anger; the other with pornography. What does the gym analogy require them to recognise?\nA. The same spiritual exercises should eventually produce the same results, provided they are practised consistently.\nB. Different struggles mainly require different levels of revelation.\nC. Exercising spiritually does not mean the particular area that needs strengthening is being exercised.\nD. Their common disciplines are insufficient because targeted struggles should be addressed separately from normal Christian disciplines.\nANSWER: C\nEXPLANATION: The lesson says general spiritual activity does not necessarily train the particular area where someone is struggling.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [01:05]–[02:54] (approximate range)\n\nQ29. From the Lesson, why practise discipline in areas where you are not currently struggling?\nA. Because learning to say \"no\" in ordinary areas can strengthen the capacity to say \"no\" when a greater temptation comes.\nB. Because every area without strict control eventually becomes a spiritual weakness.\nC. Because discipline in smaller matters gives a believer authority over stronger temptations.\nD. Because the more disciplined a believer becomes generally, the less likely he is to experience serious temptation.\nANSWER: A\nEXPLANATION: The lesson presents restraint in ordinary areas as training for situations when a person is more vulnerable.\nREF: HOW TO OVERCOME HABITS I – Celebration Church International - LMS.mp4 — [06:12]–[07:58] (approximate range)\n\nQ30. What best describes the accountability relationship taught in the Lesson?\nA. Someone close enough to confront the believer, even if the confrontation creates shame that motivates change.\nB. Someone with the same struggle who can therefore understand the believer's experience without needing to challenge him strongly.\nC. Someone able to recognise when the believer is in trouble and respond firmly, respectfully and gently.\nD. Someone who checks the believer's behaviour closely enough to prevent him from making another mistake.\nANSWER: C\nEXPLANATION: The lesson recommends someone who can recognize trouble and provide respectful, gentle accountability.\nREF: HOW TO OVERCOME HABITS II – Celebration Church International - LMS.mp4 — [08:46]–[10:21] (approximate range)\n\nDECK: Discipleship Experience (Section 6) Prayer\n\nQ1. Which statement best captures the lesson's treatment of prayer's cumulative effect?\nA. Prayer produces gradual spiritual strengthening through consistent investment.\nB. Prayer becomes effective mainly through longer individual sessions.\nC. Prayer becomes most important when serious spiritual problems arise.\nD. Prayer accumulates mainly through increasing the number of requests made.\nANSWER: A\nEXPLANATION: The lesson describes prayer as a repeated spiritual investment that builds over time.\nREF: SCHOOL OF PRAYER X – Celebration Church International - LMS.mp4 — [04:25]–[07:21] (approximate range)\n\nQ2. Why does the lesson warn against making \"God, help me\" the entirety of one's prayer life?\nA. Prayer should go beyond emergency requests while still making room for short prayers.\nB. Short prayers lack effectiveness without extended declarations.\nC. God requires every prayer to contain a detailed account of the situation.\nD. Short prayers are appropriate mainly when engaging in spiritual warfare.\nANSWER: A\nEXPLANATION: The lesson accepts the value of short prayers but cautions against relying on them as one’s entire prayer life.\nREF: SCHOOL OF PRAYER VIII – Celebration Church International - LMS.mp4 — [05:24]–[06:19] (approximate range)\n\nQ3. According to the teaching, \"not praying\" is dangerous primarily because it:\nA. prevents God from knowing what the believer needs.\nB. gradually weakens the believer's capacity to withstand pressure.\nC. limits the believer's ability to receive immediate answers.\nD. causes the believer to lose salvation through inconsistent devotion.\nANSWER: B\nEXPLANATION: The lesson warns that neglecting prayer gradually leaves the believer more vulnerable and less able to withstand pressure.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [00:16]–[05:19] (approximate range)\n\nQ4. What principle is captured by \"If you cannot fly, run; if you cannot run, walk; if you cannot walk, crawl\"?\nA. Believers should change their spiritual routine whenever life becomes difficult.\nB. Spiritual consistency is less important than doing something occasionally.\nC. The way you engage may change, but you should keep moving toward God.\nD. Difficult seasons mean believers should expect less from themselves.\nANSWER: C\nEXPLANATION: The lesson encourages continuing in prayer, even when you need to adapt the amount or manner of engagement.\nREF: SCHOOL OF PRAYER VIII – Celebration Church International - LMS.mp4 — [07:05]–[07:47] (approximate range)\n\nQ5. A believer prays for an hour, feels nothing, and concludes the prayer was ineffective. What has the lesson identified as the primary error?\nA. Measuring spiritual progress by how strongly you feel.\nB. Spending too much time in prayer.\nC. Assuming prayer must always be emotional.\nD. Thinking prayer only works when it produces an immediate result.\nANSWER: A\nEXPLANATION: The lesson teaches that prayer’s value should not be judged by whether the believer feels a strong response.\nREF: SCHOOL OF PRAYER IV – Celebration Church International - LMS.mp4 — [00:16]–[03:47] (approximate range)\n\nQ6. What does \"we walk by faith and not by sight\" require in the context of the lesson?\nA. Trusting spiritual feelings more than what Scripture says.\nB. Refusing to look at any evidence of spiritual growth.\nC. Choosing faith-filled experiences over regular prayer.\nD. Trusting spiritual realities even when you cannot see or feel them.\nANSWER: D\nEXPLANATION: The lesson says to trust what God’s Word says about spiritual realities, even when they aren’t visible or felt.\nREF: SCHOOL OF PRAYER IV – Celebration Church International - LMS.mp4 — [01:06]–[03:47] (approximate range)\n\nQ7. What is the lesson's function of Hebrews 11:6 in relation to prayer?\nA. It teaches that prayer should always produce a noticeable response.\nB. It moves the believer's confidence away from feelings and toward God.\nC. It teaches that praying longer will make you feel closer to God.\nD. It shows that long prayer is the main requirement for answered prayer.\nANSWER: B\nEXPLANATION: Hebrews 11:6 directs confidence toward God and His promise, not the felt experience of prayer.\nREF: SCHOOL OF PRAYER IV – Celebration Church International - LMS.mp4 — [05:33]–[06:39] (approximate range)\n\nQ8. Which assumption does the statement \"Prayer will never be a waste of time\" directly confront?\nA. Prayer must always be long to be valuable.\nB. Prayer is only useful when combined with fasting.\nC. If nothing happens immediately, the prayer achieved nothing.\nD. Prayer does not work when you do not feel strongly about it.\nANSWER: C\nEXPLANATION: The lesson rejects the idea that prayer was wasted just because its effect is not immediately apparent.\nREF: SCHOOL OF PRAYER IV – Celebration Church International - LMS.mp4 — [04:34]–[05:33] (approximate range)\n\nQ9. Why does Apostle say \"pray like you're close to God\"?\nA. How close you see yourself to God should shape how you approach Him.\nB. Feeling far from God always means you have not prayed enough.\nC. People become close to God only after spending many hours in prayer.\nD. God answers people differently based on how close they feel to Him.\nANSWER: A\nEXPLANATION: The lesson says to approach God with the confidence that He loves and cares for you.\nREF: SCHOOL OF PRAYER IV – Celebration Church International - LMS.mp4 — [09:22]–[11:24] (approximate range)\n\nQ10. The lesson uses Jesus' statement \"Father, I thank you that you always hear me\" primarily to cultivate:\nA. confidence that every prayer will be answered immediately.\nB. confidence that every request made in faith will be granted.\nC. confidence in the believer's ability to pray correctly.\nD. confidence that God hears even when the prayer experience does not feel special.\nANSWER: D\nEXPLANATION: The lesson encourages confidence that God hears, regardless of how a prayer session feels.\nREF: SCHOOL OF PRAYER IV – Celebration Church International - LMS.mp4 — [06:39]–[10:18] (approximate range)\n\nQ11. Why does Philippians 2:13 become particularly encouraging to the believer who knows they should be doing better?\nA. Wanting to improve guarantees that behaviour will change immediately.\nB. Wanting to improve means the believer has already overcome the problem.\nC. The desire to improve is itself a sign that God is working in them.\nD. God takes full responsibility for keeping the believer's prayer life strong.\nANSWER: C\nEXPLANATION: The lesson presents the desire to improve as evidence that God is working in the believer.\nREF: SCHOOL OF PRAYER V – Celebration Church International - LMS.mp4 — [03:07]–[03:55] (approximate range)\n\nQ12. Which response best represents the full posture the lesson teaches toward struggling with prayer?\nA. Recognise the struggle → accept it → wait until you feel stronger → start again.\nB. Recognise the struggle → work harder → remove the weakness → maintain the standard.\nC. Recognise the struggle → ask for forgiveness → lower the standard → rebuild slowly.\nD. Recognise the struggle → reject condemnation → receive God's help → keep going and grow.\nANSWER: D\nEXPLANATION: The lesson encourages seeking God’s help rather than giving in to despair, then continuing to practise prayer.\nREF: SCHOOL OF PRAYER V – Celebration Church International - LMS.mp4 — [03:07]–[04:50] and [06:43]–[09:36] (approximate ranges)\n\nQ13. According to the lesson, what is the primary weakness of a prayer life centered almost entirely on requests?\nA. Requests are less likely to be answered when they are repeated.\nB. Request-based prayer usually makes prayer sessions shorter.\nC. The believer may miss prayer as a way of growing close to God.\nD. God expects believers to spend more time worshipping than asking.\nANSWER: C\nEXPLANATION: The lesson says prayer is also for building intimacy with God, not only making requests.\nREF: SCHOOL OF PRAYER VII – Celebration Church International - LMS.mp4 — [06:28]–[07:53] (approximate range)\n\nQ14. A believer prays the same request repeatedly because they believe \"more words will eventually make God respond.\" Which principle from the lesson corrects this?\nA. Persistence is not needed when someone has strong faith.\nB. Prayer length should never be confused with a formula for making God respond.\nC. God only responds when prayer is focused on intimacy.\nD. Prayer length has no value at all.\nANSWER: B\nEXPLANATION: The lesson rejects treating more words or a particular prayer length as a mechanical way to make God respond.\nREF: SCHOOL OF PRAYER VIII – Celebration Church International - LMS.mp4 — [02:48]–[05:24] (approximate range)\n\nQ15. According to the lesson, what is the believer's confidence concerning prayer?\nA. God hears because the believer has enough spiritual authority.\nB. God answers more after a believer has prayed for a long time.\nC. God responds more quickly when prayer is persistent enough.\nD. God hears those who ask in His name\nANSWER: D\nEXPLANATION: The lesson grounds the believer’s confidence in God hearing those who ask in Jesus’ name.\nREF: SCHOOL OF PRAYER I – Celebration Church International - LMS.mp4 — [09:53]–[10:36] (approximate range)\n\nQ16. What does Jesus' rebuke, \"Couldn't you watch with me one hour?\", establish within the lesson?\nA. There are times when not praying enough can leave a believer unprepared for what comes next.\nB. Every believer must pray for at least one hour every day.\nC. Prayer is ineffective if it lasts less than an hour.\nD. Long prayer is the main measure of spiritual readiness.\nANSWER: A\nEXPLANATION: The lesson uses Jesus’ rebuke to show that insufficient prayer can leave a person unprepared in particular moments.\nREF: SCHOOL OF PRAYER VIII – Celebration Church International - LMS.mp4 — [06:19]–[07:05] (approximate range)\n\nQ17. What distinguishes the \"firefighting approach\" from the culture of prayer taught in the lesson?\nA. Firefighting responds when there is a crisis; prayer culture builds strength before the crisis.\nB. Firefighting focuses on warfare while prayer culture focuses on thanksgiving.\nC. Firefighting uses short prayers while prayer culture uses long prayers.\nD. Firefighting is emotional while prayer culture is disciplined.\nANSWER: A\nEXPLANATION: The lesson contrasts waiting for a crisis with prayer that helps maintain spiritual strength beforehand.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [00:16]–[02:09] (approximate range)\n\nQ18. A Christian still prays occasionally but increasingly finds that prayer no longer shapes their spiritual experience. Which principle most directly addresses this?\nA. Pray for longer until the old experience comes back.\nB. Return to consistent engagement with God instead of praying only occasionally.\nC. Focus mainly on spiritual warfare until the problem improves.\nD. Replace personal prayer with group prayer.\nANSWER: B\nEXPLANATION: The lesson says prayer has a cumulative effect and emphasizes consistent daily engagement.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [00:16]–[02:09] and [05:19]–[06:21] (approximate ranges)\n\nQ19. Why does the lesson describe prayer as a \"strategy for preserving faith\"?\nA. Prayer helps keep strong the believer's confidence in what God can do.\nB. Prayer guarantees that believers will never doubt.\nC. Prayer gives believers power to remove every difficult circumstance.\nD. Prayer continually reminds believers of every doctrine they have learned.\nANSWER: A\nEXPLANATION: The lesson directly says prayer strengthens faith and confidence in God’s ability.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [06:21]–[09:08] (approximate range)\n\nQ20. According to the lesson's use of 1 Peter 5:8–9, what constitutes resistance to the devil?\nA. Praying more spiritual warfare prayers.\nB. Finding every possible strategy the enemy might use.\nC. Staying firm and strong in faith.\nD. Continuing to pray until all opposition stops.\nANSWER: C\nEXPLANATION: The lesson identifies steadfastness in faith as the resistance described in 1 Peter 5:8–9.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [09:08]–[10:02] (approximate range)\n\nQ21. What is the point of submitting to \"the boredom of consistency\"?\nA. Repetition automatically produces spiritual power.\nB. Consistency keeps spiritual strength alive even when things no longer feel new.\nC. Spiritual maturity means moving from basic practices to more advanced ones.\nD. Emotional prayer is unreliable, so it should be avoided.\nANSWER: B\nEXPLANATION: The lesson presents consistent prayer as a way to keep spiritual strength and faith from waning.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [05:19]–[07:15] (approximate range)\n\nQ22. What does the lesson identify as a major reason people struggle with long prayer?\nA. They do not know enough prayer terms.\nB. They do not know enough about spiritual warfare.\nC. They mainly think of prayer as asking God for things.\nD. They expect to have an emotional experience every time they pray.\nANSWER: C\nEXPLANATION: The lesson says a request-only view can make extended prayer difficult because it misses prayer’s relational purpose.\nREF: SCHOOL OF PRAYER VII – Celebration Church International - LMS.mp4 — [06:28]–[07:53] (approximate range)\n\nQ23. Which shift best represents the lesson's intended correction?\nA. Moving from short requests to long requests.\nB. Moving from spontaneous prayer to scheduled prayer.\nC. Moving from emotional prayer to highly structured prayer.\nD. Moving from simply getting things from God to growing close to God.\nANSWER: D\nEXPLANATION: The lesson’s correction is to include intimacy with God, not treat prayer only as a means of getting requests answered.\nREF: SCHOOL OF PRAYER VII – Celebration Church International - LMS.mp4 — [06:28]–[07:53] (approximate range)\n\nQ24. In the teaching on Luke 11, persistence in prayer is primarily presented as:\nA. A way to make God respond when He does not want to.\nB. Part of developing the determination needed for a culture of prayer.\nC. Proof that someone has prayed long enough for an answer.\nD. A replacement for faith when an answer is delayed.\nANSWER: B\nEXPLANATION: The lesson presents persistence as part of developing a durable practice of prayer.\nREF: SCHOOL OF PRAYER VII – Celebration Church International - LMS.mp4 — [02:44]–[04:42] (approximate range)\n\nQ25. Which principle best integrates the entire teaching on prayer length, consistency, faith, and intimacy?\nA. A strong prayer life is mainly measured by how long someone prays.\nB. A strong prayer life is mainly shown through powerful spiritual declarations.\nC. A strong prayer life mainly prepares believers to avoid future spiritual crises.\nD. A mature prayer life combines consistency, spontaneous prayer, persistence, and intimacy with God.\nANSWER: D\nEXPLANATION: Across the lessons, prayer includes consistent practice, both long and short or spontaneous prayer, persistence, and intimacy with God.\nREF: SCHOOL OF PRAYER II – Celebration Church International - LMS.mp4 — [06:03]–[07:02]; SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [06:21]–[08:11]; SCHOOL OF PRAYER VII – Celebration Church International - LMS.mp4 — [01:11]–[03:39] and [06:28]–[07:53] (approximate ranges)\n\nQ26. According to the lesson, why is being able to \"conveniently go three days without praying\" treated as a serious warning sign?\nA. It demonstrates that the believer has lost interest in spiritual things.\nB. It proves that the believer has replaced God with other priorities.\nC. It indicates a level of spiritual vulnerability that may not yet be externally visible.\nD. It means the believer has already become spiritually ineffective.\nANSWER: C\nEXPLANATION: The lesson presents going days without prayer as a sign of spiritual vulnerability, even if it is not outwardly apparent.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [01:15]–[04:23] (approximate range)\n\nQ27. Why does Apostle insist on not breaking the prayer streak?\nA. Consistency itself guarantees spiritual protection.\nB. Maintaining daily engagement helps prevent gradual spiritual deterioration.\nC. Missing prayers gives the enemy immediate legal access.\nD. A prayer streak is evidence that a believer has developed spiritual maturity.\nANSWER: B\nEXPLANATION: The lesson links daily prayer with preventing gradual spiritual decline and maintaining spiritual strength.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [00:16]–[01:15] and [05:19]–[06:21] (approximate ranges)\n\nQ28. The lesson's \"alarm\" analogy primarily challenges which assumption?\nA. Spiritual danger matters only after its consequences become visible.\nB. Spiritual problems usually begin with dramatic external attacks.\nC. Prayer becomes valuable only when a specific problem can be identified.\nD. Early discipline matters less than responding correctly after failure.\nANSWER: A\nEXPLANATION: The analogy emphasizes noticing spiritual danger before its consequences become obvious.\nREF: SCHOOL OF PRAYER VI – Celebration Church International - LMS.mp4 — [00:16]–[02:09] (approximate range)\n\nQ29. What does \"pray without ceasing\" mean within the framework taught?\nA. Maintaining continual fellowship with God alongside scheduled prayer times.\nB. Maintaining uninterrupted verbal prayer throughout the entire day.\nC. Replacing scheduled prayer with spontaneous communication throughout the day.\nD. Increasing prayer frequency until other daily responsibilities become secondary.\nANSWER: A\nEXPLANATION: The lesson describes continual prayer as ongoing communication with God alongside scheduled prayer.\nREF: SCHOOL OF PRAYER VII – Celebration Church International - LMS.mp4 — [01:11]–[02:44] (approximate range)\n\nDECK: Discipleship Experience (Section 7) Bible Experience I\n\nQ1. According to Biblical Interpretation, the defining quality God prioritizes in those entrusted to pass on doctrine is:\nA. Charisma\nB. Anointing\nC. Faithfulness\nD. Eloquence\nANSWER: C\nEXPLANATION: The lesson prioritizes faithfulness in preserving doctrine and handing it on.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION III – Celebration Church International - LMS.mp4 — [11:56]–[14:32] (approximate range)\n\nQ2. Final authority of Scripture means that the Word of God has:\nA. The last word on all matters of faith, doctrine and practice\nB. The final word wherever questions of right and wrong arise\nC. Supreme authority over doctrine and the believer's spiritual life\nD. Ultimate authority whenever human reasoning reaches its limits\nANSWER: A\nEXPLANATION: The lesson says Scripture is the ultimate authority in matters of faith, doctrine, and practice.\nREF: HAVING A BIBLICAL WORLDVIEW I – Celebration Church International - LMS.mp4 — [00:16]–[01:26] (approximate range)\n\nQ3. According to the lesson on hermeneutics, the apostles and prophets were given the responsibility of:\nA. Creating new doctrine based on their personal encounters with God\nB. Translating Old Testament prophecy into culturally relevant Christian teaching\nC. Establishing which Old Testament passages should remain authoritative\nD. Receiving revelation and laying the foundation of doctrine\nANSWER: D\nEXPLANATION: The lesson assigns the apostles and prophets the role of receiving revealed truth and laying doctrine’s foundation.\nREF: HERMENEUTICS (PART 1) I – Celebration Church International - LMS.mp4 — [17:59]–[18:51] (approximate range)\n\nQ4. The statement \"Doctrine is not your invention\" primarily means that doctrine:\nA. Is established independently of the individual who encounters it.\nB. Is inherited from the church and therefore should not be questioned.\nC. Is determined by the interpretation of Scripture already accepted by believers.\nD. Is established before an individual studies Scripture and therefore requires no interpretation.\nANSWER: A\nEXPLANATION: The lesson presents doctrine as established independently of an individual’s personal interpretation.\nREF: HAVING A BIBLICAL WORLDVIEW II – Celebration Church International - LMS.mp4 — [00:57]–[02:04] (approximate range)\n\nQ5. A believer who has become established in fundamental doctrine reaches a stage where Bible study should increasingly help them:\nA. Discover increasingly radical interpretations of familiar passages\nB. Move from personal study into teaching ministry\nC. Replace foundational teaching with deeper and more advanced revelations\nD. Appreciate what they have always known rather than constantly searching for what is new\nANSWER: D\nEXPLANATION: Bible study can deepen appreciation of established truth rather than focus on finding something new.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION I – Celebration Church International - LMS.mp4 — [01:12]–[02:59] (approximate range)\n\nQ6. Which of the following is the Greek word for revelation?\nA. Rhema\nB. Logos\nC. Gnosis\nD. Apocalypsis\nANSWER: D\nEXPLANATION: The lesson identifies apocalypsis as the Greek word for revelation.\nREF: HAVING A BIBLICAL WORLDVIEW II – Celebration Church International - LMS.mp4 — [04:41]\n\nQ7. In Having a Biblical Worldview, \"All Scripture is given by inspiration of God\" establishes primarily that:\nA. The human writers were moved by God in the process of writing Scripture.\nB. Scripture communicates God's will through the experiences of its writers.\nC. God is the source of all Scripture.\nD. The content of Scripture ultimately reflects God's intention through human authorship.\nANSWER: C\nEXPLANATION: The lesson explicitly says inspiration establishes God as the source of Scripture.\nREF: HAVING A BIBLICAL WORLDVIEW I – Celebration Church International - LMS.mp4 — [09:00]–[10:11] (approximate range)\n\nQ8. According to the lesson on Having a Biblical Worldview, what should happen when a believer discovers that an ideology they hold is wrong?\nA. The Word should straighten the ideology rather than the believer searching for a church that reinforces it.\nB. The believer should retain the conviction until they receive a clearer personal revelation.\nC. The believer should consider whether the ideology is culturally acceptable before changing it.\nD. The believer should compare the ideology with the prevailing interpretation within their church.\nANSWER: A\nEXPLANATION: The lesson says the Word should correct a believer’s ideology, not merely confirm it.\nREF: HAVING A BIBLICAL WORLDVIEW II – Celebration Church International - LMS.mp4 — [08:44]–[09:26] (approximate range)\n\nQ9. The Greek word musterion in Ephesians 3, is explained in the lesson as referring to:\nA. A truth that can only be understood by spiritually mature believers\nB. A truth deliberately withheld because God had not yet decided to reveal it\nC. A supernatural truth that remains inaccessible through ordinary reading\nD. Something concealed that is now revealed\nANSWER: D\nEXPLANATION: The lesson defines musterion as something concealed that is now revealed.\nREF: HERMENEUTICS (PART 1) I – Celebration Church International - LMS.mp4 — [01:06]\n\nQ10. The Latin expression for faith alone is:\nA. Sola Scriptura\nB. Sola Gratia\nC. Soli Deo Gloria\nD. Sola Fide\nANSWER: D\nEXPLANATION: The lesson gives sola fide as the Latin expression for faith alone.\nREF: HAVING A BIBLICAL WORLDVIEW I – Celebration Church International - LMS.mp4 — [03:38]\n\nQ11. The phrase \"retain it in its originality and hand it over to people who will hand it over to others\" is presented as the practical evidence of:\nA. Faithfulness to an orthodox faith that is not subject to personal invention\nB. Spiritual maturity demonstrated through the ability to reproduce one's interpretation\nC. Apostolic authority demonstrated through successive generations of teachers\nD. Accurate Bible study demonstrated through the ability to explain Scripture creatively\nANSWER: A\nEXPLANATION: The lesson identifies preserving and passing on doctrine without inventing new interpretations as evidence of faithfulness.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION III – Celebration Church International - LMS.mp4 — [11:56]–[14:32] (approximate range)\n\nQ12. The lesson on hermeneutics describes Christ as \"the most important piece in Bible interpretation.\" What does this mean within the specific argument being made?\nA. Every biblical passage must contain the literal name \"Jesus\" before it can be interpreted\nB. Christ provides the interpretive key for understanding the Old Testament's types, shadows and symbols\nC. The New Testament should be studied independently of the Old Testament because Christ replaced its message\nD. Every Old Testament passage should be interpreted exclusively as a direct prediction of Jesus' earthly ministry\nANSWER: B\nEXPLANATION: The lesson presents Christ as the key to understanding the Old Testament’s symbols and types.\nREF: HERMENEUTICS (PART 2) I – Celebration Church International - LMS.mp4 — [13:48]–[16:49] (approximate range)\n\nQ13. In Having a Biblical Worldview, the word \"so\" in John 3:16 is explained as primarily communicating:\nA. The intensity with which God loved the world\nB. The magnitude of God's love for humanity\nC. The depth of God's emotional affection toward the world\nD. The manner in which God demonstrated His love\nANSWER: D\nEXPLANATION: The lesson explains “so” as describing how God showed His love, rather than its intensity.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION II – Celebration Church International - LMS.mp4 — [09:24]\n\nQ14. God's plan for the church, as presented in the lesson on Bible Interpretation, is that believers:\nA. Become sufficiently grounded to recognize sound teaching when they hear it\nB. Come into the unanimity of the faith with accuracy and clarity\nC. Become increasingly dependent on the teaching ministry of their pastor\nD. Develop enough personal revelation to contribute meaningfully when they gather\nANSWER: B\nEXPLANATION: The lesson describes the church’s goal as believers sharing the faith with accuracy and clarity.\nREF: INTRODUCTION TO BIBLICAL INTERPRETATION I – Celebration Church International - LMS.mp4 — [00:16]–[01:12] (approximate range)\n\nQ15. Why does the lesson on Having a Biblical Worldview connect Paul's statement about failing to provide for one's relatives with denying the faith?\nA. Because Christian families have a specific obligation to financially support one another\nB. Because practical care is one of the strongest ways believers demonstrate their righteousness.\nC. Because certain conduct is so inconsistent with professed faith that its absence can contradict the profession itself.\nD. Because failure to care
