ple confirmations of full manifestation\nB. A spiritual note of victory\nC. Learning to see, even if it's in seed form, what God is doing\nD. Treating faith and the anointing as unrelated to one another\nANSWER: C\nEXPLANATION: The partnership between faith and the anointing requires a believer to spiritually perceive and respond to what God is doing, even when it appears only in seed form.\nREF: MANIFESTING THE PRESENCE OF GOD III – Celebration Church International - LMS.mp4 — [09:01] - [09:46]\n\nQ22. The Spirit realm operates like a courtroom which consists of the following except\nA. A Judge\nB. An Accuser\nC. An Attorney\nD. The Devil\nANSWER: D\nEXPLANATION: The spiritual courtroom is comprised of legal roles including a Judge, an Accuser, and a Defense Attorney; \"the devil\" is an entity, not the legal title of the role.\nREF: POWER IN THE BLOOD I – Celebration Church International - LMS.mp4 — [02:26] - [09:03]\n\nQ23. The word \"Satan\" always has an evil personality.\nA. True\nB. False\nC. Partially false\nD. True, but with some caveats\nANSWER: B\nEXPLANATION: The word \"Satan\" means \"accuser\" or \"opposer\" and was even used to describe an angel of the Lord standing in opposition, devoid of an evil personality.\nREF: POWER IN THE BLOOD I – Celebration Church International - LMS.mp4 — [05:43] - [06:36]\n\nQ24. What role does Jesus play in the spirit realm?\nA. Propitiation\nB. Sanctification\nC. Justice\nD. Defense Attorney\nANSWER: D\nEXPLANATION: In the spiritual courtroom, Jesus serves as our advocate and defense attorney.\nREF: POWER IN THE BLOOD I – Celebration Church International - LMS.mp4 — [07:45] - [09:03]\n\nQ25. What was the first recorded death in the bible?\nA. Abel\nB. Adam and Eve, spiritually\nC. A sacrifice\nD. The death of Cain\nANSWER: C\nEXPLANATION: The first physical death recorded in the Bible was not Abel's murder, but God sacrificing an animal to cover Adam and Eve.\nREF: POWER IN THE BLOOD I – Celebration Church International - LMS.mp4 — [10:31] - [13:32]\n\nQ26. What is one fact about spiritual legality that many do not know?\nA. They belong to every believer\nB. They are ratified by the blood\nC. They must be continually defended\nD. They depend on a person's personal merit\nANSWER: C\nEXPLANATION: In the realm of spiritual legality, possessing a right does not automatically guarantee its enforcement; believers must actively stand on and defend their rights.\nREF: POWER IN THE BLOOD II – Celebration Church International - LMS.mp4 — [04:59] - [07:21]\n\nQ27. Leviticus 17:11 best explains which of the following legal principles of the spirit realm?\nA. Substitutionary Atonement\nB. Propitiation\nC. The Principle of Substitution\nD. The principle of creation\nANSWER: C\nEXPLANATION: Leviticus 17:11 establishes that the life of the flesh is in the blood, which forms the legal basis for the principle of substitution.\nREF: POWER IN THE BLOOD III – Celebration Church International - LMS.mp4 — [02:31] - [03:51]\n\nQ28. The following are key terminologies that describe the principles in the Spirit realm\nA. Substitution, Ransom, Redemption\nB. Substitution, Petition, Revelation\nC. Assurance, Ratification, Penitentiary Licence\nD. Prayer, fasting, and worship\nANSWER: A\nEXPLANATION: The key terminologies that govern the legality of the Spirit realm include substitution, ransom, and redemption.\nREF: POWER IN THE BLOOD III – Celebration Church International - LMS.mp4 — [02:31] - [03:51]\n\nQ29. An animal can play your part in a spiritual ritual to the degree that when the animal is offered, it is as if your life is offered. Which principle is this?\nA. Legality\nB. Ransom\nC. Substitution\nD. Consecration\nANSWER: C\nEXPLANATION: The principle of substitution allows an animal's life to legally take the place of a human's life in a spiritual ritual.\nREF: POWER IN THE BLOOD III – Celebration Church International - LMS.mp4 — [02:31] - [03:51]\n\nQ30. Which of the following statements best explain the principle of Ransom?\nA. The price paid to buy back or release someone that was lost or enslaved\nB. The price paid to ratify the release of someone that was held in bondage\nC. The price paid to justify the release of someone that was held in bondage\nD. The price paid to release someone that was held in bondage\nANSWER: D\nEXPLANATION: Ransom legally refers to the precise price paid to secure the release of someone who has been held in bondage.\nREF: POWER IN THE BLOOD III – Celebration Church International - LMS.mp4 — [06:19] - [07:33]\n\nDECK: Discipleship Experience (Section 12) Church History\n\nQ1. Which distinction does the lesson on Baptism make between the Lutheran and Reformed positions?\nA. Lutherans reject infant baptism, while Reformed churches require it for salvation.\nB. Lutherans view baptism as a means of grace, while the Reformed view baptism as a seal of God's covenant.\nC. Both groups teach that baptism is purely symbolic and has no relationship to grace.\nD. Both groups reject infant baptism because personal faith must always precede baptism.\nANSWER: B\nEXPLANATION: The Lutheran Church teaches that baptism is a means of grace, whereas the Reformed position views it as a symbolic sign and seal of God's covenant.\nREF: BAPTISM II – Celebration Church International - LMS.mp4 — [04:52], [06:15] - [07:48]\n\nQ2. What did the Nicene Creed affirm in the controversy described in the lesson on Church History?\nA. That salvation comes through secret knowledge\nB. That Jesus was adopted as God's Son\nC. The divinity of Christ\nD. That the Father, Son and Holy Spirit are three modes of one person\nANSWER: C\n\nQ3. What does Acts 10:2 contribute to the lesson's teaching about sacrifice?\nA. Cornelius' prayers and alms were presented as having come up as a memorial before God.\nB. Cornelius' financial giving was the only reason the angel appeared to him.\nC. Cornelius' sacrifice made him born again before the gospel was preached to him.\nD. Cornelius' alms were presented as more important than his prayer life.\nANSWER: A\nEXPLANATION: Acts 10 reveals that Cornelius' prayers and sacrificial giving (alms) came up together as a memorial before God, attracting angelic visitation.\nREF: HOW TO ATTRACT ANGELS V – Celebration Church International - LMS.mp4 — [05:23] - [06:29]\n\nQ4. What did Pelagius teach that the church rejected?\nA. Humans could live sinless lives without the aid of divine grace.\nB. Salvation could only come through hidden knowledge.\nC. Jesus was not truly human.\nD. God exists in three distinct persons.\nANSWER: A\n\nQ5. Cornelius had not been born again, was not full of the Spirit and most likely had never read a book about angels. What does his example establish?\nA. Knowledge about angels is not necessary for a life of reverence to God.\nB. Angelic encounters only happen to people outside the church.\nC. A person must first understand spiritual realities before God can engage with him.\nD. Being outside the church automatically makes a person more sensitive to angels.\nANSWER: A\nEXPLANATION: Cornelius proves that a person can attract angelic ministry purely through a lifestyle of genuine reverence and the fear of the Lord, without prior theological knowledge of angels.\nREF: HOW TO ATTRACT ANGELS I – Celebration Church International - LMS.mp4 — [13:17] - [14:06]; HOW TO ATTRACT ANGELS II – Celebration Church International - LMS.mp4 — [03:27] - [04:50]\n\nQ6. Which sequence best supports the lesson's argument that Christianity's roots in Africa go back beyond the colonial era?\nA. Portuguese explorers arrived in Africa, missionaries followed them, and African kingdoms adopted Christianity.\nB. Jesus fled to Egypt, Simon of Cyrene carried Jesus' cross, and the Ethiopian eunuch heard the gospel and was baptised.\nC. Constantine legalised Christianity, founded Constantinople, and missionaries later travelled to Africa.\nD. Martin Luther began the Reformation, the Jesuits expanded Catholicism, and missionaries then entered Africa.\nANSWER: B\nEXPLANATION: Biblical accounts of Jesus fleeing to Egypt, Simon of Cyrene carrying the cross, and the Ethiopian eunuch's conversion prove Christianity has deep African roots predating European colonialism.\nREF: EARLY CHURCH II – Celebration Church International - LMS.mp4 — [06:16] - [07:29]\n\nQ7. How does Psalm 104:4 fit into the lesson's explanation of angels?\nA. It teaches that every manifestation of fire is an angel.\nB. It describes angels as spirits and ministers and is connected to the manifestation of fire.\nC. It teaches that angels can only minister through fire.\nD. It shows that angels are symbols rather than actual spiritual beings.\nANSWER: B\nEXPLANATION: Psalm 104:4 establishes that God makes His angels spirits and ministers, which the lesson connects directly to angelic manifestations of fire.\nREF: HOW TO ATTRACT ANGELS IV – Celebration Church International - LMS.mp4 — [01:34] - [02:52]\n\nQ8. What does the lesson identify as the thing that truly points to the salvation of a person?\nA. Completion of a baptismal class\nB. Being baptized by immersion\nC. Believing loyalty\nD. Being recognized by a church leader as a believer\nANSWER: C\nEXPLANATION: True salvation is evidenced not merely by a temporary profession of faith, but by a consistent \"believing loyalty\" that endures.\nREF: BAPTISM IV.mp4 — [06:41] - [08:02]\n\nQ9. What was Arius' main argument concerning Jesus?\nA. Jesus was not divine in the same way as the Father and was not co-eternal.\nB. Jesus was only a human prophet and never existed before His birth.\nC. Jesus was fully divine and co-eternal with the Father.\nD. Jesus became God's Son only after His resurrection.\nANSWER: A\n\nQ10. What did Docetism teach about Jesus?\nA. Jesus was fully human but was adopted as God's Son later in His life.\nB. Jesus was one person appearing in three different modes.\nC. Jesus was divine but was not the same as the Father.\nD. Jesus only appeared to be human, so His body, suffering and death were considered illusions.\nANSWER: D\nEXPLANATION: Docetism is the heretical belief that Jesus only appeared to be human, treating His physical body, suffering, and death as mere illusions.\nREF: EARLY CHURCH I – Celebration Church International - LMS.mp4 — [04:52]\n\nQ11. What connection does Daniel 10:12 establish between prayer and angelic activity in the lesson?\nA. Daniel's prayer was heard, and the angel said he had come because of his words.\nB. Daniel's angel came because Daniel had achieved a high level of spiritual maturity.\nC. Daniel's experience shows that angels respond only to prophetic declarations.\nD. Daniel's experience shows that prayer becomes unnecessary once an angel is assigned to a person.\nANSWER: A\nEXPLANATION: Daniel 10:12 illustrates that angels respond to the prayers of believers, as the angel explicitly stated he came because of Daniel's words.\nREF: HOW TO ATTRACT ANGELS III – Celebration Church International - LMS.mp4 — [12:57] - [14:24]\n\nQ12. Which set of questions does the lesson identify as the major areas of disagreement surrounding water baptism?\nA. Who performs baptism, where it is performed, how often it is performed, and what language is used\nB. The mode of baptism, who should be baptized, the purpose of baptism, and whether baptism is regenerative\nC. Whether baptism should happen before or after communion, who should administer communion, and whether communion saves\nD. Whether baptism should happen publicly, privately, annually, or only after a baptismal class\nANSWER: B\nEXPLANATION: Historically, controversies on water baptism center around its mode, the proper subjects for it, its purpose, and whether it has a regenerative nature.\nREF: BAPTISM I – Celebration Church International - LMS.mp4 — [01:35] - [02:50]\n\nQ13. What role did figures such as Ignatius of Antioch and Irenaeus play?\nA. They introduced Christianity to the Roman Empire for the first time.\nB. They replaced the apostles as the founders of the Christian faith.\nC. They defended Christian doctrine and affirmed the authority of the apostles.\nD. They led the Protestant Reformation against the Catholic Church.\nANSWER: C\nEXPLANATION: During the second century, early church figures like Ignatius and Irenaeus wrote to defend orthodox Christian doctrine and uphold apostolic authority.\nREF: EARLY CHURCH I – Celebration Church International - LMS.mp4 — [03:46]\n\nQ14. Why does the lesson describe Abraham's encounter as an \"honor test\"?\nA. Abraham already knew exactly who the visitors were before he welcomed them.\nB. Abraham had to respond honorably to what appeared to be an ordinary situation.\nC. Abraham was required to perform a special act of worship before the visitors could speak to him.\nD. Abraham's encounter depended on him recognising the visitors as angels immediately.\nANSWER: B\nEXPLANATION: Abraham's encounter functioned as an honor test because the divine visitors appeared as ordinary passersby, requiring Abraham to proactively demonstrate honorable hospitality.\nREF: HOW TO ATTRACT ANGELS II – Celebration Church International - LMS.mp4 — [08:44] - [09:47]\n\nQ15. Why did the early church have to define its beliefs more clearly as Christianity grew?\nA. The Roman Empire required every Christian church to use the same form of worship.\nB. Growing heresies and false teachings threatened the unity of the faith.\nC. The apostles had stopped teaching Christians about Jesus.\nD. Christianity had already become the official religion of the Roman Empire.\nANSWER: B\nEXPLANATION: The early church was compelled to solidify its doctrinal beliefs to combat emerging heresies and false teachings that jeopardized their unity.\nREF: EARLY CHURCH I – Celebration Church International - LMS.mp4 — [03:46]\n\nQ16. What is the significance of Colossians 2:12 within the lesson's discussion of baptism?\nA. It connects baptism with being buried and raised with Christ through faith.\nB. It teaches that water itself removes sin from the believer.\nC. It establishes infant baptism as a requirement of the New Covenant.\nD. It teaches that baptism is the means by which a person first receives faith.\nANSWER: A\nEXPLANATION: Colossians 2:12 is used to show that baptism is a spiritual operation depicting the believer being buried and raised to new life with Christ through faith.\nREF: BAPTISM III – Celebration Church International - LMS.mp4 — [11:44] - [12:05]\n\nQ17. Why was the Council of Nicaea convened?\nA. To decide whether Christianity should spread into Africa\nB. To settle the controversy over the divinity of Christ\nC. To establish Constantinople as the new capital of the Roman Empire\nD. To begin the Protestant Reformation\nANSWER: B\n\nQ18. According to Psalm 103:20 as it is used in the lesson, what are angels said to respond to?\nA. The strength of a believer's emotions\nB. The voice of God's Word\nC. Whatever a believer desires fervently\nD. The number of times a believer attends church\nANSWER: B\nEXPLANATION: Psalm 103:20 reveals that angels excel in strength and execute their ministry by responding to and heeding the voice of God's Word.\nREF: HOW TO ATTRACT ANGELS III – Celebration Church International - LMS.mp4 — [02:29] - [03:26]\n\nQ19. Which combination of passages is used in the lesson to support the description of baptism as immersion?\nA. Matthew 3:16, Acts 8:38-39 and John 3:23\nB. Romans 6:1-4, Ephesians 5:25-26 and Ezekiel 36:25-27\nC. Matthew 28:19, Acts 2:38 and Titus 3:5\nD. Colossians 2:11, John 7:37 and 1 Peter 3:18\nANSWER: A\nEXPLANATION: These three passages are cited to argue for full immersion because they mention coming \"up out of the water,\" going \"down into the water,\" and the requirement for \"much water.\"\nREF: BAPTISM I – Celebration Church International - LMS.mp4 — [06:16] - [07:24]\n\nQ20. What did Sabellianism teach about the Father, Son and Holy Spirit?\nA. They are three different gods working together.\nB. They are three distinct persons who are equal and eternal.\nC. They are three modes of the same God.\nD. The Son and Spirit are created beings who serve the Father.\nANSWER: C\n\nQ21. Which of the following correctly identifies the four keys to engaging the angelic dimension?\nA. Faith, fasting, prophecy and sacrifice\nB. Reverence, honor, fasting and prayer\nC. Prayer, prophecy, sacrifice and worship\nD. Reverence, the Word, prayer and sacrifice\nANSWER: D\nEXPLANATION: The four keys to attracting and engaging angelic ministry outlined in the teaching are reverence, the Word of God, prayer, and sacrifice.\nREF: HOW TO ATTRACT ANGELS I – Celebration Church International - LMS.mp4 — [12:12]; HOW TO ATTRACT ANGELS III – Celebration Church International - LMS.mp4 — [01:27], [12:57]; HOW TO ATTRACT ANGELS V – Celebration Church International - LMS.mp4 — [05:23] - [06:29]\n\nQ22. What did the Edict of Milan accomplish according to the lesson?\nA. It legalised Christianity and ended decades of persecution.\nB. It made Christianity the only religion in the Roman Empire.\nC. It divided Christianity into Eastern and Western churches.\nD. It established the Nicene Creed as the official Roman constitution.\nANSWER: A\nEXPLANATION: The Edict of Milan in 313 AD officially legalized Christianity and brought an end to decades of state-sponsored persecution.\nREF: EARLY CHURCH I – Celebration Church International - LMS.mp4 — [04:52]\n\nQ23. What sequence of events does the lesson give concerning Constantine?\nA. He legalised Christianity, then saw a cross, then became a Christian.\nB. He founded Constantinople, then legalised Christianity, then fought his pivotal battle.\nC. He saw a cross before a pivotal battle, won the battle, embraced Christianity, and later issued the Edict of Milan.\nD. He became a bishop, convened the Council of Nicaea, and then founded Constantinople.\nANSWER: C\nEXPLANATION: Constantine first saw a cross before a major battle, emerged victorious, embraced the Christian faith, and subsequently issued the Edict of Milan.\nREF: EARLY CHURCH I – Celebration Church International - LMS.mp4 — [03:46] - [04:52]\n\nQ24. What is the significance of the Greek word baptizo?\nA. It is presented as meaning sprinkling, which supports the practice of pouring.\nB. It is presented as meaning to immerse or submerge, which supports immersion.\nC. It is presented as meaning to cleanse spiritually, which proves baptism regenerates.\nD. It is presented as meaning to dedicate an infant to God.\nANSWER: B\nEXPLANATION: The original Greek word \"baptizo\" explicitly means to immerse, dip, or submerge, linguistically supporting the practice of full-body immersion.\nREF: BAPTISM I – Celebration Church International - LMS.mp4 — [04:05]\n\nQ25. What did Gnosticism teach about salvation?\nA. Salvation comes through faith in the death and resurrection of Christ.\nB. Salvation comes through keeping the traditions of the apostles.\nC. Salvation comes through secret knowledge that frees the divine spark within a person.\nD. Salvation comes through human effort without divine grace.\nANSWER: C\n\nQ26. According to the lesson, what are the two meanings given for the word \"seraph\"?\nA. Messenger and minister\nB. Burning one and serpent\nC. Spirit and flame\nD. Guardian and throne\nANSWER: B\nEXPLANATION: The teaching explains that the word \"seraph\" has a dual meaning: \"burning ones\" who protect God's presence, and \"serpents,\" as seen in fiery serpents used for judgment.\nREF: HOW TO ATTRACT ANGELS IV – Celebration Church International - LMS.mp4 — [05:26] - [07:14], [13:14] - [14:47]\n\nQ27. What practice particularly provoked Martin Luther's objections to the Catholic Church in 1517?\nA. The sale of indulgences\nB. The use of monasteries\nC. The appointment of bishops\nD. The translation of Scripture\nANSWER: A\nEXPLANATION: Martin Luther's primary objection in his 95 theses was directed against the corrupt practice of selling in   views.quiz = function () {

  function head(t, right) { return '<header class="top"><button class="btn sm ghost" data-act="home">‹ Exit</button><h1>' + t + '</h1><span class="meta">' + right + '</span></header>'; }

  function formatClock(milliseconds) { var seconds = Math.max(0, Math.ceil(milliseconds / 1000)); return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0'); }

  /* ---------- render ---------- */
  function render(keep) { var view = V.name === 'exam' ? views.quiz : views[V.name]; app.innerHTML = banner() + view(); if (!keep) window.scrollTo(0, 0); if (V.name === 'flash') { var f = app.querySelector('.flip'); if (f) f.focus({ preventScroll: true }); } else if (V.name === 'quiz' || V.name === 'exam') { var q = app.querySelector('.qtext'); if (q) q.focus({ preventScroll: true }); } }

  function start() {

    s.ids.forEach(function (id) { var d = deck(id); if (d) d.cards.forEach(function (c) { cards.push({ deckId: id, card: c }); }); });
    var exam = s.mode === 'exam';
    var o = exam
      ? { unk: false, limit: +document.getElementById('exam-count').value, shuf: true, duration: Math.max(1, Math.min(180, +document.getElementById('exam-minutes').value || 30)) * 60 * 1000, saveBest: false }
      : { unk: document.getElementById('s-unk').checked, limit: s.mode === 'quiz' ? +document.getElementById('s-len').value : 0, shuf: s.mode === 'quiz' ? true : document.getElementById('s-shuf').checked };
    if (s.mode === 'flash') { S.settings.shuffle = o.shuf; save(); }
    var selectedCount = cards.length;
    if (o.unk) cards = cards.filter(function (x) { return !isMastered(x.deckId, x.card.id); });
    if (exam) cards = StudyLogic.examQuestions(cards, o.limit);
    if (!cards.length) { toast(selectedCount ? 'All selected cards are already marked known.' : 'There are no cards in this selection yet.'); return; }
    closeModal(); begin(s.mode, exam ? cards : (o.shuf ? shuffle(cards) : cards), o, s.ids);
  }
  function startDue() {
    var cards = StudyLogic.dueItems(allCardItems(), Date.now());
    if (!cards.length) { toast('No cards are due today.'); return; }
    begin('flash', shuffle(cards), { unk: false, limit: 0, shuf: true }, deckIdsFor(cards));
  }
  function startWeakSpots() {
    var cards = StudyLogic.weakSpots(allCardItems(), 10);
    if (!cards.length) { toast('Answer some questions first to build weak-spot stats.'); return; }
    begin('quiz', shuffle(cards), { unk: false, limit: 0, shuf: true, saveBest: false }, deckIdsFor(cards));
  }
  function begin(mode, cards, o, ids) {
    if (mode === 'quiz' || mode === 'exam') {
      cards = cards.map(function (it) { return { deckId: it.deckId, card: it.card, optionOrder: shuffle([0, 1, 2, 3]) }; });
      if (mode === 'quiz' && o.limit && o.limit < cards.length) cards = cards.slice(0, o.limit);
    }
    var session = { name: mode, cards: cards, i: 0, flipped: false, picked: null, score: 0, answers: [], marks: {}, opts: o, ids: ids };
    if (mode === 'exam') session.remaining = o.duration;
    go(session);
    if (mode === 'exam') startExamTimer();
  }
  function stopExamTimer() { if (examTimer !== null) { clearInterval(examTimer); examTimer = null; } }
  function startExamTimer() {
    stopExamTimer();
    V.deadline = Date.now() + V.opts.duration;
    V.remaining = V.opts.duration;
    examTimer = setInterval(function () {
      if (V.name !== 'exam') return stopExamTimer();
      V.remaining = Math.max(0, V.deadline - Date.now());
      var clock = document.getElementById('exam-clock');
      if (clock) { clock.textContent = formatClock(V.remaining); clock.setAttribute('aria-label', 'Time remaining ' + formatClock(V.remaining)); }
      if (!V.remaining) finishExam(true);
    }, 1000);
  }
  function mark(it, value) {
    var p = prog(it.deckId);
    p.cards[it.card.id] = StudyLogic.review(p.cards[it.card.id], value === 'known', Date.now());
    trackStudied(1);
    save();
  }

  function finishFlash() {
    var learn = V.cards.filter(function (x) { return V.marks[x.card.id] === 'unknown'; }), known = V.cards.filter(function (x) { return V.marks[x.card.id] === 'known'; }).length;
    go({ name: 'results', kind: 'flash', known: known, learning: learn, skipped: V.cards.length - known - learn.length, all: V.cards, opts: V.opts, ids: V.ids });
  }
  function finishQuiz() {
    var per = {}, missed = [];
    V.answers.forEach(function (a) { var p = per[a.item.deckId] || (per[a.item.deckId] = { s: 0, t: 0 }); p.t++; if (a.ok) p.s++; else missed.push(a.item); });
    var newBest = false;
    Object.keys(per).forEach(function (id) {
      var d = deck(id), p = per[id]; if (!d || V.opts.saveBest === false || p.t < Math.min(10, d.cards.length)) return;
      var pct = Math.round(100 * p.s / p.t), pr = prog(id);
      if (!pr.best || pct > pr.best.pct) { pr.best = { pct: pct, score: p.s, total: p.t, date: Date.now() }; newBest = true; }
    });
    save();
    go({ name: 'results', kind: 'quiz', score: V.score, total: V.answers.length, missed: missed, newBest: newBest, all: V.cards, opts: V.opts, ids: V.ids });
  }
  function finishExam(expired) {
    if (V.name !== 'exam') return;
    stopExamTimer();
    var answers = {};
    V.answers.forEach(function (answer) { answers[answer.item.deckId + '|' + answer.item.card.id] = answer; });
    var review = V.cards.map(function (item) {
      var answer = answers[item.deckId + '|' + item.card.id];
      if (!answer) {
        var p = prog(item.deckId);
        p.cards[item.card.id] = StudyLogic.review(p.cards[item.card.id], false, Date.now());
        trackStudied(1);
      }
      return { item: item, selected: answer ? answer.selected : null, ok: !!(answer && answer.ok) };
    });
    save();
    go({ name: 'results', kind: 'exam', score: V.score, total: V.cards.length, answered: V.answers.length, expired: !!expired, review: review });
  }

  /* ---------- import ---------- */
  function readFiles(files) {
    var list = Array.from(files); IMP = { decks: [], errors: [], warnings: [], text: IMP.text, parsed: true, backup: null };
    if (list.some(function (f) { return /\.json$/i.test(f.name); })) {
      if (list.length !== 1) { IMP.errors.push({ message: 'Restore one JSON backup at a time.' }); render(true); return; }
      list[0].text().then(function (text) { try { IMP.backup = validateBackup(text); } catch (e) { IMP.errors.push({ message: e.message || 'Could not read this backup.' }); } render(true); }, function () { IMP.errors.push({ message: 'Could not read that backup file.' }); render(true); });
      return;
    }
    Promise.all(list.map(function (f) { return f.text().then(function (t) { return { name: f.name, text: t }; }); })).then(function (rs) {
      rs.forEach(function (r) { merge(P.parseDecks(r.text, { fallbackTitle: r.name.replace(/\.[^.]+$/, '') }), rs.length > 1 ? r.name + ': ' : ''); });
      render(true);
    }, function () { toast('Could not read that file.'); });
  }
  function merge(res, pre) {
    IMP.decks = IMP.decks.concat(res.decks);
    res.errors.forEach(function (e) { IMP.errors.push({ message: pre + e.message }); });
    res.warnings.forEach(function (e) { IMP.warnings.push({ message: pre + e.message }); });
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act, d;
    switch (a) {
      case 'home': closeModal(); go({ name: 'home' }); break;
      case 'close': closeModal(); break;
      case 'askok': var fn = pendingAsk; closeModal(); if (fn) fn(); break;
      case 'theme': S.settings.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.settings.theme]; applyTheme(); save(); render(true); break;
      case 'setup': if (t.dataset.id === '*' && !SEL.size) return; setup(t.dataset.mode, t.dataset.id); break;
      case 'due': startDue(); break;
      case 'weak': startWeakSpots(); break;
      case 'exam': setupExam(); break;
      case 'start': start(); break;
      case 'import': IMP = { decks: [], errors: [], warnings: [], text: '', parsed: false, backup: null }; go({ name: 'import' }); break;
      case 'backup': resetBackupReminder(); exportBackup(); render(true); break;
      case 'backup-dismiss': resetBackupReminder(); render(true); break;
      case 'update-app': if (waitingWorker) { reloadForUpdate = true; waitingWorker.postMessage({ type: 'SKIP_WAITING' }); } break;
      case 'iparse': var txt = document.getElementById('paste').value; IMP = { decks: [], errors: [], warnings: [], text: txt, parsed: true, backup: null }; merge(P.parseDecks(txt, { fallbackTitle: 'Pasted deck' }), ''); render(true); break;
      case 'isave':
        var n = 0; IMP.decks.forEach(function (x) { if (x.questions.length) { addParsed(x, false); n++; } }); save(); toast('Saved ' + plural(n, 'deck')); go({ name: 'home' }); break;
      case 'restore': if (IMP.backup) ask('Replace all current decks, progress, and preferences with the selected backup?', 'Restore backup', function () { S = IMP.backup; SEL.clear(); homeFilter = ''; preserveStorage = false; applyDataMigrations(); save(); applyTheme(); IMP = { decks: [], errors: [], warnings: [], text: '', parsed: false, backup: null }; toast('Backup restored.'); go({ name: 'home' }); }); break;
      case 'exportall': download('all-decks.txt', P.serializeDecks(S.decks)); break;
      case 'edit': go({ name: 'edit', id: t.dataset.id, editing: null, filter: '' }); break;
      case 'export': exportDeck(deck(V.id)); break;
      case 'ddel': d = deck(V.id); ask('Delete "' + d.title + '" and its progress? Export it first if you want to keep a copy.', 'Delete deck', function () { S.decks = S.decks.filter(function (x) { return x.id !== d.id; }); delete S.progress[d.id]; SEL.delete(d.id); save(); go({ name: 'home' }); }); break;
      case 'cnew': V.editing = 'new'; render(true); break;
      case 'cedit': V.editing = +t.dataset.i; render(true); break;
      case 'ccancel': V.editing = null; render(true); break;
      case 'csave': saveCard(); break;
      case 'cdel': d = deck(V.id); var ci = +t.dataset.i; ask('Delete question ' + (ci + 1) + '?', 'Delete card', function () { var c = d.cards.splice(ci, 1)[0], p = prog(d.id); delete p.cards[c.id]; p.best = null; V.editing = null; save(); render(true); }); break;
      case 'flip': V.flipped = !V.flipped; render(true); break;
      case 'mark': mark(V.cards[V.i], t.dataset.v); V.marks[V.cards[V.i].card.id] = t.dataset.v; step(1); break;
      case 'next': step(1); break;
      case 'prev': step(-1); break;
      case 'pick': pick(+t.dataset.i); break;
      case 'review': begin('flash', shuffle(V.kind === 'quiz' ? V.missed : V.learning), {}, V.ids); break;
      case 'again': var all = V.all; begin(V.kind === 'quiz' ? 'quiz' : 'flash', V.kind === 'quiz' ? shuffle(all) : all, V.opts, V.ids); break;
    }
  });
  function step(dir) {
    var n = V.i + dir;
    if (n >= V.cards.length) return V.name === 'flash' ? finishFlash() : (V.name === 'exam' ? finishExam(false) : finishQuiz());
    if (n < 0) return;
    V.i = n; V.flipped = false; V.picked = null; render();
  }
  function pick(k) {
    if (V.picked !== null) return;
    var it = V.cards[V.i], selected = LET[(it.optionOrder || [0, 1, 2, 3])[k]], ok = selected === it.card.answer;
    V.picked = k; V.answers.push({ item: it, ok: ok, selected: selected }); if (ok) V.score++;
    var p = prog(it.deckId);
    p.cards[it.card.id] = StudyLogic.review(p.cards[it.card.id], ok, Date.now());
    trackStudied(1);
    save(); render(true);
  }
  function saveCard() {
    var f = app.querySelector('form'), q = f.q.value.trim(), o = [0, 1, 2, 3].map(function (k) { return f['o' + k].value.trim(); }), a = (f.querySelector('input[name=ans]:checked') || {}).value, explanation = f.explanation.value.trim(), ref = f.ref.value.trim();
    var err = !q ? 'Enter the question.' : o.some(function (x) { return !x; }) ? 'Fill in all four options.' : !a ? 'Select the correct answer.' : '';
    if (err) { document.getElementById('ferr').textContent = err; return; }
    var d = deck(V.id);
    if (V.editing === 'new') { d.cards.push({ id: d.id + '.n' + uid(), question: q, options: o, answer: a, explanation: explanation, ref: ref }); prog(d.id).best = null; }
    else {
      var c = d.cards[V.editing], changed = c.question !== q || c.answer !== a || c.options.some(function (x, k) { return x !== o[k]; });
      if (changed) { delete prog(d.id).cards[c.id]; prog(d.id).best = null; }
      c.question = q; c.options = o; c.answer = a; c.explanation = explanation; c.ref = ref;
    }
    V.editing = null; save(); render(true); toast('Card saved');
  }
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.sel) { t.checked ? SEL.add(t.dataset.sel) : SEL.delete(t.dataset.sel); document.getElementById('bar').innerHTML = bar(); render(true); }
    else if ('selall' in t.dataset) { SEL = t.checked ? new Set(S.decks.map(function (d) { return d.id; })) : new Set(); render(true); }
    else if ('rename' in t.dataset) { var d = deck(V.id), v = t.value.trim(); if (v) { d.title = v; save(); toast('Renamed'); } else t.value = d.title; }
    else if (t.id === 'files' && t.files.length) { IMP.text = ''; readFiles(t.files); }
  });
  document.addEventListener('submit', function (e) { e.preventDefault(); });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'filter') {
      V.filter = e.target.value; var f = V.filter.toLowerCase();
      app.querySelectorAll('.crow').forEach(function (r) { r.hidden = !!f && r.dataset.text.indexOf(f) < 0; });
    } else if (e.target.id === 'deck-search') {
      homeFilter = e.target.value.trim(); var q = homeFilter.toLowerCase(), visible = 0;
      app.querySelectorAll('.deck[data-deck-name]').forEach(function (r) { r.hidden = !!q && r.dataset.deckName.indexOf(q) < 0; if (!r.hidden) visible++; });
      var count = document.getElementById('deck-result-count'), none = document.getElementById('search-empty');
      if (count) count.textContent = visible + ' ' + (visible === 1 ? 'deck' : 'decks');
      if (none) none.classList.toggle('on', visible === 0);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (modal.innerHTML && e.key === 'Escape') { e.preventDefault(); return closeModal(); }
    if (modal.innerHTML && e.key === 'Tab') {
      var focusable = Array.from(modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
      if (focusable.length) {
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || modal.innerHTML) return;
    if (V.name === 'flash') {
      if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
      else if ((e.key === ' ' || e.key === 'Enter') && e.target.closest('.flip')) { e.preventDefault(); V.flipped = !V.flipped; render(true); }
    } else if (V.name === 'quiz' || V.name === 'exam') {
      var k = 'abcd'.indexOf(e.key.toLowerCase()); if (k < 0) k = '1234'.indexOf(e.key);
      if (k >= 0 && V.picked === null) pick(k); else if ((e.key === 'Enter' || e.key === 'ArrowRight') && V.picked !== null) step(1);
    }
  });
  var tx = 0, ty = 0;
  document.addEventListener('touchstart', function (e) { if (e.target.closest('.flip')) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = 0; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (!tx || V.name !== 'flash') return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = 0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); step(dx < 0 ? 1 : -1); }
  });

  function boot() {
    return Promise.all([load(), loadStarterText()]).then(function (results) {
      var text = results[1];
      STARTER_DECKS = P.parseDecks(text).decks;
      seed();
      return applyDataMigrations().then(function () {
        applyTheme();
        render();
        registerServiceWorker();
      });
    });
  }
  boot();
})();

</script>
