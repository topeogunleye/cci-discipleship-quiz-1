name = "cci-discipleship-quiz"
compatibility_date = "2026-11-03"
pages_build_output_dir = "./dist"

[vars]
ALLOWED_APP_ORIGINS = "https://localhost,capacitor://localhost,http://localhost"
ESV_RATE_LIMIT_REQUIRED = "true"

[[ratelimits]]
name = "ESV_RATE_LIMITER"
namespace_id = "846209317"

  [ratelimits.simple]
  limit = 15
  period = 60

[[r2_buckets]]
binding = "LESSON_VIDEOS"
bucket_name = "cci-lesson-videos"
